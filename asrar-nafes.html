<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أسرار نافس | جوهرة ماث</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#422d78,#100d25 68%);color:#fff;min-height:100vh}.wrap{max-width:980px;margin:auto;padding:24px}header{text-align:center;padding:35px 8px}h1{font-size:clamp(30px,6vw,54px);color:#ffdc91;margin:8px}p{line-height:1.9}.sub{color:#c7d5ed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:13px}.tile,.panel{border:1px solid #8772b6;background:#261b48;border-radius:20px;padding:20px;box-shadow:0 8px 28px #0003}.tile{cursor:pointer;color:white;text-align:right;font:inherit;min-height:105px}.tile:hover,.tile:focus{border-color:#ffdc91;transform:translateY(-2px)}.num{color:#ffdc91;font-size:13px}.panel{max-width:760px;margin:18px auto}.btn{border:1px solid #a89ac9;border-radius:13px;padding:13px 18px;color:white;background:#45336e;font:inherit;cursor:pointer}.btn:hover{background:#634998}.choice{display:block;width:100%;text-align:right;margin:9px 0}.gold{background:#b98837;color:#171023;font-weight:bold;border:0}.bar{height:9px;background:#463763;border-radius:20px;overflow:hidden}.fill{height:100%;background:#efcb7b;transition:width .3s}.hint{padding:14px;background:#3c2e5b;border-radius:12px;margin-top:15px}.ok{color:#a4f1c2}.bad{color:#ffd5a5}.small{font-size:13px;color:#d0c6e6}button:focus-visible{outline:3px solid #f8df9e}#lesson{display:none}#back{margin-bottom:10px}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><div class="wrap"><header><div>💎 جوهرة ماث</div><h1>أسرار نافس</h1><p>افهمي السؤال • اكتشفي الاستراتيجية • أتقني الحل</p><button class="btn" id="mute">🔊 المؤثرات: تشغيل</button><p class="small">تدريبات أصلية مستوحاة من مهارات الرياضيات للصف السادس، وليست أسئلة رسمية من نافس</p></header><main id="home"><h2>اختاري السر الرياضي 🔐</h2><div class="grid" id="tiles"></div></main><section id="lesson" class="panel"><button class="btn" id="back">↩ العودة إلى الأسرار</button><div class="num" id="n"></div><h2 id="title"></h2><div class="bar"><div class="fill" id="fill"></div></div><div id="body"></div></section><footer style="text-align:center;padding:25px" class="small">إعداد المعلمة/ جواهر السبيعي – جوهرة ماث • نسخة أولية مستقلة للتجربة</footer></div><script>const D=[["فك شفرة المسألة","حددي المعطيات والمطلوب قبل الحساب.","اشترت مدرسة ٣ صناديق في كل منها ١٢ قلمًا. كم قلمًا؟","المعطيات: ٣ صناديق و١٢ قلمًا في كل صندوق. المطلوب: عدد الأقلام. نضرب ٣ × ١٢ = ٣٦.",["٣٦","١٥","٩","٤"],0,"نبحث عن إجمالي مجموعات متساوية."],["مفتاح العملية المناسبة","اسألي: هل نجمع أم نقارن أم نكرر أم نوزع؟","وزعت ٤٨ بطاقة بالتساوي على ٦ طالبات. كم بطاقة لكل طالبة؟","التوزيع بالتساوي يعني القسمة: ٤٨ ÷ ٦ = ٨.",["٦","٨","٤٢","٥٤"],1,"القسمة لأننا نوزع كمية معلومة على مجموعات متساوية."],["الكلمات الخادعة","الكلمة وحدها لا تحدد العملية؛ افهمي العلاقة.","مع نورة ١٧ قلمًا، وهي تزيد على سارة بـ٥. كم مع سارة؟","نورة هي الأكبر؛ نطرح الفرق لإيجاد الأصغر: ١٧ − ٥ = ١٢.",["٢٢","١٢","٨٥","٥"],1,"نطرح لأننا نعرف الأكبر والفرق."],["الرسم وتمثيل المعطيات","استخدمي شريطًا أو جدولًا لتوضيح العلاقة.","لدى ريم ٩ ملصقات، ولدى هند ضعفها. كم لدى هند؟","شريط ريم = ٩. شريط هند = ٩ + ٩ = ١٨.",["٩","١١","١٨","٨١"],2,"الضعف مجموعتان متساويتان."],["التخمين والتحقق","خمني ثم افحصي الشرط وعدلي التخمين.","عدد إذا ضربناه في ٤ كان الناتج ٢٨. ما العدد؟","نجرب ٦: الناتج ٢٤. نجرب ٧: الناتج ٢٨، إذن ٧.",["٦","٧","٨","٩"],1,"تحققي بضرب العدد المختار في ٤."],["الاستبعاد الذكي","احذفي البدائل التي تخالف المعطيات.","ما ناتج ٣٩ × ٦ تقريبًا؟","٤٠ × ٦ ≈ ٢٤٠، والنتيجة الدقيقة ٢٣٤.",["٢٣٤","٢٣٤٠","٤٥","١٣"],0,"استبعدي النتائج البعيدة جدًا عن ٢٤٠."],["التقدير","قرّبي لتعرفي حجم الناتج المتوقع.","قدري ناتج ١٩٨ + ٣٠٤.","٢٠٠ + ٣٠٠ = ٥٠٠ تقريبًا.",["٥٠","٥٠٠","٥٠٠٠","١٠٠"],1,"التقدير لا يعني بالضرورة الناتج الدقيق."],["معقولية الإجابة","قارني الناتج بحجم الأعداد والواقع.","قالت طالبة إن ٥٢ × ٩ = ٤٦٨٠. هل هذا معقول؟","٥٠ × ٩ ≈ ٤٥٠، إذن ٤٦٨٠ أكبر بكثير؛ الناتج الصحيح ٤٦٨.",["نعم","لا، الناتج نحو ٤٥٠","نعم لأنه عدد كبير","لا، الناتج ٤٦٨٠٠"],1,"استخدمي التقدير لكشف الخطأ."],["العمل عكسيًا","ابدئي من النتيجة وارجعي للخطوات السابقة.","أضيف ٧ إلى عدد فأصبح ٢٥. ما العدد؟","نعكس الجمع بالطرح: ٢٥ − ٧ = ١٨.",["٣٢","١٨","١٧٥","٧"],1,"العملية العكسية للجمع هي الطرح."],["اكتشاف الأنماط","ابحثي عن قاعدة ثابتة بين الحدود.","ما العدد التالي: ٣، ٦، ١٢، ٢٤، …؟","كل حد ضعف السابق؛ التالي ٢٤ × ٢ = ٤٨.",["٢٦","٣٦","٤٨","٦٠"],2,"افحصي الضرب وليس الفرق فقط."],["المسائل متعددة الخطوات","حددي ما يجب حسابه أولًا ثم ثانيًا.","اشترت معلمة ٤ علب، في كل علبة ٦ أقلام، ووزعتها على ٣ مجموعات بالتساوي. كم قلمًا لكل مجموعة؟","أولًا ٤ × ٦ = ٢٤ قلمًا؛ ثانيًا ٢٤ ÷ ٣ = ٨.",["٧","٨","١٣","٢٤"],1,"احسبي المجموع قبل التوزيع."],["اكتشاف الخطأ وتصحيحه","راجعي العملية والناتج معًا.","كتبت طالبة: ٣٦ ÷ ٤ = ٨. ما التصحيح؟","٤ × ٨ = ٣٢ وليس ٣٦؛ إذن ٣٦ ÷ ٤ = ٩.",["٨","٩","٣٢","٤٠"],1,"تحققي بالضرب العكسي."]];let idx=0,step=0,mute=false,ctx;const $=id=>document.getElementById(id);function sound(ok){if(mute)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(ok?660:220,ctx.currentTime);if(ok)o.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+.13);g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.23);o.start();o.stop(ctx.currentTime+.24)}catch(e){}}$('mute').onclick=()=>{mute=!mute;$('mute').textContent=mute?'🔇 المؤثرات: إيقاف':'🔊 المؤثرات: تشغيل'};function tiles(){let saved=JSON.parse(localStorage.getItem('asrar_done_v1')||'[]');$('tiles').innerHTML=D.map((x,i)=>'<button class="tile" data-i="'+i+'"><div class="num">السر '+(i+1)+'</div><h3>'+x[0]+'</h3><span class="small">'+(saved.includes(i)?'💎 تم اجتيازه':'اضغطي للاكتشاف')+'</span></button>').join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>open(+b.dataset.i))}function open(i){idx=i;step=0;$('home').style.display='none';$('lesson').style.display='block';$('n').textContent='السر '+(i+1)+' من ١٢';$('title').textContent=D[i][0];render();scrollTo(0,0)}$('back').onclick=()=>{$('lesson').style.display='none';$('home').style.display='block';tiles()};function render(){const d=D[idx];$('fill').style.width=(step+1)*25+'%';let b=$('body');if(step===0)b.innerHTML='<h3>🔎 اكتشفي السر</h3><p>'+d[1]+'</p><button class="btn gold" id="next">شاهدي المثال ←</button>';if(step===1)b.innerHTML='<h3>📘 مثال محلول</h3><p><strong>'+d[2]+'</strong></p><div class="hint">💡 '+d[3]+'</div><button class="btn gold" id="next">جربي بنفسك ←</button>';if(step===2)b.innerHTML='<h3>🎯 تحدي تفاعلي</h3><p>'+d[2]+'</p>'+d[4].map((v,j)=>'<button class="btn choice" data-answer="'+j+'">'+['أ','ب','ج','د'][j]+' • '+v+'</button>').join('')+'<div id="feedback" aria-live="polite"></div>';if(step===3)b.innerHTML='<h3>🏆 جوهرة الإتقان</h3><p class="ok">أحسنتِ! اكتشفتِ السر.</p><div class="hint">تذكري: '+d[6]+'</div><button class="btn gold" id="finish">العودة إلى خريطة الأسرار 💎</button>';let next=$('next');if(next)next.onclick=()=>{step++;render()};document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>{let ok=+el.dataset.answer===d[5];sound(ok);$('feedback').innerHTML=ok?'<p class="ok">✓ إجابة صحيحة! '+d[6]+'</p><button class="btn gold" id="advance">افتحي الجوهرة 💎</button>':'<p class="bad">حاولي مجددًا. تلميح: '+d[6]+'</p>';if(ok){document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);$('advance').onclick=()=>{step++;render()}}});let f=$('finish');if(f)f.onclick=()=>{let saved=JSON.parse(localStorage.getItem('asrar_done_v1')||'[]');if(!saved.includes(idx))saved.push(idx);localStorage.setItem('asrar_done_v1',JSON.stringify(saved));$('back').click()}}tiles();</script></body></html>
