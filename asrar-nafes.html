<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أسرار نافس | جوهرة ماث</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#422d78,#100d25 68%);color:#fff;min-height:100vh}.wrap{max-width:980px;margin:auto;padding:24px}header{text-align:center;padding:35px 8px}h1{font-size:clamp(30px,6vw,54px);color:#ffdc91;margin:8px}p{line-height:1.9}.sub{color:#c7d5ed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:13px}.tile,.panel{border:1px solid #8772b6;background:#261b48;border-radius:20px;padding:20px;box-shadow:0 8px 28px #0003}.tile{cursor:pointer;color:white;text-align:right;font:inherit;min-height:105px}.tile:hover,.tile:focus{border-color:#ffdc91;transform:translateY(-2px)}.num{color:#ffdc91;font-size:13px}.panel{max-width:760px;margin:18px auto}.btn{border:1px solid #a89ac9;border-radius:13px;padding:13px 18px;color:white;background:#45336e;font:inherit;cursor:pointer}.btn:hover{background:#634998}.choice{display:block;width:100%;text-align:right;margin:9px 0}.gold{background:#b98837;color:#171023;font-weight:bold;border:0}.bar{height:9px;background:#463763;border-radius:20px;overflow:hidden}.fill{height:100%;background:#efcb7b;transition:width .3s}.hint{padding:14px;background:#3c2e5b;border-radius:12px;margin-top:15px}.ok{color:#a4f1c2}.bad{color:#ffd5a5}.small{font-size:13px;color:#d0c6e6}button:focus-visible{outline:3px solid #f8df9e}#lesson{display:none}#back{margin-bottom:10px}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><div class="wrap"><header><div>💎 جوهرة ماث</div><h1>أسرار نافس</h1><p>افهمي السؤال • اكتشفي الاستراتيجية • أتقني الحل</p><button class="btn" id="mute">🔊 المؤثرات: تشغيل</button><p class="small">تدريبات أصلية مستوحاة من مهارات الرياضيات للصف السادس، وليست أسئلة رسمية من نافس</p></header><main id="home"><h2>اختاري السر الرياضي 🔐</h2><div class="grid" id="tiles"></div></main><section id="lesson" class="panel"><button class="btn" id="back">↩ العودة إلى الأسرار</button><div class="num" id="n"></div><h2 id="title"></h2><div class="bar"><div class="fill" id="fill"></div></div><div id="body"></div></section><footer style="text-align:center;padding:25px" class="small">إعداد المعلمة/ جواهر السبيعي – جوهرة ماث • ١٢ استراتيجية ذكية لحل أسئلة نافس</footer></div><script>const D=[["حددي المعطيات والمطلوب","اقرئي السؤال مرتين: ما المعلومات المعطاة؟ وما المطلوب تحديدًا؟","في ٥ أكياس ٤ كرات في كل كيس. كم كرة في الأكياس كلها؟","المعطيات: ٥ أكياس، وفي كل كيس ٤ كرات. المطلوب: المجموع؛ ٥ × ٤ = ٢٠.","في ٨ علب ٥ أقلام في كل علبة. كم قلمًا؟",["١٣","٣٥","٤٠","٨٥"],2,"ميّزي بين عدد المجموعات وما في كل مجموعة.","فهم السؤال","نضرب عدد العلب في الأقلام داخل كل علبة: ٨ × ٥ = ٤٠."],["اختاري العملية المناسبة","اختيار العملية يعتمد على العلاقة بين الكميات: مجموعات متساوية، توزيع، فرق، أو مقارنة.","مع سارة ١٧ قلمًا، وهي أكثر من نورة بـ٥ أقلام. كم قلمًا مع نورة؟","نورة أقل من سارة؛ نطرح الفرق: ١٧ − ٥ = ١٢.","وُزعت ٥٦ قطعة حلوى بالتساوي على ٧ طالبات. كم قطعة لكل طالبة؟",["٧","٨","٤٩","٦٣"],1,"التوزيع بالتساوي يعني القسمة.","فهم السؤال","٥٦ ÷ ٧ = ٨ قطع لكل طالبة."],["انتبهي للكلمات الخادعة","لا تختاري العملية من كلمة واحدة؛ اسألي كيف ترتبط الكميات ببعضها.","لدى ليلى ٤٠ ريالًا، وهذا ضعف ما لدى هدى. كم ريالًا لدى هدى؟","رغم كلمة «ضعف»، نعرف المبلغ الأكبر ونبحث عن نصفه: ٤٠ ÷ ٢ = ٢٠.","لدى نورة ٣٦ ملصقًا، وهو ضعف ما لدى أختها. كم ملصقًا لدى أختها؟",["١٢","١٨","٢٤","٧٢"],1,"إذا عرفتِ قيمة الضعف وتبحثين عن الأصل، اقسمي على ٢.","فهم السؤال","٣٦ ÷ ٢ = ١٨ ملصقًا."],["استبعدي البدائل المستحيلة","قدّري الناتج أو استخدمي خاصية العدد لاستبعاد الإجابات البعيدة، ثم احسبي بدقة.","أي إجابة أقرب إلى ٢٤٦ ÷ ٦؟","٢٤٦ قريبة من ٢٤٠، و٢٤٠ ÷ ٦ = ٤٠؛ إذن نبحث عن خيار قريب من ٤٠. الناتج الدقيق ٤١.","ما ناتج ٩٥٢ ÷ ٨؟",["١٠٩","١١٩","١٢٩","١١٩٠"],1,"قدّري ٩٦٠ ÷ ٨ قبل اختيار البديل.","اختيار البديل","٩٦٠ ÷ ٨ = ١٢٠ تقريبًا، والناتج الدقيق ١١٩."],["استخدمي المثال المضاد","لإثبات أن عبارة عامة غير صحيحة، يكفي إيجاد حالة واحدة تخالفها.","قالت طالبة: «كل عدد فردي عدد أولي». ما المثال المضاد؟","العدد ٩ فردي، لكنه ليس أوليًا؛ لأنه يقبل القسمة على ٣.","ما المثال المضاد لعبارة «كل مضاعفات ٥ تنتهي بصفر»؟",["١٠","١٥","٢٠","٣٠"],1,"اختاري مضاعفًا للعدد ٥ لا ينتهي بصفر.","اختيار البديل","١٥ مضاعف لـ٥ وينتهي بـ٥، فيبطل العبارة."],["قدّري قبل الحساب","قرّبي الأعداد لتعرفي حجم الإجابة المتوقع، ثم اختاري الأقرب أو تحققي بالحساب.","قدّري ٣٩٨ + ٢٠٥.","٣٩٨ ≈ ٤٠٠ و٢٠٥ ≈ ٢٠٠؛ المجموع يقارب ٦٠٠.","ما التقدير الأنسب لـ٤٩ × ٢١؟",["١٠٠","٥٠٠","١٠٠٠","٢٠٠٠"],2,"قرّبي ٤٩ إلى ٥٠ و٢١ إلى ٢٠.","اختيار البديل","٥٠ × ٢٠ = ١٠٠٠؛ والناتج الفعلي ١٠٢٩، وهو قريب منه."],["عوّضي بالخيارات","إذا كان الحل المباشر طويلًا، جرّبي البدائل في المعادلة حتى تحققي الطرفين.","أي قيمة تجعل ٣س + ٤ = ١٩ صحيحة؟","نجرب س = ٥: ٣ × ٥ + ٤ = ١٩؛ إذن س = ٥.","أي قيمة تحقق ٤س − ٢ = ٢٢؟",["٥","٦","٧","٨"],1,"عوّضي كل خيار عن س ثم احسبي.","اختيار البديل","٤ × ٦ − ٢ = ٢٢؛ إذن الخيار ٦ صحيح."],["اعملي بالعكس","ارجعي من الناتج إلى البداية، واستخدمي العمليات العكسية بترتيب معاكس.","عدد قُسم على ٥ ثم أضيف ٣، فأصبح ١١. ما العدد؟","نعكس الخطوات: ١١ − ٣ = ٨، ثم ٨ × ٥ = ٤٠.","عدد ضُرب في ٤ ثم أضيف إليه ٧، فأصبح ٣١. ما العدد؟",["٥","٦","٧","٨"],1,"اطرحي ٧ أولًا، ثم اقسمي الناتج على ٤.","طرق الحل","(٣١ − ٧) ÷ ٤ = ٦."],["ارسمي العلاقة","مثّلي المسألة بخط أعداد أو شريط أو جدول لتظهري العلاقة بين الكميات.","مجموع عددين ٣٦، أحدهما ضعف الآخر. ما العدد الأصغر؟","ارسمي ٣ أجزاء متساوية: جزء للأصغر وجزآن للأكبر. ٣٦ ÷ ٣ = ١٢.","مجموع عددين ٤٨، أحدهما ثلاثة أمثال الآخر. ما العدد الأصغر؟",["٨","١٠","١٢","١٦"],2,"يمثل المجموع ٤ أجزاء متساوية: جزء للصغير وثلاثة للكبير.","طرق الحل","٤٨ ÷ ٤ = ١٢."],["خمّني وتحققي","جرّبي قيمة قريبة، ثم عوّضي بها في شروط السؤال وعدّليها عند الحاجة.","عدد ضُرب في ٦ ثم طُرح منه ٥، فكان الناتج ٣٧. ما العدد؟","نجرب ٧: ٧ × ٦ − ٥ = ٤٢ − ٥ = ٣٧؛ إذن العدد ٧.","عدد ضُرب في ٥ ثم أضيف إليه ٤، فكان الناتج ٤٩. ما العدد؟",["٧","٨","٩","١٠"],2,"اختبري ٩: هل ٩ × ٥ + ٤ يساوي ٤٩؟","طرق الحل","٩ × ٥ + ٤ = ٤٩؛ إذن ٩ يحقق الشرط."],["اكتشفي النمط","قارني بين الحدود المتتابعة، وابحثي عن قاعدة تتكرر.","ما العدد التالي: ٣، ٦، ١٢، ٢٤، …؟","كل حد ضعف السابق؛ ٢٤ × ٢ = ٤٨.","ما العدد التالي: ٥، ١٠، ٢٠، ٤٠، …؟",["٤٥","٦٠","٨٠","١٠٠"],2,"تحققي هل كل حد ينتج من ضرب السابق في ٢.","تحققي من الإجابة","٤٠ × ٢ = ٨٠."],["تحققي من معقولية الإجابة","قارني الناتج بحجم الأعداد، واستخدمي التقدير أو العملية العكسية لكشف الخطأ.","كتبت طالبة: ٥٢ × ٩ = ٤٦٨٠. هل الناتج معقول؟","٥٠ × ٩ ≈ ٤٥٠؛ إذن ٤٦٨٠ كبير جدًا. الناتج الصحيح ٤٦٨.","قالت سارة: ١٩٨ ÷ ٢ = ٩٩٠. ما التصحيح؟",["نعم، ٩٩٠ صحيح","لا، الناتج ٩٩","لا، الناتج ٩٫٩","لا، الناتج ١٩٦"],1,"١٩٨ قريبة من ٢٠٠، ونصفها قريب من ١٠٠.","تحققي من الإجابة","١٩٨ ÷ ٢ = ٩٩؛ والتقدير يكشف أن ٩٩٠ غير معقول."]];let idx=0,step=0,mute=false,ctx;const $=id=>document.getElementById(id);function sound(ok){if(mute)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(ok?660:220,ctx.currentTime);if(ok)o.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+.13);g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.23);o.start();o.stop(ctx.currentTime+.24)}catch(e){}}$('mute').onclick=()=>{mute=!mute;$('mute').textContent=mute?'🔇 المؤثرات: إيقاف':'🔊 المؤثرات: تشغيل'};function tiles(){let saved=JSON.parse(localStorage.getItem('asrar_done_v1')||'[]');$('tiles').innerHTML=D.map((x,i)=>'<button class="tile" data-i="'+i+'"><div class="num">السر '+(i+1)+'</div><h3>'+x[0]+'</h3><span class="small">'+x[8]+'</span><span class="small">'+(saved.includes(i)?'💎 تم اجتيازه':'اضغطي للاكتشاف')+'</span></button>').join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>open(+b.dataset.i))}function open(i){idx=i;step=0;$('home').style.display='none';$('lesson').style.display='block';$('n').textContent='السر '+(i+1)+' من ١٢ • '+D[i][8];$('title').textContent=D[i][0];render();scrollTo(0,0)}$('back').onclick=()=>{$('lesson').style.display='none';$('home').style.display='block';tiles()};function render(){const d=D[idx];$('fill').style.width=(step+1)*25+'%';let b=$('body');if(step===0)b.innerHTML='<h3>🔎 اكتشفي السر</h3><p>'+d[1]+'</p><button class="btn gold" id="next">شاهدي المثال ←</button>';if(step===1)b.innerHTML='<h3>📘 مثال محلول</h3><p><strong>'+d[2]+'</strong></p><div class="hint">💡 '+d[3]+'</div><button class="btn gold" id="next">جربي بنفسك ←</button>';if(step===2)b.innerHTML='<h3>🎯 تحدي تفاعلي</h3><p>'+d[4]+'</p>'+d[5].map((v,j)=>'<button class="btn choice" data-answer="'+j+'">'+['أ','ب','ج','د'][j]+' • '+v+'</button>').join('')+'<div id="feedback" aria-live="polite"></div>';if(step===3)b.innerHTML='<h3>🏆 جوهرة الإتقان</h3><p class="ok">أحسنتِ! اكتشفتِ السر.</p><div class="hint">تذكري: '+d[7]+'</div><button class="btn gold" id="finish">العودة إلى خريطة الأسرار 💎</button>';let next=$('next');if(next)next.onclick=()=>{step++;render()};document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>{let ok=+el.dataset.answer===d[6];sound(ok);$('feedback').innerHTML=ok?'<p class="ok">✓ إجابة صحيحة! '+d[9]+'</p><button class="btn gold" id="advance">افتحي الجوهرة 💎</button>':'<p class="bad">حاولي مجددًا. تلميح: '+d[7]+'</p>';if(ok){document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);$('advance').onclick=()=>{step++;render()}}});let f=$('finish');if(f)f.onclick=()=>{let saved=JSON.parse(localStorage.getItem('asrar_done_v1')||'[]');if(!saved.includes(idx))saved.push(idx);localStorage.setItem('asrar_done_v1',JSON.stringify(saved));$('back').click()}}tiles();</script></body></html>
