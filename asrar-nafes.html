<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أسرار نافس | جوهرة ماث</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#422d78,#100d25 68%);color:#fff;min-height:100vh}.wrap{max-width:980px;margin:auto;padding:24px}header{text-align:center;padding:35px 8px}h1{font-size:clamp(30px,6vw,54px);color:#ffdc91;margin:8px}p{line-height:1.9}.sub{color:#c7d5ed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:13px}.tile,.panel{border:1px solid #8772b6;background:#261b48;border-radius:20px;padding:20px;box-shadow:0 8px 28px #0003}.tile{cursor:pointer;color:white;text-align:right;font:inherit;min-height:105px}.tile:hover,.tile:focus{border-color:#ffdc91;transform:translateY(-2px)}.num{color:#ffdc91;font-size:13px}.panel{max-width:760px;margin:18px auto}.btn{border:1px solid #a89ac9;border-radius:13px;padding:13px 18px;color:white;background:#45336e;font:inherit;cursor:pointer}.btn:hover{background:#634998}.choice{display:block;width:100%;text-align:right;margin:9px 0}.gold{background:#b98837;color:#171023;font-weight:bold;border:0}.bar{height:9px;background:#463763;border-radius:20px;overflow:hidden}.fill{height:100%;background:#efcb7b;transition:width .3s}.hint{padding:14px;background:#3c2e5b;border-radius:12px;margin-top:15px}.ok{color:#a4f1c2}.bad{color:#ffd5a5}.small{font-size:13px;color:#d0c6e6}button:focus-visible{outline:3px solid #f8df9e}#lesson{display:none}#back{margin-bottom:10px}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><div class="wrap"><header><div>💎 جوهرة ماث</div><h1>أسرار نافس</h1><p>افهمي السؤال • اكتشفي الاستراتيجية • أتقني الحل</p><button class="btn" id="mute">🔊 المؤثرات: تشغيل</button><p class="small">تدريبات أصلية مستوحاة من مهارات الرياضيات للصف السادس، وليست أسئلة رسمية من نافس</p></header><main id="home"><h2>اختاري السر الرياضي 🔐</h2><div class="grid" id="tiles"></div></main><section id="lesson" class="panel"><button class="btn" id="back">↩ العودة إلى الأسرار</button><div class="num" id="n"></div><h2 id="title"></h2><div class="bar"><div class="fill" id="fill"></div></div><div id="body"></div></section><footer style="text-align:center;padding:25px" class="small">إعداد المعلمة/ جواهر السبيعي – جوهرة ماث • ١٢ سرًا تدريبيًا في مجالات نافس الأربعة</footer></div><script>const D=[["فك شفرة المسألة","حددي ما نعرفه وما نبحث عنه، ثم اختاري العملية التي تمثل العلاقة.","في ٥ أكياس ٨ كرات في كل كيس. كم كرة في الأكياس كلها؟","لدينا مجموعات متساوية؛ نضرب ٥ × ٨ = ٤٠ كرة.","في ٧ علب ٦ أقلام في كل علبة. كم قلمًا؟",["١٣","٤٢","٤٩","٧٦"],1,"المجموعات المتساوية تعني الضرب: ٧ × ٦.","الأعداد والعمليات","نضرب عدد العلب في عدد الأقلام في كل علبة."],["حللي إلى عوامل أولية","اكتبي العدد على صورة حاصل ضرب أعداد أولية فقط.","حللي ٣٦ إلى عوامل أولية.","٣٦ = ٤ × ٩ = ٢ × ٢ × ٣ × ٣.","ما التحليل الأولي للعدد ٤٨؟",["٢ × ٢ × ٢ × ٣","٢ × ٢ × ٢ × ٢ × ٣","٢ × ٣ × ٣ × ٣","٤ × ٤ × ٣"],1,"ابدئي بالقسمة على أصغر عدد أولي، وهو ٢.","الأعداد والعمليات","نكرر القسمة على ٢ حتى نصل إلى ٣، فيكون ٢ × ٢ × ٢ × ٢ × ٣."],["اكتشفي القاسم المشترك الأكبر","فكري في أكبر عدد يقسم العددين دون باقٍ.","ما القاسم المشترك الأكبر للعددين ٢٤ و٣٦؟","عوامل ٢٤ تشمل ١٢، وعوامل ٣٦ تشمل ١٢؛ وهو أكبر عامل مشترك.","ما القاسم المشترك الأكبر للعددين ٣٠ و٤٥؟",["٥","١٠","١٥","٣٠"],2,"ابحثي عن أكبر عامل يقسم العددين معًا.","الأعداد والعمليات","١٥ يقسم ٣٠ و٤٥، ولا يوجد عامل مشترك أكبر منه."],["اكتشفي قاعدة النمط","قارني بين كل حد والذي يليه، وكرري القاعدة نفسها.","أكملي: ٤، ٧، ١٠، ١٣، …","نضيف ٣ كل مرة؛ الحد التالي ١٦.","أكملي: ٥، ٩، ١٣، ١٧، …",["٢٠","٢١","٢٢","٢٤"],1,"احسبي الفرق بين حدين متتاليين.","الجبر والتحليل","القاعدة إضافة ٤؛ ١٧ + ٤ = ٢١."],["عوّضي عن المتغير","استبدلي المتغير بقيمته، ثم اتبعي ترتيب العمليات.","إذا كانت س = ٤، فأوجدي ٣س + ٢.","نعوض: ٣ × ٤ + ٢ = ١٢ + ٢ = ١٤.","إذا كانت س = ٦، فما قيمة ٥س − ٣؟",["٢٤","٢٥","٢٧","٣٠"],2,"اضربي أولًا، ثم اطرحي ٣.","الجبر والتحليل","٥ × ٦ − ٣ = ٣٠ − ٣ = ٢٧."],["وازني المعادلة","اعكسي العمليات للوصول إلى قيمة المتغير، مع الحفاظ على توازن الطرفين.","حلي: ٢س + ٣ = ١٧.","نطرح ٣ من الطرفين: ٢س = ١٤، ثم نقسم على ٢؛ س = ٧.","حلي: ٤س − ٥ = ٢٣.",["٦","٧","٨","٩"],1,"أضيفي ٥ للطرفين أولًا، ثم اقسمي على ٤.","الجبر والتحليل","٤س − ٥ = ٢٣؛ نضيف ٥ فيصبح ٤س = ٢٨، إذن س = ٧."],["اختاري قانون المساحة","المساحة تقيس السطح داخل الشكل، وتكتب بوحدات مربعة.","ما مساحة مستطيل طوله ٧ سم وعرضه ٤ سم؟","مساحة المستطيل = الطول × العرض = ٧ × ٤ = ٢٨ سم².","ما مساحة مستطيل طوله ٩ م وعرضه ٦ م؟",["٤٥ م²","٥٤ م²","٥٦ م²","٦٠ م²"],1,"اضربي الطول في العرض.","الهندسة والقياس","٩ × ٦ = ٥٤؛ وحدة المساحة متر مربع."],["حوّلي وحدات القياس","حددي العلاقة بين الوحدتين، ثم اضربي أو اقسمي بعامل التحويل.","كم سنتيمترًا في ٢٫٥ متر؟","كل متر = ١٠٠ سم؛ إذن ٢٫٥ × ١٠٠ = ٢٥٠ سم.","كم جرامًا في ٣٫٥ كيلوجرام؟",["٣٥٠ جم","٣٥٠٠ جم","٣٥ جم","٣٠٠٥ جم"],1,"كل كيلوجرام يساوي ١٠٠٠ جرام.","الهندسة والقياس","٣٫٥ × ١٠٠٠ = ٣٥٠٠ جرام."],["احسبي حجم المجسم","حجم متوازي المستطيلات يساوي الطول × العرض × الارتفاع.","متوازي مستطيلات أبعاده ٥ سم، ٣ سم، ٢ سم. ما حجمه؟","الحجم = ٥ × ٣ × ٢ = ٣٠ سم³.","ما حجم متوازي مستطيلات أبعاده ٥ سم، ٣ سم، ٤ سم؟",["١٢ سم³","٢٠ سم³","٦٠ سم³","١٢٠ سم³"],2,"اضربي الأبعاد الثلاثة معًا.","الهندسة والقياس","٥ × ٣ × ٤ = ٦٠ سم³."],["أوجدي المتوسط الحسابي","اجمعي القيم ثم اقسمي المجموع على عددها.","أوجدي متوسط الدرجات: ٦، ٨، ١٠.","المجموع ٢٤، وعدد القيم ٣؛ المتوسط ٢٤ ÷ ٣ = ٨.","أوجدي متوسط القيم: ٦، ٨، ١٠، ١٢.",["٨","٩","١٠","٣٦"],1,"اجمعي القيم الأربع ثم اقسمي على ٤.","الإحصاء والاحتمالات","المجموع ٣٦؛ ٣٦ ÷ ٤ = ٩."],["قارني الوسيط والمدى","رتبي البيانات أولًا؛ الوسيط في المنتصف، والمدى أكبر قيمة ناقص أصغر قيمة.","أوجدي الوسيط والمدى للبيانات: ٢، ٥، ٧، ٩.","الوسيط = (٥ + ٧) ÷ ٢ = ٦، والمدى = ٩ − ٢ = ٧.","ما الوسيط والمدى للبيانات: ٤، ٦، ٨، ١٠، ١٢؟",["الوسيط ٦ والمدى ٨","الوسيط ٨ والمدى ٨","الوسيط ٨ والمدى ١٢","الوسيط ١٠ والمدى ٨"],1,"الوسيط هو القيمة الوسطى بعد الترتيب، والمدى هو الفرق بين الأكبر والأصغر.","الإحصاء والاحتمالات","القيمة الوسطى ٨، والمدى ١٢ − ٤ = ٨."],["احسبي فرصة الحدوث","الاحتمال = عدد النتائج المطلوبة ÷ عدد النتائج الكلية.","في كيس ٣ كرات حمراء و٢ زرقاء. ما احتمال سحب كرة حمراء؟","عدد الكرات ٥؛ احتمال الحمراء ٣ من ٥، أي ٣⁄٥.","في كيس ٤ كرات خضراء و٦ صفراء. ما احتمال سحب كرة خضراء؟",["٤⁄١٠","٦⁄١٠","٢⁄٣","١⁄٤"],0,"اقسمي عدد الكرات الخضراء على عدد الكرات كلها.","الإحصاء والاحتمالات","الاحتمال ٤⁄١٠، ويمكن تبسيطه إلى ٢⁄٥."]];let idx=0,step=0,mute=false,ctx;const $=id=>document.getElementById(id);function sound(ok){if(mute)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(ok?660:220,ctx.currentTime);if(ok)o.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+.13);g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.23);o.start();o.stop(ctx.currentTime+.24)}catch(e){}}$('mute').onclick=()=>{mute=!mute;$('mute').textContent=mute?'🔇 المؤثرات: إيقاف':'🔊 المؤثرات: تشغيل'};function tiles(){let saved=JSON.parse(localStorage.getItem('asrar_done_v1')||'[]');$('tiles').innerHTML=D.map((x,i)=>'<button class="tile" data-i="'+i+'"><div class="num">السر '+(i+1)+'</div><h3>'+x[0]+'</h3><span class="small">'+x[8]+'</span><span class="small">'+(saved.includes(i)?'💎 تم اجتيازه':'اضغطي للاكتشاف')+'</span></button>').join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>open(+b.dataset.i))}function open(i){idx=i;step=0;$('home').style.display='none';$('lesson').style.display='block';$('n').textContent='السر '+(i+1)+' من ١٢ • '+D[i][8];$('title').textContent=D[i][0];render();scrollTo(0,0)}$('back').onclick=()=>{$('lesson').style.display='none';$('home').style.display='block';tiles()};function render(){const d=D[idx];$('fill').style.width=(step+1)*25+'%';let b=$('body');if(step===0)b.innerHTML='<h3>🔎 اكتشفي السر</h3><p>'+d[1]+'</p><button class="btn gold" id="next">شاهدي المثال ←</button>';if(step===1)b.innerHTML='<h3>📘 مثال محلول</h3><p><strong>'+d[2]+'</strong></p><div class="hint">💡 '+d[3]+'</div><button class="btn gold" id="next">جربي بنفسك ←</button>';if(step===2)b.innerHTML='<h3>🎯 تحدي تفاعلي</h3><p>'+d[4]+'</p>'+d[5].map((v,j)=>'<button class="btn choice" data-answer="'+j+'">'+['أ','ب','ج','د'][j]+' • '+v+'</button>').join('')+'<div id="feedback" aria-live="polite"></div>';if(step===3)b.innerHTML='<h3>🏆 جوهرة الإتقان</h3><p class="ok">أحسنتِ! اكتشفتِ السر.</p><div class="hint">تذكري: '+d[7]+'</div><button class="btn gold" id="finish">العودة إلى خريطة الأسرار 💎</button>';let next=$('next');if(next)next.onclick=()=>{step++;render()};document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>{let ok=+el.dataset.answer===d[6];sound(ok);$('feedback').innerHTML=ok?'<p class="ok">✓ إجابة صحيحة! '+d[9]+'</p><button class="btn gold" id="advance">افتحي الجوهرة 💎</button>':'<p class="bad">حاولي مجددًا. تلميح: '+d[7]+'</p>';if(ok){document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);$('advance').onclick=()=>{step++;render()}}});let f=$('finish');if(f)f.onclick=()=>{let saved=JSON.parse(localStorage.getItem('asrar_done_v1')||'[]');if(!saved.includes(idx))saved.push(idx);localStorage.setItem('asrar_done_v1',JSON.stringify(saved));$('back').click()}}tiles();</script></body></html>
