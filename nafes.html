
<!-- تصميم عبقريات نافس الملكي -->
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --g:#073e38;
  --gold:#eac47d;
  --bg:#041d25;
}
body{
  color:#f7f1e6;
  font-family:Cairo,Tahoma,sans-serif;
  background:
    radial-gradient(ellipse at 10% 0%,#1a665c,transparent 45%),
    radial-gradient(ellipse at 95% 70%,#12404f,transparent 50%),
    #041d25;
}
header{
  position:relative;
  overflow:hidden;
  padding:35px 16px 40px;
  background:linear-gradient(145deg,#062d2d,#0b5145,#071d30);
  border-bottom:3px solid var(--gold);
  box-shadow:0 15px 45px #0005;
}
header h1{
  font-family:Alexandria,Tahoma,sans-serif;
  color:var(--gold);
  font-size:clamp(30px,6vw,56px);
  text-shadow:0 0 25px #eac47d44;
}
header p{color:#e4d6b7}
header>div:first-child{color:#cde8e2}
.royal-logo-wrap{
  width:min(68vw,260px);
  aspect-ratio:1;
  margin:25px auto;
  position:relative;
  display:grid;
  place-items:center;
  isolation:isolate;
}
.royal-ring{
  position:absolute;
  width:95%;
  aspect-ratio:1;
  border:1.5px solid var(--gold);
  border-radius:50%;
  animation:royalSpin 20s linear infinite;
}
.royal-ring::after{
  content:"✦";
  position:absolute;
  top:-17px;
  color:var(--gold);
  font-size:27px;
}
.royal-ring.second{
  width:110%;
  height:65%;
  border-color:#8de6ee;
  animation:royalOrbit 13s linear infinite;
}
.royal-logo{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 0 19px #83e8f575);
  animation:royalFloat 5s ease-in-out infinite;
}
.card{
  color:#f7f1e6;
  background:linear-gradient(145deg,#10483f,#092d38);
  border:1px solid #eac47d80;
  border-radius:24px;
  box-shadow:0 12px 35px #0004;
}
.card h2,.card h3{
  color:var(--gold);
}
.muted{color:#c7dcd9}
button{
  background:linear-gradient(125deg,#d7ab60,#ffe5a8);
  color:#153a34;
  border:1px solid #f6db9e;
  border-radius:13px;
  transition:transform .2s,filter .2s;
}
button:hover{
  transform:translateY(-2px);
  filter:brightness(1.07);
}
button.alt{
  background:#ffffff13;
  color:#fff3d6;
  border:1px solid #eac47d75;
}
input,textarea,select{
  color:#143c35;
  background:#fffdf7;
  border:1px solid #c9b88f;
  border-radius:12px;
}
.choice{
  background:#fff9e9;
  color:#16483d;
  border:1px solid #d4ae66;
  border-radius:15px;
}
.notice{
  color:#19493f;
  background:#e9f5ec;
  border:1px solid #c8ddce;
}
.notice.error{
  color:#8e3026;
  background:#fff0ec;
}
.question{
  border-top:1px solid #d9bb7e70;
  padding:20px 0;
}
table{
  color:#f7f1e6;
  display:block;
  overflow-x:auto;
}
th,td{border-bottom:1px solid #eac47d44}
#analyticsBars{
  overflow-x:auto;
}
footer{
  color:var(--gold);
  border-top:1px solid #eac47d50;
  padding:30px 15px;
}
@keyframes royalSpin{
  to{transform:rotate(360deg)}
}
@keyframes royalOrbit{
  from{transform:rotate(-25deg)}
  to{transform:rotate(335deg)}
}
@keyframes royalFloat{
  50%{transform:translateY(-12px)}
}
@media(max-width:600px){
  main{padding:12px}
  .card{padding:17px}
  .tabs button{font-size:14px;padding:12px 8px}
  .row>*{min-width:0}
}
@media(prefers-reduced-motion:reduce){
  .royal-ring,.royal-logo{
    animation:none!important;
  }
}
</style>

<script>
(function(){
  const header=document.querySelector('header');
  if(!header || header.querySelector('.royal-logo-wrap'))return;

  const wrap=document.createElement('div');
  wrap.className='royal-logo-wrap';

  const ring1=document.createElement('div');
  ring1.className='royal-ring';

  const ring2=document.createElement('div');
  ring2.className='royal-ring second';

  const logo=document.createElement('img');
  logo.className='royal-logo';
  logo.src='https://jawaher-math-games.vercel.app/jawhara-logo.png';
  logo.alt='شعار جوهرة ماث';
  logo.onerror=function(){
    this.style.display='none';
    const fallback=document.createElement('span');
    fallback.textContent='💎';
    fallback.style.fontSize='90px';
    wrap.append(fallback);
  };

  wrap.append(ring1,ring2,logo);
  const title=header.querySelector('h1');
  if(title){
    header.insertBefore(wrap,title);
  }else{
    header.append(wrap);
  }
})();
</script>
