;font-size:11px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.progress{height:12px;border-radius:20px;background:#ffffff20;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ef0df,#ffda81);transition:width .5s}.center{text-align:center}.hidden{display:none!important}.visual{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:18px;min-height:155px;padding:15px;background:#ffffff0a;border-radius:20px;margin:15px 0}.fraction{display:inline-flex;flex-direction:column;align-items:center;line-height:1.3;font-size:30px;font-weight:800;color:var(--gold);vertical-align:middle}.fraction .line{height:3px;width:55px;background:currentColor;margin:5px}.pie{width:125px;height:125px;border-radius:50%;border:4px solid #fff8;box-shadow:0 0 22px #76f5e750}.hundred{display:grid;grid-template-columns:repeat(10,1fr);width:150px;height:150px;border:2px solid #fff7;gap:1px;background:#ffffff33}.hundred i{background:#ffffff20}.hundred i.on{background:#70f0e3}.bar{display:flex;width:min(300px,90%);height:60px;border:3px solid #fff9;border-radius:10px;overflow:hidden}.bar i{flex:1;border-left:2px solid #fff7;background:#ffffff25}.bar i.on{background:#ffb7d9}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.option{padding:18px 8px;border:2px solid #6382a5;background:#18375b;color:#fff;border-radius:17px;font-size:20px;min-height:70px}.option:hover{border-color:var(--gold)}.option.selected{border-color:var(--gold);background:#66512e}.option.correct{border-color:#74f4be;background:#135a4a}.option.wrong{border-color:#ff8fa2;background:#692f48}.feedback{padding:16px;border-radius:16px;background:#122e4b;line-height:2;margin:15px 0;border:1px solid #ffffff45}.feedback.good{border-color:#74f4be}.feedback.bad{border-color:#ff9da9}.score{font-size:clamp(30px,6vw,50px);color:var(--gold);font-weight:800}.cert{background:linear-gradient(135deg,#fff8e1,#f8e2a6);color:#24304a;border:9px </style></head><body><div class="wrap"><header class="top"><div class="brand">💎 جوهرة ماث | رحلة الإتقان</div><div><button class="btn" id="sound" type="button">🔊 الصوت: يعمل</button> <button class="btn" id="home" type="button">🏠 العوالم</button></div></header><section class="hero"><span class="gem">💎</span><h1>جوهرة الكسور</h1><p>أربع عوالم ساحرة… اكتشفي، جرّبي، أتقني، وتألقّي!<br>الكسور الاعتيادية • العشرية • الأعداد الكسرية • العمليات والتحويلات</p></section><main id="app"></main><footer class="center tiny">مبادرة جوهرة ماث — المعلمة/ جواهر السبيعي<br>التقدم محفوظ على هذا الجهاز فقط، ولا يُرسل إلى المعلمة تلقائيًا.</footer></div><script>
'use strict';const KEY='jawhara-fractions-mastery-v1';const worlds=[{name:'مملكة الكسور الاعتيادية',icon:'🍕',desc:'البسط والمقام، التمثيل، التكافؤ، التبسيط والمقارنة.',color:'#70f0e3',lesson:'الكسر يصف جزءًا من كل متساوٍ. البسط هو عدد الأجزاء المختارة، والمقام عدد الأجزاء المتساوية كلها.',example:'٢⁄٤ يساوي ١⁄٢ لأننا لو قسمنا البيتزا إلى أربعة أجزاء وأخذنا اثنين، فقد أخذنا نصفها.',visual:'pie',qs:[['ما الكسر الذي يمثل جزءًا واحدًا من أربعة أجزاء متساوية؟',['١⁄٤','٤⁄١','١⁄٢','٣⁄٤'],0,'البسط ١ لأنه الجزء المختار، والمقام ٤ لأن الكل أربعة أجزاء.'],['أي كسر يكافئ ١⁄٢؟',['١⁄٣','٢⁄٤','٣⁄٤','١⁄٤'],1,'عند ضرب البسط والمقام في ٢ نحصل على ٢⁄٤.'],['ما أبسط صورة للكسر ٦⁄٨؟',['٣⁄٤','٢⁄٣','١⁄٤','٦⁄٤'],0,'نقسم البسط والمقام على ٢ فنحصل على ٣⁄٤.'],['أي الكسرين أكبر؟',['١⁄٤','٣⁄٤','متساويان','لا يمكن المقارنة'],1,'المقام متساوٍ؛ الكسر ذو البسط الأكبر هو الأكبر.'],['في الكسر ٣⁄٥، ماذا يمثل العدد ٥؟',['البسط','عدد الأجزاء المختارة','المقام','العدد الكلي الصحيح'],2,'المقام يوضح عدد الأجزاء المتساوية التي قُسم إليها الكل.'],['أي كسر أصغر من ١⁄٢؟',['٣⁄٤','٢⁄٣','١⁄٤','٤⁄٤'],2,'الربع أصغر من النصف.']]},{name:'مختبر الكسور العشرية',icon:'🔬',desc:'الأعشار والأجزاء من مئة، القيمة المنزلية، المقارنة والعمليات.',color:'#82caff',lesson:'الفاصلة العشرية تفصل الآحاد عن الأجزاء. أول منزلة بعدها أعشار، والثانية أجزاء من مئة.',example:'٠٫٢٥ = ٢٥ جزءًا من مئة = ١⁄٤، ويمكن تلوين ٢٥ مربعًا من شبكة مئة.',visual:'hundred',qs:[['ما قيمة الرقم ٧ في ٠٫٧٣؟',['٧ آحاد','٧ أعشار','٧ أجزاء من مئة','٧ عشرات'],1,'الرقم الأول بعد الفاصلة يمثل الأعشار.'],['أي العددين أكبر؟',['٠٫٦','٠٫٥٨','متساويان','٠٫٠٦'],0,'٠٫٦ = ٠٫٦٠، وهو أكبر من ٠٫٥٨.'],['ما ناتج ٠٫٣ + ٠٫٢؟',['٠٫٥','٠٫٣٢','٥','٠٫١'],0,'ثلاثة أعشار زائد عُشرين = خمسة أعشار.'],['ما ناتج ١٫٢ − ٠٫٤؟',['١٫٦','٠٫٨','٠٫٢','٨'],1,'١٢ عشرًا ناقص ٤ أعشار = ٨ أعشار.'],['ما ناتج ٠٫٥ × ٢؟',['٠٫١','١','١٠','٠٫٧'],1,'نصف مضروب في اثنين يساوي واحدًا كاملًا.'],['ما ناتج ١٫٢ ÷ ٣؟',['٤','٠٫٤','٠٫٣','٣٫٦'],1,'١٢ عشرًا مقسومة على ٣ = ٤ أعشار.']]},{name:'جزيرة الأعداد الكسرية',icon:'🏝️',desc:'الأعداد الكسرية، الكسور غير الفعلية، التمثيل والتحويل.',color:'#ff9bd8',lesson:'العدد الكسري يجمع عددًا صحيحًا وكسرًا. الكسر غير الفعلي بسطه أكبر من مقامه أو يساويه.',example:'١ و١⁄٢ = ٣⁄٢؛ لأن الواحد الكامل يساوي ٢⁄٢ ثم نضيف ١⁄٢.',visual:'bar',qs:[['ما الكسر غير الفعلي المكافئ لـ ١ و١⁄٢؟',['٢⁄٣','٣⁄٢','١⁄٣','٤⁄٢'],1,'١ × ٢ + ١ = ٣، ونبقي المقام ٢.'],['ما العدد الكسري المكافئ لـ ٧⁄٣؟',['٢ و١⁄٣','١ و٢⁄٣','٣ و١⁄٢','٢ و٢⁄٣'],0,'٧ ÷ ٣ = ٢ والباقي ١؛ إذن ٢ و١⁄٣.'],['أي مما يلي كسر غير فعلي؟',['٢⁄٥','٣⁄٧','٩⁄٤','١⁄٣'],2,'٩ أكبر من ٤، إذن البسط أكبر من المقام.'],['ما الكسر غير الفعلي المكافئ لـ ٢ و٣⁄٤؟',['٨⁄٤','١١⁄٤','٥⁄٤','٩⁄٤'],1,'٢ × ٤ + ٣ = ١١، والمقام ٤.'],['ما العدد الكسري المكافئ لـ ٥⁄٢؟',['١ و١⁄٢','٢ و١⁄٢','٣ و١⁄٢','٢ و٢⁄٥'],1,'٥ ÷ ٢ = ٢ والباقي ١.'],['ما الكسر غير الفعلي المكافئ للعدد ٣؟',['٣⁄٣','٦⁄٣','٩⁄٣','١⁄٣'],2,'ثلاثة أعداد كاملة، كل منها ٣⁄٣، تساوي ٩⁄٣.']]},{name:'قلعة العمليات والتحويلات',icon:'🏰',desc:'الجمع والطرح والضرب والقسمة والتحويل بين صور الكسور.',color:'#ffda8a',lesson:'لجمع الكسور ذات المقام نفسه نجمع البسطين. ولجمع مقامين مختلفين نوحّد المقامات أولًا. في الضرب نضرب البسطين والمقامين، وفي القسمة نضرب في مقلوب المقسوم عليه.',example:'١⁄٢ + ١⁄٤ = ٢⁄٤ + ١⁄٤ = ٣⁄٤. و١⁄٢ × ١⁄٣ = ١⁄٦.',visual:'pie',qs:[['ما ناتج ١⁄٤ + ٢⁄٤؟',['٣⁄٨','٣⁄٤','٢⁄٤','١⁄٤'],1,'المقامات متساوية؛ نجمع البسطين ونبقي المقام.'],['ما ناتج ١⁄٢ + ١⁄٤؟',['٢⁄٦','١⁄٦','٣⁄٤','٢⁄٤'],2,'نحوّل النصف إلى ٢⁄٤ ثم نجمع لنحصل على ٣⁄٤.'],['ما ناتج ٣⁄٤ − ١⁄٤؟',['١⁄٢','٢⁄٨','٤⁄٤','١⁄٤'],0,'٢⁄٤ وتساوي ١⁄٢ بعد التبسيط.'],['ما ناتج ١⁄٢ × ٢⁄٣؟',['٣⁄٥','١⁄٣','٢⁄٥','٣⁄٢'],1,'نضرب ١ × ٢ و٢ × ٣ ثم نبسّط ٢⁄٦ إلى ١⁄٣.'],['ما ناتج ١⁄٢ ÷ ١⁄٤؟',['١⁄٨','١⁄٢','٢','٤'],2,'نضرب ١⁄٢ في مقلوب ١⁄٤ وهو ٤⁄١، فنحصل على ٢.'],['ما الصورة العشرية للكسر ٣⁄٤؟',['٠٫٣٤','٠٫٧٥','٠٫٢٥','٠٫٤٣'],1,'٣ ÷ ٤ = ٠٫٧٥.']]}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{name:'',worlds:{}}}catch{state={name:'',worlds:{}}}let current=-1,phase='',idx=0,answers=[],selected=null,locked=false,sound=true;const app=document.getElementById('app');const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[+d]);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function beep(ok=true){if(!sound)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=ok?720:240;g.gain.value=.07;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.13);o.onended=()=>c.close()}catch{}}function party(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<22;i++){let e=document.createElement('span');e.className='confetti';e.textContent=['✨','💎','⭐','🎉'][i%4];e.style.left=Math.random()*95+'vw';e.style.animationDelay=Math.random()+'s';document.body.append(e);setTimeout(()=>e.remove(),4300)}}function set(html){app.innerHTML=html;window.scrollTo({top:0,behavior:'smooth'})}function btn(text,fn,cls='btn primary'){let b=document.createElement('button');b.className=cls;b.textContent=text;b.onclick=fn;return b}function addButtons(...buttons){let div=document.createElement('div');div.className='actions';buttons.forEach(b=>div.append(b));app.lastElementChild.append(div)}function record(){return state.worlds[current]||(state.worlds[current]={})}function overview(){current=-1;const completed=worlds.filter((_,i)=>state.worlds[i]?.post>=90).length;set(`<section class="panel center"><h2>✨ مرحبًا بكِ في عالم الكسور</h2><p>اختاري عالمك، واكتشفي مهاراتك بالاختبار القبلي ثم الشرح والتدريب والاختبار البعدي.</p><label for="student">اسم البطلة (يظهر في الشهادة)</label><p><input id="student" maxlength="65" placeholder="اكتبي اسمك هنا" value="${esc(state.name)}" style="width:min(100%,400px);padding:14px;border-radius:14px;border:2px solid #8ae9db;background:#fff;color:#10243a"></p><p class="tiny">إتقان العالم يبدأ من ٩٠٪. أعيدي المحاولة للوصول إلى ١٠٠٪.</p><div class="progress"><span style="width:${completed*25}%"></span></div><p>العوالم المتقنة: ${ar(completed)} من ٤</p></section><section class="grid">${worlds.map((w,i)=>{let r=state.worlds[i]||{};return `<article class="world"><div class="emoji">${w.icon}</div><h2>${w.name}</h2><p>${w.desc}</p><span class="pill">${r.post>=90?'🏆 متقن':r.post!==undefined?'نتيجة بعدية: '+ar(r.post)+'٪':r.pre!==undefined?'الاختبار القبلي: '+ar(r.pre)+'٪':'ابدئي الاكتشاف'}</span><div class="actions"><button class="btn primary" data-world="${i}">${r.pre===undefined?'ابدئي الرحلة':'تابعي / أعيدي الرحلة'}</button></div></article>`}).join('')}</section><section class="panel center"><h2>🏆 شهادة الإتقان الشاملة</h2><p>بعد إتقان العوالم الأربعة بنسبة ٩٠٪ فأكثر، تُفتح الشهادة النهائية.</p><button class="btn primary" id="finalcert" ${completed===4?'':'disabled'}>🎓 عرض الشهادة النهائية</button></section>`);document.getElementById('student').oninput=e=>{state.name=e.target.value;save()};document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{if(!state.name.trim()){alert('اكتبي اسمك أولًا لتظهر شهادتك بصورة صحيحة.');document.getElementById('student').focus();return}current=+b.dataset.world;startWorld()});document.getElementById('finalcert').onclick=()=>certificate(true)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function startWorld(){let w=worlds[current],r=record();set(`<section class="panel center"><div style="font-size:65px">${w.icon}</div><h2 style="color:var(--gold)">${w.name}</h2><p>${w.desc}</p><p>🔎 اختبار قبلي من ٦ أسئلة، ثم شرح وتدريب تفاعلي، ثم اختبار بعدي من ٦ أسئلة.</p>${r.pre!==undefined?`<p>نتيجتك السابقة في الاختبار القبلي: ${ar(r.pre)}٪</p>`:''}${r.post!==undefined?`<p>أفضل نتيجة بعدية: ${ar(r.post)}٪</p>`:''}</section>`);addButtons(btn('🔎 ابدئي الاختبار القبلي',()=>startQuiz('pre')),btn('📖 ابدئي الشرح والتدريب',lesson,'btn'),btn('🏆 الاختبار البعدي',()=>startQuiz('post'),'btn'),btn('↩ العوالم',overview,'btn'))}function visual(type){if(type==='pie')return `<div class="pie" style="background:conic-gradient(#70f0e3 0 50%,#ffffff20 50% 100%)"></div><span class="fraction"><span>١</span><span class="line"></span><span>٢</span></span><p>نصف الدائرة ملون: جزء من جزأين متساويين</p>`;if(type==='hundred')return `<div class="hundred">${Array.from({length:100},(_,i)=>`<i class="${i<25?'on':''}"></i>`).join('')}</div><p>٢٥ مربعًا من ١٠٠ = ٠٫٢٥ = ١⁄٤</p>`;return `<div class="bar"><i class="on"></i><i class="on"></i></div><div class="bar"><i class="on"></i><i></i></div><p>واحد كامل ونصف = ١ و١⁄٢ = ٣⁄٢</p>`}function lesson(){let w=worlds[current];set(`<section class="panel"><h2>📖 اكتشفي الفكرة: ${w.name}</h2><p style="line-height:2.3">${w.lesson}</p><div class="visual">${visual(w.visual)}</div><div class="feedback good">💡 <strong>مثال محلول:</strong> ${w.example}</div><p>🎮 جرّبي الآن: أجيبي عن الأسئلة، وعند الخطأ يظهر الشرح وتستطيعين تغيير إجابتك قبل الانتقال.</p></section>`);addButtons(btn('🎮 ابدئي التدريب',()=>startQuiz('practice')),btn('🏆 انتقلي للاختبار البعدي',()=>startQuiz('post'),'btn'),btn('↩ العودة',startWorld,'btn'))}function startQuiz(p){phase=p;idx=0;answers=[];selected=null;locked=false;renderQ()}function renderQ(){const w=worlds[current],q=w.qs[idx];if(!q){finish();return}selected=null;locked=false;set(`<section class="panel"><div class="tiny">${phase==='pre'?'🔎 الاختبار القبلي':phase==='post'?'🏆 الاختبار البعدي':'🎮 تدريب مع تصحيح'} | ${w.name}</div><h2>السؤال ${ar(idx+1)} من ${ar(w.qs.length)}</h2><div class="progress"><span style="width:${idx/w.qs.length*100}%"></span></div><h2 style="line-height:2;color:var(--gold)">${q[0]}</h2><div class="options">${q[1].map((v,i)=>`<button class="option" data-a="${i}">${v}</button>`).join('')}</div><div id="feedback"></div><div class="actions" id="controls"></div></section>`);document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>choose(+b.dataset.a))}function choose(a){if(locked)return;let q=worlds[current].qs[idx],correct=a===q[2],fb=document.getElementById('feedback'),controls=document.getElementById('controls');selected=a;document.querySelectorAll('[data-a]').forEach(b=>{b.classList.toggle('selected',+b.dataset.a===a);b.classList.remove('correct','wrong')});if(phase==='practice'){if(correct){locked=true;beep(true);document.querySelector(`[data-a="${a}"]`).classList.add('correct');fb.className='feedback good';fb.textContent='🌟 أحسنتِ! '+q[3];controls.replaceChildren(btn('السؤال التالي ←',next))}else{beep(false);document.querySelector(`[data-a="${a}"]`).classList.add('wrong');fb.className='feedback bad';fb.textContent='💡 لنتعلم من المحاولة: '+q[3]+' اختاري إجابة جديدة لتكملي.';controls.replaceChildren()}}else{locked=true;answers.push(correct?1:0);beep(correct);document.querySelector(`[data-a="${a}"]`).classList.add(correct?'correct':'wrong');fb.className='feedback '+(correct?'good':'bad');fb.textContent=correct?'🌟 إجابة صحيحة!':'تم تسجيل الإجابة. ستتعلمين التفسير في مرحلة الشرح والتدريب.';controls.replaceChildren(btn('السؤال التالي ←',next))}}function next(){idx++;renderQ()}function finish(){let w=worlds[current],r=record();if(phase==='practice'){set(`<section class="panel center"><div style="font-size:65px">🎉</div><h2>أكملتِ التدريب!</h2><p>تعلمتِ من الإجابات، وأصبحتِ جاهزة لقياس تقدمك.</p></section>`);party();addButtons(btn('🏆 الاختبار البعدي',()=>startQuiz('post')),btn('↩ عودة للمسار',startWorld,'btn'));return}let percent=Math.round(answers.reduce((a,b)=>a+b,0)/w.qs.length*100);if(phase==='pre'){r.pre=percent;save();set(`<section class="panel center"><h2>🔎 نتيجة الاختبار القبلي</h2><div class="score">${ar(percent)}٪</div><p>هذه نقطة البداية، وليست نهاية رحلتك. اكتشفي الشرح والتدريب ثم أعيدي القياس.</p></section>`);addButtons(btn('📖 الشرح والتدريب',lesson),btn('↩ العودة',startWorld,'btn'))}else{r.post=Math.max(percent,r.post||0);r.lastPost=percent;save();let delta=r.pre===undefined?null:percent-r.pre;set(`<section class="panel center"><div style="font-size:65px">${percent>=90?'🏆':'💪'}</div><h2>نتيجة الاختبار البعدي</h2><div class="score">${ar(percent)}٪</div><p>الاختبار القبلي: ${r.pre===undefined?'لم يُؤدَّ':ar(r.pre)+'٪'} | مقدار التغير: ${delta===null?'غير متاح':(delta>=0?'+':'')+ar(delta)+' نقطة مئوية'}</p><p>${percent>=90?'مبارك! حققتِ معيار الإتقان في هذا العالم.':'أحسنتِ المحاولة! راجعي الشرح والتدريب ثم أعيدي الاختبار للوصول إلى ٩٠٪.'}</p><p class="tiny">أفضل نتيجة بعدية محفوظة: ${ar(r.post)}٪</p></section>`);if(percent>=90)party();addButtons(btn('🎓 شهادة هذا العالم',()=>certificate(false),'btn primary'),btn('📖 أعيدي التدريب',lesson,'btn'),btn('🔁 أعيدي الاختبار',()=>startQuiz('post'),'btn'),btn('🌍 العوالم',overview,'btn'))}}function certificate(all){let ok=all?worlds.every((_,i)=>state.worlds[i]?.post>=90):record().post>=90;if(!ok){alert('تُفتح الشهادة عند تحقيق ٩٠٪ في العالم المطلوب.');return}let title=all?'إتقان عوالم الكسور الأربعة':worlds[current].name;let rows=all?worlds.map((w,i)=>`<p>${w.icon} ${w.name}: ${ar(state.worlds[i].post)}٪</p>`).join(''):`<p>الاختبار القبلي: ${record().pre===undefined?'غير متاح':ar(record().pre)+'٪'}</p><p>أفضل نتيجة بعدية: ${ar(record().post)}٪</p>`;set(`<section class="panel certificate-panel"><div class="cert"><div class="big">💎🏆💎</div><h2>شهادة إتقان</h2><p>تُمنح للطالبة المتميزة</p><h2>${esc(state.name)}</h2><p>لإتمام <strong>${title}</strong> وتحقيق معيار الإتقان</p>${rows}<p>أكاديمية الإتقان | جوهرة ماث</p><p><strong>المعلمة/ جواهر السبيعي</strong></p><small>تُشارك الطالبة الشهادة مع المعلمة بنفسها</small></div></section>`);addButtons(btn('🖨️ طباعة / حفظ PDF',()=>window.print()),btn('↩ العودة للعوالم',overview,'btn'))}document.getElementById('home').onclick=overview;document.getElementById('sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊 الصوت: يعمل':'🔇 الصوت: صامت'};overview();
</script></body></html>
