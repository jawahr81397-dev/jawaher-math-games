<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171239"><title>آلة المفاجآت | استراحة جواهر</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
:root{--bg:#171239;--ink:#fff9ff;--pink:#ff7dbb;--gold:#ffe49b;--purple:#9b8eff;--turq:#7ff6ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Cairo,Tahoma,sans-serif;background:radial-gradient(ellipse at 15% 10%,#513d8d 0,transparent 42%),radial-gradient(ellipse at 90% 70%,#6c316e 0,transparent 45%),var(--bg)}.page{max-width:1040px;margin:auto;padding:20px 17px 50px}header{text-align:center}header .pill{display:inline-block;padding:5px 17px;border:1px solid #f6d3ff88;border-radius:50px;background:#ffffff18;font-weight:800;color:var(--gold)}h1{font-size:clamp(29px,5.5vw,54px);margin:8px 0 0;color:var(--gold);text-shadow:0 3px 16px #ff9c7f55}header p{margin:2px 0 13px;color:#e6dfff}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px auto 15px;align-items:center}select,button{font:700 15px Cairo,Tahoma,sans-serif;border-radius:14px;border:1px solid #ffffff65;padding:10px 14px}select{background:#312756;color:white;max-width:100%}button{cursor:pointer;transition:transform .15s,filter .2s}button:hover{filter:brightness(1.09)}button:active{transform:scale(.96)}button:focus-visible,select:focus-visible{outline:3px solid var(--turq)}.toggle{background:#ffffff1d;color:white}.scene{position:relative;display:flex;align-items:center;flex-direction:column;justify-content:center;min-height:405px;overflow:hidden}.machine{position:relative;width:275px;height:357px;filter:drop-shadow(0 16px 18px #080b254f)}.dome{position:absolute;width:247px;height:225px;left:14px;top:7px;border-radius:49% 49% 30% 30%;border:9px solid #ffd4ec;background:radial-gradient(ellipse at 33% 26%,#ffffffa8,#ffffff15 27%,transparent 60%),linear-gradient(135deg,#d9e8ff55,#a98aff38 52%,#76ddff55);box-shadow:inset -12px -10px 20px #381d7370,0 0 26px #ffc3e75f;overflow:hidden}.shine{position:absolute;width:60px;height:125px;border-radius:50%;top:15px;right:25px;transform:rotate(20deg);background:#ffffff35;filter:blur(8px)}.capsule{position:absolute;width:49px;height:49px;border-radius:50%;border:3px solid #ffffffaf;box-shadow:inset -6px -6px 9px #2b166b5c,0 3px 6px #35215877;display:grid;place-items:center;font-size:20px;transition:transform .25s}.capsule:after{content:'';position:absolute;width:10px;height:7px;border-radius:100%;background:#ffffff8a;right:9px;top:8px}.c1{background:#ff7eae;left:20px;top:118px}.c2{background:#63dbe0;left:73px;top:133px}.c3{background:#ffcb67;left:130px;top:123px}.c4{background:#aa99ff;left:174px;top:120px}.c5{background:#ff9d64;left:40px;top:79px}.c6{background:#a0e89e;left:90px;top:84px}.c7{background:#ed9ef8;left:146px;top:80px}.c8{background:#83acff;left:95px;top:37px}.base{position:absolute;width:268px;left:3px;top:214px;height:138px;border:8px solid #ffe1f1;border-radius:18px 18px 33px 33px;background:linear-gradient(130deg,#ff7aae,#c450b5 70%,#8b4baa);box-shadow:inset 0 6px #ffffff60}.base:before{content:'✨ مفاجأة! ✨';position:absolute;top:20px;right:56px;background:#fff0fc;padding:5px 10px;border-radius:10px;color:#7c3681;font-weight:900}.knob{position:absolute;left:27px;top:17px;width:44px;height:44px;border:9px solid #ffe5b5;background:#ad77ff;border-radius:50%;box-shadow:0 3px 5px #2b1e4959}.slot{position:absolute;bottom:14px;right:92px;width:77px;height:42px;border-radius:14px 14px 22px 22px;border:7px solid #ffe2b5;background:#452653}.machine.shaking .capsule{animation:jiggle .22s linear infinite alternate}.machine.shaking{animation:shake .14s infinite alternate}.machine.shaking .knob{animation:spin .35s linear infinite}@keyframes jiggle{to{transform:translate(var(--x,12px),-22px) rotate(45deg)}}@keyframes shake{to{transform:translateX(5px) rotate(1deg)}}@keyframes spin{to{transform:rotate(360deg)}}.primary{margin:0 auto 10px;display:block;background:linear-gradient(120deg,#ffe48e,#ff9eae);font-size:19px;color:#35204d;padding:12px 35px;border:2px solid #fff6cf;box-shadow:0 8px 23px #ef79ae4a;font-weight:900}.primary:disabled{opacity:.65;cursor:wait}.hint{text-align:center;font-size:13px;color:#ddd1f0}.result{display:none;max-width:700px;margin:14px auto 0;padding:24px 20px;background:linear-gradient(145deg,#533a92,#36245f);border:2px solid #ffe49b;border-radius:27px;box-shadow:0 12px 45px #110b2e;animation:reveal .5s ease both;text-align:center}.result.show{display:block}@keyframes reveal{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}.result .emoji{font-size:51px}.result .label{color:var(--turq);font-weight:900}.result h2{font-size:clamp(22px,4vw,33px);margin:5px 0;color:var(--gold)}.result p{font-size:clamp(17px,2.8vw,23px);line-height:1.9;margin:7px 0}.small{font-size:13px!important;color:#ddd7ff}.result .again{background:#ffffff19;color:white;margin-top:9px}.footer{text-align:center;margin-top:20px;font-size:12px;color:#e2d7ee}.confetti{position:fixed;z-index:10;top:-15px;pointer-events:none;animation:fall 2.3s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(640deg);opacity:0}}@media(max-width:600px){.scene{min-height:375px}.machine{transform:scale(.92)}.machine.shaking{animation:shake .14s infinite alternate}.controls{gap:6px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition:none!important}}
</style></head><body><div class="page"><header><div class="pill">💎 استراحة جواهر • أنشطة حصص الانتظار</div><h1>🎰 آلة المفاجآت</h1><p>كرة واحدة… وتحدٍّ جديد يغيّر جو الفصل! 🎉</p></header><div class="controls"><label for="level">الفئة:</label><select id="level"><option value="all">كل صفوف الابتدائي</option><option value="little">أول – ثالث</option><option value="big">رابع – سادس</option></select><label for="kind">نوع المفاجأة:</label><select id="kind"><option value="all">خلطة مفاجآت 😄</option><option value="fun">حركة وضحك</option><option value="brain">ذكاء وتفكير</option><option value="team">تعاون وتحديات</option></select><button class="toggle" id="sound">🔊 الصوت: يعمل</button></div><div class="scene"><div class="machine" id="machine" aria-hidden="true"><div class="dome"><div class="shine"></div><div class="capsule c1">⭐</div><div class="capsule c2">🎲</div><div class="capsule c3">🏆</div><div class="capsule c4">🎭</div><div class="capsule c5">🎤</div><div class="capsule c6">💎</div><div class="capsule c7">🌈</div><div class="capsule c8">🎁</div></div><div class="base"><div class="knob"></div><div class="slot"></div></div></div></div><button id="draw" class="primary">🎁 اسحبوا المفاجأة!</button><p class="hint">اختاروا ممثلًا للمجموعة أو شاركوا كلّكم • لا تصوير ولا تسجيل دخول</p><section class="result" id="result" aria-live="polite"><div class="emoji" id="emoji">🎉</div><div class="label" id="tag"></div><h2 id="title"></h2><p id="task"></p><p class="small" id="time"></p><button class="again" id="again">🔄 مفاجأة ثانية</button></section><div class="footer">✨ جوهرة ماث | إعداد المعلمة/ جواهر السبيعي ✨</div></div>
<script>
const items=[
['fun','all','🎭','تمثال الضحكة','اختاروا حركة مضحكة وثبّتوها مثل التمثال لخمس ثوانٍ.','دقيقة'],
['fun','all','🎤','إذاعة الحماس','قولوا جملة ترحيب بفريقكم بصوت مذيع متحمّس!','دقيقة'],
['fun','all','👏','إيقاع جماعي','اخترعوا تصفيقًا من ثلاث حركات، وخلّوا الفصل يقلّده.','دقيقتان'],
['fun','all','🧊','تجمّد!','تحركوا في أماكنكم ثم تجمّدوا عند كلمة «ثابت»!','دقيقة'],
['fun','all','🚀','رحلة للفضاء','مثّلوا الاستعداد لإطلاق صاروخ، ثم عدّوا تنازليًا من ١٠.','دقيقتان'],
['fun','all','🎬','الفيلم الصامت','مثّلوا مهنةً بلا كلام، وعلى الفصل تخمينها.','دقيقتان'],
['fun','little','🐾','من يمشي هكذا؟','قلّدوا مشية حيوان لطيف دون إصدار صوت، وعلى الآخرين التخمين.','دقيقتان'],
['fun','little','🎨','لون بسرعة','المعلم يذكر لونًا؛ ابحثوا عنه بأعينكم في الفصل وأشيروا إليه.','دقيقة'],
['fun','big','🎙️','مذيع الأخبار العجيب','اعلنوا خبرًا طريفًا عن اختفاء الأقلام في ٢٠ ثانية!','دقيقتان'],
['fun','big','🔄','عكسها!','المعلم يقول «فوق» فاشيروا إلى أسفل، ويقول «يمين» فاشيروا إلى اليسار.','دقيقتان'],
['brain','all','🧩','الشيء الغامض','أنا شيء له أوراق وليس شجرة، وفيه كلمات وليس إنسانًا. من أنا؟ (كتاب)','دقيقة'],
['brain','all','🔎','خمس أشياء','اذكروا خمسة أشياء مستديرة في حياتنا خلال ٢٠ ثانية.','دقيقة'],
['brain','all','🧠','ماذا لو؟','لو صارت الحقائب تتكلم، ما أول شيء ستقوله؟','دقيقتان'],
['brain','all','🔤','حرف وتحدٍّ','اختاروا حرفًا واذكروا ثلاث كلمات تبدأ به.','دقيقة'],
['brain','all','🕵️','ذاكرة الأبطال','انظروا إلى خمسة أشياء يذكرها المعلم، ثم أعيدوا ترتيبها من الذاكرة.','دقيقتان'],
['brain','little','🌻','الكلمة المختلفة','شمس، قمر، نجمة، تفاحة… ما الكلمة المختلفة؟ ولماذا؟','دقيقة'],
['brain','little','🐥','من أنا؟','أطير ولي جناحان وأبني عشًّا، من أنا؟','دقيقة'],
['brain','big','🧠','فكّر خارج الصندوق','اذكروا ثلاثة استخدامات غير معتادة لعلبة فارغة.','دقيقتان'],
['brain','big','🎯','كلمة ممنوعة','اشرحوا كلمة «مطر» دون نطق: ماء، سحاب، سماء.','دقيقتان'],
['brain','big','🔍','سؤال المحقق','ما الشيء الذي كلما أخذت منه كبر؟ (الحفرة)','دقيقة'],
['team','all','🤝','تحية الفريق','ابتكروا تحية مشتركة من ثلاث خطوات خلال دقيقة.','دقيقتان'],
['team','all','🌟','رسالة امتنان','تختار كل مجموعة عبارة شكر لطيفة لفريق آخر.','دقيقتان'],
['team','all','🗣️','أكمل القصة','الأول يقول جملة عن مغامرة، وكل زميل يضيف جملة قصيرة.','٣ دقائق'],
['team','all','🏆','شعار الفوز','صمّموا شعارًا شفهيًا لفريقكم من خمس كلمات أو أقل.','دقيقتان'],
['team','little','🌈','سلسلة الكلمات','كل طالب يقول كلمة تبدأ بآخر حرف من كلمة زميله بمساعدة المعلم.','٣ دقائق'],
['team','big','🎯','الدقيقة الذهبية','لديكم دقيقة للاتفاق على ثلاثة حلول لتقليل الفوضى في الفصل.','دقيقتان'],
['team','big','🧩','لغز الفريق','اتفقوا على إجابة واحدة: ما الشيء الذي يملأ الغرفة ولا يشغل مساحة؟ (الضوء)','دقيقتان'],
['team','all','👏','الجمهور الذهبي','قدّموا تصفيقة تشجيع جماعية لأحد الفرق الأخرى.','دقيقة']
];
const by=id=>document.getElementById(id);let previous=-1,busy=false,soundOn=true,ctx;
function beep(freq=550,duration=.10){if(!soundOn)return;try{ctx??=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ctx.currentTime);g.gain.setValueAtTime(.11,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration)}catch{}}
function celebrate(){if(window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;const colors=['#ffda6b','#ff8ecf','#91fff1','#b2a0ff'];for(let i=0;i<24;i++){const e=document.createElement('span');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=colors[i%4];e.style.width=(5+Math.random()*8)+'px';e.style.height=(6+Math.random()*9)+'px';e.style.animationDelay=Math.random()*.4+'s';document.body.append(e);setTimeout(()=>e.remove(),3000)}}
function draw(){if(busy)return;busy=true;by('draw').disabled=true;by('result').classList.remove('show');by('machine').classList.add('shaking');let tick=0;const interval=setInterval(()=>{beep(340+((tick++)%7)*65,.055)},160);setTimeout(()=>{clearInterval(interval);by('machine').classList.remove('shaking');const level=by('level').value,kind=by('kind').value;let pool=items.map((item,i)=>({item,i})).filter(x=>(kind==='all'||x.item[0]===kind)&&(level==='all'||x.item[1]==='all'||x.item[1]===level));if(pool.length>1)pool=pool.filter(x=>x.i!==previous);const pick=pool[Math.floor(Math.random()*pool.length)];previous=pick.i;const a=pick.item;by('emoji').textContent=a[2];by('tag').textContent=a[0]==='fun'?'🎭 حركة وضحك':a[0]==='brain'?'🧠 تحدي ذكاء':'🤝 تحدي تعاون';by('title').textContent=a[3];by('task').textContent=a[4];by('time').textContent='⏱️ المدة المقترحة: '+a[5];by('result').classList.add('show');beep(740,.17);setTimeout(()=>beep(990,.2),140);celebrate();busy=false;by('draw').disabled=false;by('result').scrollIntoView({behavior:'smooth',block:'nearest'})},1600)}
by('draw').onclick=draw;by('again').onclick=draw;by('sound').onclick=()=>{soundOn=!soundOn;by('sound').textContent=soundOn?'🔊 الصوت: يعمل':'🔇 الصوت: متوقف'};
</script></body></html>
