<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#231d53"><title>ظروف السعادة | استراحة جواهر</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');:root{--gold:#ffdf92;--txt:#fffaff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 12%,#694eae,transparent 46%),radial-gradient(ellipse at 90% 70%,#96547f,transparent 50%),#231d53;color:var(--txt);font-family:Cairo,Tahoma,sans-serif}.wrap{max-width:1020px;margin:auto;padding:20px 18px 55px}header{text-align:center}.pill{display:inline-block;background:#ffffff20;border:1px solid #ffffff6b;border-radius:50px;padding:5px 17px;font-size:13px;color:#ffebb9;font-weight:800}h1{font-size:clamp(30px,6vw,51px);color:var(--gold);margin:10px 0 2px}header p{margin:0 0 15px;color:#e7ddff}.setup{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:16px}select,button{font:700 15px Cairo,Tahoma,sans-serif;border-radius:13px;padding:9px 13px;border:1px solid #ffffff65}select{background:#382c70;color:white}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #9af5e9}.tool{background:#ffffff19;color:#fff}.progress{text-align:center;font-size:14px;color:#e2d7ff;margin:13px 0}.envelopes{display:grid;grid-template-columns:repeat(4,1fr);gap:17px;margin-top:15px}.env{position:relative;aspect-ratio:1.38;min-height:126px;border:0;background:transparent;transform-style:preserve-3d;transition:transform .25s,opacity .25s;display:grid;place-items:center;padding:0}.env:hover:not(:disabled){transform:translateY(-7px) rotate(-2deg)}.env:disabled{cursor:default}.env.used{opacity:.38;filter:grayscale(.7)}.paper{position:absolute;width:83%;height:76%;top:5%;background:#fff8e9;border-radius:8px;box-shadow:0 4px 10px #2f174a3e;z-index:1}.back{position:absolute;inset:12% 0 0;background:var(--c);border-radius:12px;box-shadow:0 12px 24px #14113950;z-index:2}.flap{position:absolute;top:12%;width:100%;height:49%;background:var(--dark);clip-path:polygon(0 0,100% 0,50% 99%);z-index:5;transform-origin:top;transition:transform .6s}.front{position:absolute;bottom:0;left:0;width:100%;height:72%;background:var(--c);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);z-index:4;border-radius:0 0 12px 12px}.seal{position:absolute;z-index:6;top:51%;left:50%;transform:translate(-50%,-50%);font-size:28px;text-shadow:0 2px 7px #24143f}.num{position:absolute;z-index:7;bottom:7px;color:#30234f;font-weight:900;font-size:14px;background:#fff9dbdd;border-radius:30px;padding:0 10px}.env.opening .flap{transform:rotateX(178deg);z-index:1}.env.opening .paper{animation:rise .6s .35s ease both}@keyframes rise{to{transform:translateY(-48px)}}.card{display:none;max-width:690px;margin:24px auto;padding:22px 20px 25px;text-align:center;border:2px solid var(--gold);background:linear-gradient(135deg,#504087,#5b326f);border-radius:28px;box-shadow:0 14px 44px #12103080;animation:appear .55s ease both}.card.show{display:block}@keyframes appear{from{opacity:0;transform:scale(.91) translateY(19px)}to{opacity:1;transform:none}}.card .symbol{font-size:54px}.card .type{color:#94f9e7;font-weight:900}.card h2{color:var(--gold);font-size:clamp(23px,4vw,32px);margin:4px 0}.card p{font-size:clamp(17px,2.7vw,22px);line-height:1.95}.card .close{color:#34234f;background:linear-gradient(120deg,#ffe597,#ffc7e7);border:0;padding:11px 25px;font-weight:900}.note{text-align:center;color:#dfd8f7;font-size:13px;margin-top:16px}.footer{text-align:center;margin-top:33px;color:#f5d89f;font-size:12px}.sparkle{position:fixed;top:-20px;z-index:20;animation:fall 2s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(100vh) rotate(360deg);opacity:0}}@media(max-width:700px){.envelopes{grid-template-columns:repeat(3,1fr);gap:12px}}@media(max-width:430px){.envelopes{grid-template-columns:repeat(2,1fr)}.env{min-height:116px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important}}
</style></head><body><div class="wrap"><header><div class="pill">💎 استراحة جواهر • لحظات جميلة للجميع</div><h1>💌 ظروف السعادة</h1><p>وراء كل ظرف رسالة لطيفة أو مفاجأة صغيرة… اختر ظرفك! ✨</p></header><div class="setup"><label for="grade">الفئة:</label><select id="grade"><option value="all">جميع صفوف الابتدائي</option><option value="little">أول – ثالث</option><option value="big">رابع – سادس</option></select><label for="mode">المحتوى:</label><select id="mode"><option value="all">رسائل ومفاجآت</option><option value="kind">رسائل إيجابية</option><option value="action">أنشطة خفيفة</option></select><button id="reset" class="tool">🔄 ظروف جديدة</button><button id="sound" class="tool">🔊 الصوت</button></div><div id="progress" class="progress">اختاروا ظرفًا من ١٢ ظرفًا 🌈</div><div id="envelopes" class="envelopes" aria-label="اختر ظرفًا"></div><section id="card" class="card" aria-live="polite"><div class="symbol" id="symbol">💛</div><div class="type" id="type"></div><h2 id="title"></h2><p id="message"></p><button id="close" class="close">💖 العودة للظروف</button></section><p class="note">مناسبة للبنات والأولاد • دون أسماء أو تصوير أو تسجيل دخول • الرسائل تتجدد في كل جولة</p><div class="footer">✨ جوهرة ماث | إعداد المعلمة/ جواهر السبيعي ✨</div></div><script>
const content=[
['kind','all','🌟','وجودك يفرق','كل واحد في الفصل له مكان وقيمة. وجودك اليوم يضيف شيئًا جميلًا!'],
['kind','all','💪','المحاولة بطولة','مو لازم تعرف الإجابة من أول مرة؛ المهم تجرب وتتعلم.'],
['kind','all','💛','كلمة طيبة','كلمة لطيفة منك ممكن تغيّر يوم أحد للأجمل.'],
['kind','all','🌈','لك بصمتك','لك موهبة تميزك، حتى لو ما اكتشفتها إلى الآن.'],
['kind','all','🌻','أنت تتقدم','الخطوات الصغيرة تصنع إنجازات كبيرة مع الوقت.'],
['kind','all','⭐','شجاعة السؤال','لما تسأل عن شيء ما فهمته، فأنت تتعلم بذكاء.'],
['kind','all','🎉','المهم المشاركة','الفرحة مو بالفوز فقط؛ الفرح إننا نشارك ونشجع بعض.'],
['kind','all','🤍','كن صديقًا رائعًا','شجّع زميلًا اليوم واحتفل بنجاحه مثل نجاحك.'],
['kind','all','🌷','رسالة اليوم','تستحق يومًا مليئًا بالتعلّم والابتسامات والمغامرات.'],
['kind','all','💎','جوهرتك الحقيقية','أجمل ما فيك احترامك للآخرين ولطفك واجتهادك.'],
['kind','all','✨','فكرة جديدة','يمكن تكون الفكرة البسيطة اللي عندك هي بداية شيء رائع.'],
['kind','all','👑','تصرف كبير','الاعتذار عند الخطأ والتسامح من علامات القوة.'],
['action','all','👏','تصفيق النجوم','صفّقوا جميعًا ثلاث تصفيقات مرحة تشجيعًا للفصل!'],
['action','all','🎤','عبارة تحفيزية','قولوا معًا: نتعلم، نحاول، ونتقدم كل يوم!'],
['action','all','🤝','جسر اللطف','وجّهوا كلمة شكر بسيطة لشخص ساعدكم اليوم.'],
['action','all','🎭','تعبير بلا كلام','مثّلوا شعور الفرحة من غير كلام، وعلى الآخرين التخمين.'],
['action','all','🧠','فكرة جميلة','فكّروا في طريقة واحدة تجعل الفصل مكانًا أجمل للجميع.'],
['action','all','📣','هتاف الفصل','اصنعوا هتافًا قصيرًا ومشجعًا تقوله المجموعة معًا.'],
['action','all','🔎','أبطال الملاحظة','ابحثوا عن ثلاثة أشياء جميلة في الفصل من أماكنكم.'],
['action','all','🗣️','كلمة تكمل كلمة','كل شخص يقول كلمة إيجابية تبدأ بحرف يختاره المعلم.'],
['action','little','🐻','حركة لطيفة','قلّدوا حركة دب مستيقظ من النوم لخمس ثوانٍ!'],
['action','little','🌈','صيد الألوان','اختاروا لونًا، وأشيروا إلى شيء بهذا اللون في الفصل.'],
['action','little','🐦','تخيل معي','لو كنت طائرًا، إلى أين تحب أن تطير؟'],
['action','big','🚀','خبر المستقبل','تخيّلوا اختراعًا يساعد الطلاب بعد ٢٠ سنة؛ صفوه بجملة.'],
['action','big','🎨','تحدي الشعارات','اخترعوا شعارًا من أربع كلمات يعبّر عن التعاون.'],
['action','big','🧩','لغز سريع','ما الشيء الذي تملكه أنت، لكن يستخدمه الآخرون أكثر منك؟ (اسمك)'],
['kind','big','🪄','قوة الاختيار','يمكنك أن تختار ردًا لطيفًا حتى في المواقف الصعبة.'],
['kind','little','🐣','فخور بمحاولتك','كل مرة تحاول فيها، تصبح أقدر على التعلّم.']
];
const $=id=>document.getElementById(id);let used=new Set(),deck=[],on=true,audio;
const colors=[['#ff9ec7','#e671a5'],['#a5caff','#6599e3'],['#ffcb83','#e9a45c'],['#c5aaff','#987be5'],['#95e5d9','#62bcb6'],['#ffc5a7','#e79884'],['#e5b0ed','#bb83d0'],['#c2eb9b','#93c775'],['#f8b1c0','#e788a4'],['#b3d4ff','#789bdc'],['#f3d49c','#d8ae60'],['#aadfe9','#6cb7c6']];
function play(f=650){if(!on)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.2)}catch{}}
function shuffle(arr){return arr.sort(()=>Math.random()-.5)}
function reset(){used=new Set();const grade=$('grade').value,mode=$('mode').value;let pool=shuffle(content.filter(x=>(x[1]==='all'||grade==='all'||x[1]===grade)&&(mode==='all'||x[0]===mode)));deck=Array.from({length:12},(_,i)=>pool[i%pool.length]);render();$('card').classList.remove('show')}
function render(){const place=$('envelopes');place.replaceChildren();colors.forEach(([c,d],i)=>{const btn=document.createElement('button');btn.className='env'+(used.has(i)?' used':'');btn.disabled=used.has(i);btn.style.setProperty('--c',c);btn.style.setProperty('--dark',d);btn.setAttribute('aria-label','الظرف رقم '+(i+1));btn.innerHTML='<span class="paper"></span><span class="back"></span><span class="flap"></span><span class="front"></span><span class="seal">💛</span><span class="num">'+(i+1)+'</span>';btn.onclick=()=>openEnvelope(i,btn);place.append(btn)});$('progress').textContent='✨ تم فتح '+used.size+' من ١٢ ظرفًا'}
function sparkle(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<19;i++){const el=document.createElement('span');el.className='sparkle';el.textContent=['✨','💛','🌟','🎉'][i%4];el.style.left=Math.random()*100+'vw';el.style.animationDelay=Math.random()*.55+'s';document.body.append(el);setTimeout(()=>el.remove(),2600)}}
let opening=false;function openEnvelope(i,btn){if(opening||used.has(i))return;opening=true;btn.classList.add('opening');play(520);setTimeout(()=>{used.add(i);const e=deck[i];$('symbol').textContent=e[2];$('type').textContent=e[0]==='kind'?'💌 رسالة جميلة':'🎲 مفاجأة خفيفة';$('title').textContent=e[3];$('message').textContent=e[4];$('card').classList.add('show');render();play(880);sparkle();opening=false;$('card').scrollIntoView({behavior:'smooth',block:'nearest'})},750)}
$('close').onclick=()=>{$('card').classList.remove('show');$('envelopes').scrollIntoView({behavior:'smooth',block:'start'})};$('reset').onclick=reset;$('grade').onchange=reset;$('mode').onchange=reset;$('sound').onclick=()=>{on=!on;$('sound').textContent=on?'🔊 الصوت':'🔇 صامت'};reset();
</script></body></html>
