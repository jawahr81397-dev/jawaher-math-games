<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مختبر كشف الكسور المتنكّرة | جوهرة ماث</title><style>:root{--bg:#08172b;--panel:#132b49;--gold:#f4d38b;--cyan:#78e9ef;--pink:#fa9bd2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#283b72,var(--bg) 60%);color:#fff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}main{max-width:900px;margin:auto;padding:22px 14px 60px}header{text-align:center;padding:25px 10px}h1{color:var(--gold);font-size:clamp(25px,5vw,42px);margin:8px}h2{color:var(--cyan)}p{line-height:1.8}.panel{background:#122a47e8;border:1px solid #5e7eab;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 12px 30px #0004}.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.tabs button{flex:1;min-width:120px}.btn,button{border:0;border-radius:14px;padding:13px 17px;background:linear-gradient(120deg,#55dbe5,#b6a4ff);color:#071629;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.45;cursor:default}.ghost{background:#243f60;color:white;border:1px solid #7298b6}.active{outline:3px solid var(--gold)}.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}.fraction{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;font-size:35px;font-weight:bold;min-width:55px}.fraction span:first-child{border-bottom:3px solid var(--gold);padding:0 10px 5px}.fraction span:last-child{padding-top:5px}.choices .fraction{font-size:27px;min-width:45px}.choices .fraction span:first-child{border-bottom:3px solid #102640}.choices button{display:flex;align-items:center;justify-content:center;min-height:76px}.feedback .fraction{font-size:22px;min-width:35px;vertical-align:middle}.bar{display:flex;direction:ltr;max-width:620px;margin:14px auto;height:55px;gap:2px}.piece{flex:1;background:#52647d;border-radius:4px;border:1px solid #c9d6e4}.piece.on{background:linear-gradient(135deg,#e7b95e,#fa8fc8)}.muted{color:#c1d6e9}.feedback{padding:14px;border-radius:12px;background:#294665;margin-top:15px;min-height:48px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:18px}input{width:100px;background:#eef8ff;color:#11243e;border:0;border-radius:10px;padding:12px;font-size:22px;text-align:center}.hidden{display:none}.score{color:var(--gold);font-size:22px}.celebrate{animation:pop .5s ease}@keyframes pop{50%{transform:scale(1.08)}}footer{text-align:center;color:#9db5cb;margin-top:25px}@media print{body{background:white;color:black}.tabs,.no-print{display:none}.panel{color:black;border:1px solid #aaa;background:white}}</style></head><body><main><header><div>💎 جوهرة ماث | الصف السادس</div><h1>🔬 مختبر كشف الكسور المتنكّرة</h1><p>نبسّط الشكل… ولا نغيّر القيمة!</p></header><nav class="tabs no-print" id="tabs"></nav><section class="panel" id="content" aria-live="polite"></section><footer>إعداد المعلمة / جواهر السبيعي • تعلّم، اكتشف، أتقن</footer></main><script>
const $=s=>document.querySelector(s);let stage=0,score=0,qi=0,answered=false,student='',last='';const names=['🔍 الاكتشاف','🔑 المفتاح المشترك','⚙️ آلة التبسيط','🕵️ صيد الأخطاء','🏆 التحدي','🎖️ بطاقة الإتقان'];function gcd(a,b){while(b)[a,b]=[b,a%b];return a}function ar(v){return String(v).replace(/[0-9]/g,d=>"٠١٢٣٤٥٦٧٨٩"[d])}function frac(a,b){return `<span class="fraction" aria-label="${ar(a)} على ${ar(b)}"><span>${ar(a)}</span><span>${ar(b)}</span></span>`}function pretty(t){return ar(String(t)).replace(/([٠-٩]+)\s*\/\s*([٠-٩]+)/g,(_,a,b)=>frac(a,b))}function bar(n,d){return `<div class="bar" aria-label="${n} من ${d} أجزاء ملونة">${Array.from({length:d},(_,i)=>`<div class="piece ${i<n?'on':''}"></div>`).join('')}</div>`}function sound(ok){try{let A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?720:230;g.gain.value=.06;o.start();o.stop(c.currentTime+.13);o.onended=()=>c.close()}catch(e){}}function feedback(msg,ok){$('#feedback').innerHTML=pretty(msg);$('#feedback').classList.add('celebrate');sound(ok)}function tabs(){ $('#tabs').innerHTML=names.map((n,i)=>`<button class="${stage===i?'active':'ghost'}" onclick="go(${i})">${n}</button>`).join('')}function go(i){stage=i;tabs();render()}function render(){let h='';if(stage===0){h=`<h2>🔍 هل تغيّر الكسر أم تغيّر شكله؟</h2><p>قارني الجزء الملوّن في النموذجين، ثم اختاري الإجابة.</p><div class="row">${frac(4,8)} ${frac(1,2)}</div>${bar(4,8)}${bar(1,2)}<div class="choices"><button onclick="feedback('أحسنتِ! المقدار نفسه، لكن عدد الأجزاء مختلف. ٤/٨ = ١/٢.',true)">القيمتان متساويتان</button><button onclick="feedback('انظري إلى طول الجزء الملوّن في النموذجين: إنه متساوٍ!',false)">٤/٨ أكبر</button></div><div class="feedback" id="feedback">💡 تذكري: التبسيط لا يغيّر قيمة الكسر.</div><button class="no-print" onclick="go(1)">التالي ←</button>`}else if(stage===1){h=`<h2>🔑 افتحي البابين بمفتاح واحد!</h2><p>للكسر ١٢/١٨: ما أكبر عدد يمكن قسمة البسط والمقام عليه دون باقٍ؟</p><div class="row">${frac(12,18)}</div><div class="choices">${[2,3,6,9].map(x=>`<button onclick="feedback('${x===6?'رائع! ١٢ ÷ ٦ = ٢ و١٨ ÷ ٦ = ٣، فأبسط صورة ٢/٣.':x===9?'٩ لا يقسم ١٢ دون باقٍ.':'صحيح أنه عامل مشترك، لكن ابحثي عن الأكبر: ٦.'}',${x===6})">🔑 ${ar(x)}</button>`).join('')}</div><div class="feedback" id="feedback">المفتاح الصحيح يقسم العددين معًا.</div><button onclick="go(2)">التالي ←</button>`}else if(stage===2){h=`<h2>⚙️ آلة التبسيط</h2><p>اكتبي بسطًا ومقامًا وعددًا للقسمة عليهما معًا.</p><div class="row"><label>البسط <input id="num" type="text" inputmode="numeric" min="0" value="8"></label><label>المقام <input id="den" type="text" inputmode="numeric" min="1" value="12"></label><label>القاسم <input id="div" type="text" inputmode="numeric" min="2" value="4"></label></div><p><button onclick="machine()">✨ شغّلي الآلة</button></p><div class="feedback" id="feedback">جربي ٨/١٢ والقسمة على ٤.</div><button onclick="go(3)">التالي ←</button>`}else if(stage===3){h=`<h2>🕵️ صيد الأخطاء</h2><p>قالت طالبة: «٦/٩ = ٣/٩ لأنني قسمت البسط على ٢». ما الخطأ؟</p><div class="choices"><button onclick="feedback('صحيح! يجب قسمة البسط والمقام على العدد نفسه، وهنا ٦/٩ = ٢/٣.',true)">قسمت البسط فقط</button><button onclick="feedback('ليس هذا هو السبب. راقبي ما حدث للمقام.',false)">المقام أكبر من البسط</button><button onclick="feedback('التبسيط مسموح، لكن يجب تطبيق القسمة على الاثنين.',false)">لا يجوز تبسيط ٦/٩</button></div><div class="feedback" id="feedback">🔎 كوني محققة رياضية!</div><button onclick="go(4)">ابدئي التحدي ←</button>`}else if(stage===4){const q=questions[qi];h=`<h2>🏆 تحدي العبقريات</h2><p class="score">السؤال ${ar(qi+1)} من ${ar(questions.length)} | النقاط: ${ar(score)}</p><p>ما أبسط صورة للكسر؟</p><div class="row">${frac(q[0],q[1])}</div><div class="choices">${q[2].map((x,i)=>`<button class="answer" onclick="check(${i})">${pretty(x)}</button>`).join('')}</div><div class="feedback" id="feedback">اختاري الإجابة ثم اقرئي التفسير.</div><p><button id="next" disabled onclick="next()">${qi===questions.length-1?'عرض النتيجة':'السؤال التالي ←'}</button></p>`}else{h=`<h2>🎖️ بطاقة إتقان الكسور</h2><p>أدخلِي اسم الطالبة لعرض بطاقتها وتصويرها.</p><input id="student" placeholder="اسم الطالبة" style="width:min(100%,320px)" value="${student.replaceAll('"','&quot;')}"><p class="score">النتيجة: ${ar(score)} من ${ar(questions.length)}</p><p>${score===questions.length?'🌟 إتقان رائع!':'💪 كل محاولة فرصة جديدة للتعلّم.'}</p><p>أبحث عن المشترك، أقسم الاثنين، وأتأكد من أبسط كسر!</p><button class="no-print" onclick="student=$('#student').value;render()">تثبيت الاسم</button> <button class="no-print" onclick="window.print()">🖨️ طباعة / حفظ PDF</button> <button class="no-print" onclick="score=0;qi=0;go(4)">إعادة التحدي</button>`}$('#content').innerHTML=pretty(h)}function machine(){const val=id=>Number($(id).value.replace(/[٠-٩]/g,c=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(c))));let a=val('#num'),b=val('#den'),d=val('#div');if(!Number.isSafeInteger(a)||!Number.isSafeInteger(b)||!Number.isSafeInteger(d)||a<0||b<=0||d<=1){feedback('أدخلي أعدادًا صحيحة: البسط غير سالب، والمقام موجب، والقاسم أكبر من ١.',false);return}if(a%d||b%d){feedback(`المفتاح ${d} لا يقسم البسط والمقام معًا دون باقٍ. جرّبي مفتاحًا آخر.`,false);return}let x=a/d,y=b/d;feedback(`${a} ÷ ${d} = ${x} و${b} ÷ ${d} = ${y}. الناتج ${x}/${y}. ${gcd(x,y)===1?'وصلنا إلى أبسط صورة!':'يمكن تبسيطه أكثر.'}`,true)}const questions=[[6,12,['١/٢','٢/٣','٣/٤'],0,6],[8,20,['٤/٥','٢/٥','١/٤'],1,4],[15,25,['٣/٥','٥/٣','٢/٥'],0,5],[18,24,['٢/٣','٣/٤','٦/٨'],1,6],[9,12,['٣/٤','٢/٣','١/٣'],0,3],[14,21,['٧/١٤','٢/٣','٣/٢'],1,7],[16,24,['٤/٦','٣/٤','٢/٣'],2,8],[10,15,['٢/٣','٥/٣','١/٢'],0,5]];function check(i){if(answered)return;answered=true;let q=questions[qi],ok=i===q[3];if(ok)score++;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);feedback(`${ok?'🎉 إجابة صحيحة!':'🌷 الإجابة الصحيحة: '+q[2][q[3]]+'.'} نقسم ${q[0]} و${q[1]} على ${q[4]} فنحصل على ${q[2][q[3]]}.`,ok);$('#next').disabled=false}function next(){answered=false;if(qi<questions.length-1){qi++;render()}else go(5)}tabs();render();</script></body></html>
