<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حديقة ورود المعادلات</title><style>:root{--sky:#d0efff;--ink:#54402f;--green:#39765d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#b9ddec,#d6f2ff 75%,#e6f6e9);color:var(--ink);font-family:Tahoma,Arial,sans-serif;min-height:100vh}main{max-width:880px;margin:auto;padding:22px 15px 45px;text-align:center}h1{font-size:clamp(27px,5vw,43px);margin:10px 0;color:#5c3a33}p{line-height:1.8}select{font:inherit;background:#fffdf7;border:1px solid #a8d5c1;border-radius:14px;padding:12px 20px;color:#3c5b48}.garden{margin:20px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:15px}.flower{border:0;background:rgba(255,255,255,.7);border-radius:22px;min-height:175px;cursor:pointer;box-shadow:0 7px 20px #769c9c33;padding:12px;color:#3b5a49;font:inherit;transition:transform .2s}.flower:hover,.flower:focus-visible{transform:translateY(-6px)}.bloom{display:block;font-size:68px;filter:drop-shadow(0 4px 3px #7b8b7766);animation:sway 3s ease-in-out infinite alternate}.flower small{display:block;font-size:15px;font-weight:bold;margin-top:7px}@keyframes sway{to{transform:rotate(7deg) translateY(-4px)}}.modal{display:none;position:fixed;inset:0;background:#183c3d9c;z-index:4;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.paper{background:linear-gradient(150deg,#fffef8,#f8fff8);border:9px solid #b3d6c4;outline:3px solid #f8faf0;border-radius:26px;padding:26px 15px;max-width:590px;width:100%;box-shadow:0 20px 80px #183e3e88}.paper .bouquet{font-size:65px}.paper h2{font-size:31px;color:#38785d}.paper strong{display:block;font-size:clamp(24px,5vw,40px);color:#8c6145;margin:14px 0}.paper p{font-size:19px}.paper button{font:inherit;background:#377c60;color:white;border:0;padding:13px 22px;border-radius:18px;cursor:pointer}.note{font-size:14px;color:#486b65}</style></head><body><main><div style="font-size:35px">🌼 🌸 🌼</div><h1>حديقة ورود المعادلات</h1><p>كل وردة تحمل اسم مبدعة تستحق التقدير 🌷</p><label for="class">اختاري الفصل: </label><select id="class"><option value="a">خامس أ</option><option value="b">خامس ب</option></select><p class="note">اضغطي على وردة الطالبة لتظهر شهادة شكرها</p><div class="garden" id="garden"></div></main><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="paper"><div class="bouquet">🌼🌼🌼</div><h2>شهادة شكر وتقدير</h2><p>تُقدَّم هذه الوردة تقديرًا للطالبة المبدعة</p><strong id="winner"></strong><p>لتألقها واجتهادها ومشاركتها الجميلة في درس المعادلات. شكرًا لكِ على إبداعكِ 🌿</p><p style="font-size:15px">المعلمة / جواهر السبيعي</p><button id="back">العودة إلى حديقة الورود</button></div></div><script>const students={a:["أسيل صلاح","تالية محمد","جنات حسن","جود محمد","حسناء محمد","ديما عادل","رودينا سلطان","زينب حسين","سارة علي","علا محمد","غلا معيض","فاطمة عبدالله","قمر عوض","لطيفة عبدالله","مريم علاء","مها علي","نورة نايف","هاجر عبدالعزيز","وتين علي","ياسمين صالح"],b:["في حمود","بسمة هاني","بنين باسم","جنان بو خضر","جنى ماهر","جود عبدالله","جوري حمود","حنان يوسف","ريم يحيى","زهراء جميل","زهراء علي","فاطمة مهدي","فدية ماجد","لمار آدم","ليان محمد","مريم خليفة","ميرا نضال","نجاة طارق","نضرة عبدالله","نورة زياد"]};const garden=document.getElementById('garden'),cls=document.getElementById('class'),modal=document.getElementById('modal');function draw(){garden.replaceChildren();students[cls.value].forEach((name,i)=>{const b=document.createElement('button');b.className='flower';const bloom=document.createElement('span');bloom.className='bloom';bloom.textContent=['🌼','🌸','🌼','🌷'][i%4];const label=document.createElement('small');label.textContent=name;b.append(bloom,label);b.onclick=()=>{document.getElementById('winner').textContent=name;modal.classList.add('show')};garden.appendChild(b)})}cls.onchange=draw;document.getElementById('back').onclick=()=>modal.classList.remove('show');document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('show')});draw();</script></body></html>
