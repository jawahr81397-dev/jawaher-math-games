<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نجمة المعادلات | تحفيز خامس</title><style>body{margin:0;font-family:system-ui,Tahoma;background:radial-gradient(circle at top,#fff3d8,#f3e8ff 50%,#e1efff);color:#3e3560;text-align:center;min-height:100vh}main{max-width:850px;margin:auto;padding:28px 16px}h1{font-size:clamp(29px,6vw,48px);color:#7c4db1}p{font-size:19px}button,select{font:inherit;border:0;border-radius:18px;padding:14px 22px;margin:7px;cursor:pointer}button{background:linear-gradient(130deg,#b76bc8,#7357c9);color:white;box-shadow:0 5px 13px #7662a644}button:focus-visible{outline:3px solid #f2a900}select{background:white;color:#493768;border:2px solid #c4a8e2}.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px;margin-top:25px}.names button{margin:0;font-size:17px}.overlay{display:none;position:fixed;inset:0;background:#23123bdc;align-items:center;justify-content:center;z-index:2;padding:16px}.overlay.open{display:flex}.celebrate{position:relative;overflow:hidden;width:min(95vw,650px);padding:45px 12px;border-radius:32px;background:linear-gradient(145deg,#fff6d8,#f4e7ff,#e1f3ff);box-shadow:0 0 60px #eecbff}.celebrate h2{font-size:clamp(30px,7vw,55px);color:#8b49b1}.celebrate strong{font-size:clamp(27px,7vw,49px);color:#a86a16}.spark{position:absolute;animation:float 2.2s ease-in-out infinite alternate;font-size:30px}@keyframes float{to{transform:translateY(-35px) rotate(22deg)}}#close{background:#5c4c83}.hint{font-size:15px;color:#665a7c}</style></head><body><main><div style="font-size:55px">💎✨👑</div><h1>نجمة المعادلات</h1><p>كل معادلة لها حل… وكل مبدعة لها تألقها!</p><label for="cls">اختاري الفصل:</label><select id="cls"><option value="a">خامس أ</option><option value="b">خامس ب</option></select><p class="hint">اضغطي اسم الطالبة لتظهر لها لحظة التكريم</p><div id="names" class="names"></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="تهنئة الطالبة"><div class="celebrate"><span class="spark" style="top:5%;left:7%">✨</span><span class="spark" style="top:25%;right:6%;animation-delay:.4s">💎</span><span class="spark" style="bottom:13%;left:13%;animation-delay:.8s">🌟</span><div style="font-size:55px">🏆💖</div><h2>نجمة المعادلات</h2><strong id="student"></strong><p>تألقتِ بفكركِ الجميل واجتهادكِ الرائع!</p><p>إبداعكِ يستحق الاحتفال ✨</p><button id="close">العودة للأسماء</button></div></div><script>const students={a:["أسيل صلاح","تالية محمد","جنات حسن","جود محمد","حسناء محمد","ديما عادل","رودينا سلطان","زينب حسين","سارة علي","علا محمد","غلا معيض","فاطمة عبدالله","قمر عوض","لطيفة عبدالله","مريم علاء","مها علي","نورة نايف","هاجر عبدالعزيز","وتين علي","ياسمين صالح"],b:["بسمة هاني","بنين باسم","جنان بو خضر","جنى ماهر","جود عبدالله","جوري حمود","حنان يوسف","ريم يحيى","زهراء جميل","زهراء علي","فاطمة مهدي","فدية ماجد","لمار آدم","ليان محمد","مريم خليفة","ميرا نضال","نجاة طارق","نضرة عبدالله","نورة زياد"]};const cls=document.getElementById('cls'),names=document.getElementById('names'),overlay=document.getElementById('overlay');function render(){names.replaceChildren();students[cls.value].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{document.getElementById('student').textContent=n;overlay.classList.add('open')};names.appendChild(b)})}cls.onchange=render;document.getElementById('close').onclick=()=>overlay.classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('open')});render();</script></body></html>
