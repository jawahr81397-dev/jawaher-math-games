:root {
  --bg:#061521;
  --panel:#0d293a;
  --gold:#edc87d;
  --cyan:#83e8f5;
  --white:#f0f9ff;
  --muted:#b5cdd6;
  --emerald:#0b5047;
}

* {

}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  min-height:100vh;
  color:var(--white);
  font-family:Cairo,Tahoma,Arial,sans-serif;
  background:

}

a {

  text-decoration:none;
}

button,input {
  font:inherit;
}

button {
  cursor:pointer;
}

.wrap {
  width:min(1140px,calc(100% - 32px));
  margin:auto;
}

/* شريط التنقل */

.topbar {
  position:sticky;
  top:0;
  z-index:20;
  background:#061521ed;
  backdrop-filter:blur(16px);
  border-bottom:1px solid #ffffff24;
}

.nav {
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--gold);
  font:800 17px Alexandria,sans-serif;
}

.brand img {
  width:55px;
  height:55px;
  object-fit:contain;
  filter:drop-shadow(0 0 9px #83e8f570);
  animation:float 5s ease-in-out infinite;
}

.navlinks {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.navlinks a,
.navlinks button {
  color:white;
  background:#ffffff0c;
  border:1px solid #ffffff30;
  border-radius:30px;
  padding:9px 13px;
  font-size:13px;
}

/* واجهة الترحيب */

.hero {
  display:grid;
  grid-template-columns:1.1fr .9fr;
  align-items:center;
  gap:30px;
  padding:55px 0 40px;
}

.hero h1 {
  font:800 clamp(39px,6vw,72px) Alexandria,sans-serif;
  color:var(--gold);
  margin:16px 0;
  text-shadow:0 0 28px #edc87d30;
}

.hero p {
  color:var(--muted);
  font-size:18px;
  line-height:2;
}

.eyebrow {
  display:inline-block;
  color:var(--gold);
  border:1px solid #edc87d70;
  border-radius:30px;
  padding:8px 16px;
}

.actions {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:25px;
}

.btn {
  display:inline-block;
  border:1px solid var(--gold);
  border-radius:15px;
  padding:12px 20px;
  background:linear-gradient(135deg,#e3b56d,#fff0bd);
  color:#102434;
  font-weight:800;
  cursor:pointer;
}

.btn.secondary {
  color:white;
  background:#ffffff0b;
  border-color:#ffffff50;
}

/* الشعار المتحرك */

.hero-art {
  position:relative;
  min-height:400px;
  display:grid;
  place-items:center;
  isolation:isolate;
}

.hero-art::before {
  content:"";
  position:absolute;
  width:80%;
  aspect-ratio:1;
  border-radius:50%;
  background:radial-gradient(circle,#1d90ad55,transparent 68%);
  filter:blur(22px);
  animation:pulse 5s ease-in-out infinite;
}

.halo {
  position:absolute;
  width:85%;
  aspect-ratio:1;
  border:1px solid var(--gold);
  border-radius:50%;
  animation:spin 24s linear infinite;
}

.halo::after {
  content:"✦";
  position:absolute;
  top:-17px;
  left:50%;
  font-size:30px;
  color:var(--gold);
}

.halo.two {
  width:98%;
  border-color:var(--cyan);
  animation:orbit 16s linear infinite;
}

.hero-logo {
  position:relative;
  z-index:2;
  width:95%;
  max-width:390px;
  height:auto;
  object-fit:contain;
  filter:
    drop-shadow(0 0 22px #83e8f56b)
    drop-shadow(0 0 40px #edc87d30);
  animation:float 5s ease-in-out infinite;
}

.math-symbol {
  position:absolute;
  z-index:3;
  font-size:35px;
  color:var(--cyan);
  text-shadow:0 0 16px var(--cyan);
  pointer-events:none;
}

.m1 {top:8%;right:8%}
.m2 {bottom:15%;left:5%;color:var(--gold)}
.m3 {top:12%;left:9%}
.m4 {bottom:9%;right:9%}

/* الأقسام */

.heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin:22px 0;
}

.heading h2 {
  font:700 clamp(24px,3vw,35px) Alexandria,sans-serif;
  margin:0;
}

.heading p {
  color:var(--muted);
}

.search {
  width:min(100%,370px);
  background:#ffffff0c;
  color:white;
  border:1px solid #ffffff35;
  border-radius:14px;
  padding:13px;
}

.search::placeholder {
  color:#b0c9d2;
}

.grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:17px;
  margin-bottom:50px;
}

.tile {
  display:flex;
  flex-direction:column;
  min-height:195px;
  padding:23px;
  border:1px solid #edc87d50;
  border-radius:23px;
  background:linear-gradient(145deg,#153747,#0a2030);
  transition:
    transform .25s,
    border-color .25s,
    box-shadow .25s;
}

.tile:hover,
.tile:focus-visible {
  transform:translateY(-5px);
  border-color:var(--gold);
  box-shadow:0 12px 35px #0005;
}

.tile.featured {
  background:linear-gradient(145deg,#104c43,#0b2939);
  border-color:var(--gold);
  box-shadow:0 0 25px #edc87d25;
}

.tile .ico {
  font-size:32px;
}

.tile h3 {

.tile p {

  line-height:1.8;
  margin:0 0 12px;

.tile .go {

}

.panel {
  border:1px solid #ffffff29;
  background:#0b2636;
  border-radius:25px;
  padding:23px;
  margin:30px 0 45px;
}

.back {

  color:var(--gold);
  font-weight:700;
  margin-bottom:20px;
}

.item-list {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.item {
  display:flex;
  align-items:center;
  gap:13px;
  padding:17px;
  border-radius:16px;
  background:#ffffff09;
  border:1px solid #ffffff20;
}

.item:hover {
  border-color:var(--gold);
}

.item .emoji {
  font-size:27px;
}

.item strong {
  display:block;
}

.item small {
  display:block;
  color:var(--muted);
}

.empty {
  text-align:center;
  color:var(--muted);
  padding:25px;
}

.footer {
  text-align:center;
  border-top:1px solid #ffffff25;
  padding:30px;
  color:var(--muted);
}

.footer strong {
  color:var(--gold);

/* الافتتاحية السينمائية */

.intro {
  position:fixed;
  inset:0;
  z-index:100;
  background:

  display:grid;
  place-items:center;
  text-align:center;
  padding:20px;
  transition:opacity .85s,visibility .85s;
}

.intro.hide {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.intro[hidden] {
  display:none!important;
}

.intro-content {
  position:relative;
  width:min(100%,550px);

.intro-logo {
  position:relative;
  z-index:2;

  width:min(85vw,420px);

  margin:auto;
  object-fit:contain;

    drop-shadow(0 0 50px #edc87d40);
  animation:
    appear 1s ease both,
    float 5s ease-in-out 1s infinite;
}

.intro-ring {
  position:absolute;
  top:5%;
  left:15%;
  width:70%;
  aspect-ratio:1;
  border:2px solid #e5bd7380;
  border-radius:50%;
  animation:spin 12s linear infinite;
}

.intro h2 {
  font:800 clamp(26px,5vw,43px) Alexandria,sans-serif;
  color:var(--gold);
}

.intro p {
  color:#c4eaf2;
}

/* الحركات */

@keyframes spin {
  to {transform:rotate(360deg)}
}

@keyframes orbit {
  from {transform:rotate(65deg) scaleY(.55)}
  to {transform:rotate(425deg) scaleY(.55)}
}

@keyframes float {
  50% {transform:translateY(-13px)}
}

@keyframes appear {
  from {
    opacity:0;
    transform:translateY(25px) scale(.92);
  }
  to {
    opacity:1;
    transform:none;
  }
}

@keyframes pulse {
  50% {
    opacity:.55;
    transform:scale(1.12);
  }
}

/* الجوال */

@media(max-width:850px) {
  .hero {
    grid-template-columns:1fr;
    text-align:center;
  }

  .hero-art {
    grid-row:1;
    min-height:330px;
  }

  .actions {
    justify-content:center;
  }

  .grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:570px) {
  .grid,
  .item-list {
    grid-template-columns:1fr;
  }

  .brand {
    font-size:13px;
  }

  .brand img {
    width:43px;
    height:43px;
  }

  .navlinks a,
  .navlinks button {
    font-size:11px;
    padding:7px;
  }

  .hero-art {
    min-height:290px;
  }

  .hero h1 {
    font-size:38px;
  }

  .tile {
    min-height:160px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *,
  *::before,
  *::after {
    animation:none!important;
    transition:none!important;
  }
}

function el(tag,cls,text) {
  const n = document.createElement(tag);

  if(cls) {
    n.className = cls;
  }

  if(text !== undefined) {
    n.textContent = text;
  }

  return n;
}

      'p',
      '',
      'حيث تتحول الأرقام إلى اكتشافات! انطلقي في مغامرات الرياضيات، واكتشفي ألعابًا وتحديات ومهارات جديدة.'
    )
  );

  const actions = el('div','actions');

  const a = el('a','btn','✨ اكتشفي الألعاب');
  a.href = '#sections';

  const b = el('a','btn secondary','🏆 ادخلي عبقريات نافس');
  b.href = 'nafes.html';

  actions.append(a,b);
  copy.append(actions);

  const art = el('div','hero-art');

  art.append(
    el('div','halo'),
    el('div','halo two')
  );

  const img = el('img','hero-logo');

  img.src = 'jawhara-logo.png';
  img.alt = 'شعار جوهرة ماث الرسمي';

  art.append(img);

  [
    ['m1','π'],
    ['m2','Σ'],
    ['m3','x²'],
    ['m4','÷']
  ].forEach(([c,t]) => {
    art.append(
      el('span','math-symbol '+c,t)
    );
  });

  h.append(copy,art);

  return h;
}

/* بطاقة القسم */

function makeTile(s) {

  const a = el(
    'a',
    'tile'+(s.featured?' featured':'')
  );

  a.href = s.href || '#'+s.id;

  a.append(
    el('span','ico',s.icon),
    el('h3','',s.title),
    el('p','',s.desc),
    el(
      'span',
      'go',
      s.href
        ? 'دخول الأكاديمية ←'
        : 'استكشفي القسم ←'
    )
  );

  return a;
}

/* الصفحة الرئيسية */

function home() {

  app.replaceChildren(hero());

  const area = el('section');
  area.id = 'sections';

  const head = el('div','heading');
  const t = el('div');

  t.append(
    el('h2','','بوابات جوهرة ماث'),
    el('p','','اختاري القسم وابدئي مغامرتكِ')
  );

  head.append(t);

  const search = el('input','search');

  search.type = 'search';
  search.placeholder = 'ابحثي عن قسم أو لعبة…';

  search.setAttribute(
    'aria-label',
    'البحث عن قسم أو لعبة'
  );

  head.append(search);
  area.append(head);

  const grid = el('div','grid');

  area.append(grid);
  app.append(area);

  function draw() {

    const q = search.value.trim().toLowerCase();

    grid.replaceChildren();

    const filtered = sections.filter(s => {

      const sub = s.id === 'excellence'
        ? [
            ...content.certificates,
            ...content.motivation,
            ...content.stars
          ]
        : content[s.id] || [];

      return [
        s.title,
        s.desc,
        ...sub.flat()
      ]
      .join(' ')
      .toLowerCase()
      .includes(q);

    });

    filtered.forEach(s => {
      grid.append(makeTile(s));
    });

    if(!filtered.length) {
      grid.append(
        el('p','empty','لا توجد نتائج مطابقة.')
      );
    }
  }

  search.addEventListener('input',draw);

  draw();
}

/* بطاقة لعبة أو نشاط */

function itemCard(item) {

  const [href,icon,title,desc] = item;

  const a = el('a','item');

  a.href = href;

  const e = el('span','emoji',icon);

  const txt = el('span');

  txt.append(
    el('strong','',title),
    el('small','',desc)
  );

  a.append(e,txt);

  return a;
}

/* صفحة القسم */

function section(id) {

  const info =
    sections.find(s => s.id === id)
    || categories[id];

  if(!info) {
    home();
    return;
  }

  app.replaceChildren();

  const box = el('section','panel');

  const back = el(
    'a',
    'back',
    '← العودة إلى الرئيسية'
  );

  back.href = '#home';

  box.append(back);

  const heading = el('div','heading');

  heading.append(
    el(
      'h2',
      '',
      (info.icon || '💎')+' '+info.title
    )
  );

  box.append(heading);

  if(id === 'excellence') {

    const grid = el('div','grid');

    Object.entries(categories).forEach(
      ([key,v]) => {

        grid.append(
          makeTile({
            ...v,
            id:key,
            desc:'شاهدي محتوى '+v.title
          })
        );

      }
    );

    box.append(grid);

  } else {

    const list = el('div','item-list');

    (content[id] || []).forEach(item => {
      list.append(itemCard(item));
    });

    if(!list.children.length) {

      box.append(
        el(
          'p',
          'empty',
          'هذا القسم جاهز لإضافة الأنشطة قريبًا.'
        )
      );

    } else {

      box.append(list);

    }
  }

  app.append(box);
}

/* التنقل */

function render() {

  const hash = decodeURIComponent(
    location.hash.slice(1)
  ) || 'home';

  if(hash === 'home' || hash === 'sections') {
    home();

    if(hash === 'sections') {
      requestAnimationFrame(() => {
        document.getElementById('sections')
          ?.scrollIntoView();
      });
    }

  } else {
    section(hash);
    window.scrollTo(0,0);
  }
}

window.addEventListener(
  'hashchange',
  render
);

render();

/* التحكم بالافتتاحية */

const intro = document.getElementById('intro');

let introTimer;
let hideTimer;

function closeIntro() {

  clearTimeout(introTimer);
  clearTimeout(hideTimer);

  intro.classList.add('hide');

  hideTimer = setTimeout(() => {
    intro.hidden = true;
  },900);

}

function playIntro() {

  clearTimeout(introTimer);
  clearTimeout(hideTimer);

  intro.hidden = false;

  intro.classList.remove('hide');

  introTimer = setTimeout(
    closeIntro,
    5500
  );

}

document.getElementById('skipIntro')
  .onclick = closeIntro;

document.getElementById('replay')
  .onclick = playIntro;

if(
  window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches
) {
  intro.hidden = true;
} else {
  playIntro();
}

</script>

</body>
</html>
