
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>جوهرة الأسبوع | تحدي الرياضيات</title>

<style>
:root {
  --green:#123c32;
  --gold:#d6ad55;
  --cream:#fffaf0;
  --ink:#24332e;
  --muted:#718078;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(145deg,#f5f0e3,#e4eee8);
  color:var(--ink);
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:18px;
}

.card {
  width:min(760px,100%);
  background:white;
  border:1px solid #e6dfcd;
  border-radius:26px;
  overflow:hidden;
  box-shadow:0 18px 55px #183e3020;
}

.top {
  background:var(--green);
  color:white;
  text-align:center;
  padding:30px 20px;
  position:relative;
}

.top:after {
  content:"✦";
  position:absolute;
  left:23px;
  top:16px;
  color:var(--gold);
  font-size:28px;
}

.eyebrow {
  color:#ead69f;
  font-size:14px;
}

.top h1 {
  margin:9px 0 7px;
  font-size:clamp(30px,6vw,44px);
  color:#f4d78f;
}

.top p {
  margin:0;
  color:#e5eee9;
}

.body {
  padding:22px clamp(15px,5vw,36px) 28px;
}

.row {
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:18px;
}

.score {
  background:#f7f0df;
  border:1px solid #ead9aa;
  color:#604c1e;
  padding:9px 13px;
  border-radius:99px;
  font-weight:bold;
}

.tabs {
  display:flex;
  gap:10px;
  margin-bottom:14px;
}

.tab {
  flex:1;
  border:1px solid #dbe3dd;
  border-radius:13px;
  padding:12px;
  background:#f8faf8;
  color:var(--green);
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.tab.active {
  background:var(--green);
  color:white;
  border-color:var(--green);
}

.question {
  background:var(--cream);
  border:1px solid #efe3bf;
  border-radius:20px;
  padding:22px;
  text-align:center;
}

.tag {
  color:#896b27;
  font-size:13px;
  font-weight:bold;
}

.q {
  font-size:clamp(21px,5vw,29px);
  line-height:1.7;
  margin:12px 0 17px;
  font-weight:bold;
}

.options {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.option {
  border:1px solid #d9dfd9;
  background:white;
  border-radius:13px;
  padding:13px 10px;
  font-size:18px;
  font-weight:bold;
  color:var(--ink);
  cursor:pointer;
}

.option:hover {
  border-color:var(--gold);
}

.option.selected {
  outline:3px solid #e4c771;
  background:#fff8df;
}

.option.correct {
  background:#e5f4e9;
  border-color:#68a47a;
}

.option.wrong {
  background:#fff0ed;
  border-color:#df8a7d;
}

.option:disabled {
  cursor:default;
}

.send {
  margin-top:16px;
  border:0;
  background:var(--gold);
  color:#24332e;
  border-radius:12px;
  padding:12px 22px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.send:disabled {
  opacity:.55;
  cursor:default;
}

.feedback {
  display:none;
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  font-weight:bold;
}

.feedback.show {
  display:block;
}

.feedback.good {
  background:#eaf4ed;
  color:#174a35;
}

.feedback.try {
  background:#fff0ed;
  color:#8d392c;
}

.foot {
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:21px;
}

.foot strong {
  color:var(--green);
}

.home {
  display:inline-block;
  margin-top:16px;
  color:var(--green);
  font-weight:bold;
  text-decoration:none;
  border:1px solid #d6ad55;
  padding:9px 18px;
  border-radius:12px;
}

@media(max-width:520px) {
  .options {
    grid-template-columns:1fr;
  }

  .question {
    padding:16px;
  }
}
</style>
</head>

<body>

<main class="card">

<header class="top">
  <div class="eyebrow">
    تحدٍّ رياضي جديد كل أسبوع
  </div>

  <h1>جوهرة الأسبوع 💎</h1>

  <p>
    اختاري صفك، أجيبي، واجمعي النقاط!
  </p>
</header>

<section class="body">

  <div class="row">
    <span id="weekLabel">تحدي هذا الأسبوع</span>
    <span class="score" id="score">نقاطك: ٠</span>
  </div>

  <div class="tabs">
    <button class="tab active" data-grade="5">
      الصف الخامس
    </button>

    <button class="tab" data-grade="6">
      الصف السادس
    </button>
  </div>

  <div class="question">

    <div class="tag" id="gradeLabel"></div>

    <div class="q" id="question"></div>

    <div class="options" id="options"></div>

    <button class="send" id="submit">
      اعتماد الإجابة
    </button>

    <div class="feedback" id="feedback"></div>

  </div>

  <div class="foot">
    بالتوفيق يا بطلات الرياضيات 🌷

    <br>

    <strong>
      المعلمة / جواهر السبيعي
    </strong>

    <br>

    <a class="home" href="index.html">
      🏠 العودة إلى بوابة الرياضيات
    </a>
  </div>

</section>

</main>

<script>

/* بنك الأسئلة الأصلي */

const bank = {

  5: [
    {
      q:"أكملي النمط: ٨، ١٦، ٣٢، ٦٤، ___",
      o:["١٢٠","١٢٨","٩٦","١١٢"],
      a:1
    },
    {
      q:"ما ناتج ٢٤٦ ÷ ٦؟",
      o:["٤٠","٤١","٤٢","٤٦"],
      a:1
    },
    {
      q:"احسبي: ٧ × ٨ + ١٢",
      o:["٥٦","٦٤","٦٨","٧٢"],
      a:2
    },
    {
      q:"معكِ ٥٠٠ ريال، دفعتِ ٢٧٨ ريالًا. كم بقي؟",
      o:["٢١٢","٢٢٢","٢٣٢","٢٢٨"],
      a:1
    },
    {
      q:"عدد إذا ضربناه في ٩ كان الناتج ٧٢، فما العدد؟",
      o:["٦","٧","٨","٩"],
      a:2
    }
  ],

  6: [
    {
      q:"بسّطي الكسر ١٨⁄٢٤ إلى أبسط صورة.",
      o:["٣⁄٤","٣⁄٨","٢⁄٣","٦⁄٧"],
      a:0
    },
    {
      q:"احسبي: ٢٫٤ × ٣",
      o:["٦٫٢","٧٫٢","٧٫٤","٨٫٢"],
      a:1
    },
    {
      q:"احسبي: ٦٫٣٥ + ٢٫٨",
      o:["٨٫١٥","٩٫٠٥","٩٫١٥","٩٫٨٥"],
      a:2
    },
    {
      q:"أيّهما أكبر؟",
      o:["٠٫٧","٠٫٦٨","متساويان","لا يمكن المقارنة"],
      a:0
    },
    {
      q:"ما ناتج ٣⁄٤ من ٢٠؟",
      o:["١٢","١٤","١٥","١٦"],
      a:2
    }
  ]

};

/* حساب رقم الأسبوع */

function weekNumber(date) {
  const d = new Date(
    Date.UTC(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    )
  );

  const day = d.getUTCDay() || 7;

  d.setUTCDate(d.getUTCDate() + 4 - day);

  const yearStart = new Date(
    Date.UTC(d.getUTCFullYear(),0,1)
  );

  return Math.ceil(
    (((d-yearStart)/86400000)+1)/7
  );
}

function weekInfo() {
  const now = new Date();

  const parts = new Intl.DateTimeFormat(
    "en-US",{
      timeZone:"Asia/Riyadh",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).formatToParts(now);

  const get = type =>
    Number(parts.find(p=>p.type===type).value);

  const date = new Date(
    get("year"),
    get("month")-1,
    get("day")
  );

  const number = weekNumber(date);

  return {
    year:date.getFullYear(),
    number,
    index:(number-1)%bank[5].length
  };
}

const currentWeek = weekInfo();

let grade = 5;
let selected = -1;

function toAr(number) {
  return String(number).replace(
    /[0-9]/g,
    d=>"٠١٢٣٤٥٦٧٨٩"[d]
  );
}

/* حفظ النقاط والإجابات */

function scoreKey() {
  return "jawharaPoints_"+grade;
}

function answerKey() {
  return [
    "jawharaAnswer",
    currentWeek.year,
    currentWeek.number,
    grade
  ].join("_");
}

function savedAnswer() {
  const value = localStorage.getItem(answerKey());

  if(value===null) return null;

  try {
    return JSON.parse(value);
  } catch {
    return null;
  }
}

function updateScore() {
  const points = Number(
    localStorage.getItem(scoreKey())||0
  );

  document.getElementById("score").textContent =
    "نقاطك: "+toAr(points);
}

function feedback(message,good) {
  const el = document.getElementById("feedback");

  el.textContent = message;

  el.className =
    "feedback show "+(good?"good":"try");
}

function lockChoices(answer) {
  const item = bank[grade][currentWeek.index];

  document.querySelectorAll(".option").forEach(
    (button,i)=>{
      button.disabled=true;

      if(i===item.a) {
        button.classList.add("correct");
      }

      if(i===answer.choice && !answer.correct) {
        button.classList.add("wrong");
      }
    }
  );

  document.getElementById("submit").disabled=true;
}

/* عرض التحدي */

function render() {

  selected=-1;

  const item = bank[grade][currentWeek.index];

  document.getElementById("weekLabel").textContent =
    "تحدي الأسبوع "+toAr(currentWeek.number);

  document.getElementById("gradeLabel").textContent =
    "تحدي الصف "+
    (grade===5?"الخامس":"السادس");

  document.getElementById("question").textContent =
    item.q;

  const options = document.getElementById("options");

  options.replaceChildren();

  item.o.forEach((text,i)=>{

    const button=document.createElement("button");

    button.className="option";
    button.textContent=text;

    button.onclick=()=>{

      if(savedAnswer()!==null) return;

      selected=i;

      document.querySelectorAll(".option").forEach(
        (b,j)=>{
          b.classList.toggle(
            "selected",
            j===selected
          );
        }
      );
    };

    options.append(button);
  });

  document.getElementById("submit").disabled=false;

  document.getElementById("feedback").className =
    "feedback";

  updateScore();

  const answer=savedAnswer();

  if(answer!==null) {

    lockChoices(answer);

    if(answer.correct) {
      feedback(
        "أحسنتِ! سبق أن أجبتِ إجابة صحيحة وحصلتِ على ١٠ نقاط ⭐",
        true
      );
    } else {
      feedback(
        "سبق أن شاركتِ في تحدي هذا الأسبوع. الإجابة الصحيحة: "+
        item.o[item.a],
        false
      );
    }
  }
}

/* اختيار الصف */

document.querySelectorAll(".tab").forEach(button=>{

  button.onclick=()=>{

    grade=Number(button.dataset.grade);

    document.querySelectorAll(".tab").forEach(b=>{
      b.classList.toggle(
        "active",
        b===button
      );
    });

    render();
  };
});

/* اعتماد الإجابة */

document.getElementById("submit").onclick=()=>{

  if(savedAnswer()!==null) {
    render();
    return;
  }

  if(selected<0) {
    feedback("اختاري إجابة أولًا 🌷",false);
    return;
  }

  const item=bank[grade][currentWeek.index];

  const correct=selected===item.a;

  const answer={
    choice:selected,
    correct:correct,
    question:item.q
  };

  try {

    localStorage.setItem(
      answerKey(),
      JSON.stringify(answer)
    );

    if(correct) {

      const oldPoints=Number(
        localStorage.getItem(scoreKey())||0
      );

      localStorage.setItem(
        scoreKey(),
        oldPoints+10
      );
    }

  } catch(error) {
    feedback(
      "تعذر حفظ الإجابة على هذا الجهاز. حاولي مرة أخرى.",
      false
    );
    return;
  }

  render();

  if(correct) {
    feedback(
      "إجابة صحيحة! أضفنا لكِ ١٠ نقاط ✨",
      true
    );
  } else {
    feedback(
      "تم حفظ مشاركتك. الإجابة الصحيحة: "+
      item.o[item.a],
      false
    );
  }
};

render();

</script>

</body>
</html>
