
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>بوابة الرياضيات | جواهر السبيعي</title>

<style>
:root {
  --green: #174d3b;
  --gold: #caa74e;
  --bg: #f3f7f3;
  --ink: #193d30;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Tahoma, Arial, sans-serif;
  line-height: 1.8;
}

header {
  text-align: center;
  background: linear-gradient(125deg, #123c30, #226c53);
  color: white;
  padding: 42px 15px;
  border-bottom: 5px solid var(--gold);
}

header h1 {
  font-size: 34px;
  margin: 5px 0;
}

header p {
  color: #f3dfa8;
}

main {
  max-width: 1000px;
  margin: 30px auto;
  padding: 0 16px;
  min-height: 55vh;
}

h2 {
  border-right: 5px solid var(--gold);
  padding-right: 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 18px;
}

.card {
  background: white;
  border: 1px solid #dfe8df;
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 5px 20px #153d2810;
}

.card h3 {
  margin: 8px 0;
}

.card p,
.muted {
  color: #64756a;
}

.icon {
  font-size: 40px;
}

.btn {
  display: inline-block;
  background: #185b44;
  color: white;
  padding: 11px 18px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
  text-align: center;
  border: 0;
  cursor: pointer;
}

.btn:hover {
  background: #104332;
}

.items {
  display: grid;
  gap: 16px;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.item h3 {
  margin: 0;
}

.item small {
  color: #66786d;
}

.tag {
  display: inline-block;
  padding: 5px 15px;
  border-radius: 25px;
  background: #fff8df;
  border: 1px solid #ecd99c;
  color: #6c571e;
}

footer {
  text-align: center;
  padding: 25px;
  color: #557262;
}

a {
  overflow-wrap: anywhere;
}

@media (max-width: 540px) {
  .item .btn {
    width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <div style="font-size:44px">✦ 📐 ✦</div>
  <h1>بوابة الرياضيات</h1>
  <p>نتعلم • نتحدى • نبدع</p>
  <strong>المعلمة/ جواهر السبيعي</strong>
</header>

<main id="app"></main>

<footer>
  إعداد المعلمة/ جواهر السبيعي
</footer>

<script>

/* محتويات البوابة */

const content = {

  grade5: [],

  grade6: [
    {
      title: '🚂 قطار التحدي الرياضي',
      description: 'الكسور العشرية • أربع محطات',
      url: 'train.html'
    }
  ],

  summaries5: [],
  summaries6: [],
  challenges: [],

  /* الشهادات والتكريمات */

  certificates: [
    {
      title: '🎖️ شهادات شكر',
      description: 'شهادات التقدير والإنجاز',
      url: 'thank_you_certificates.pdf.pdf'
    },
    {
      title: '👩‍🏫 تكريم المعلمة الصغيرة',
      description: 'شهادة تقدير للمعلمة الصغيرة',
      url: 'تكريم المعلمة الصغيرة.jpg'
    },
    {
      title: '👑 شهادة نجمة الشهر',
      description: 'شهادة شكر نجمة الشهر',
      url: 'شهادة شكر نجمة الشهر.PNG'
    },
    {
      title: '🎬 نجمة الشهر – سادس',
      description: 'فيديو تكريم سنا الحويشان',
      url: 'نجمة الشهر صف سادس سنا الحويشان.MOV'
    }
  ],

  /* التحفيزات */

  motivation: [
    {
      title: '💌 بريد السعادة',
      description: 'مبادرة تحفيزية لنشر السعادة والتشجيع',
      url: 'بريد السعادة.HEIC'
    },
    {
      title: '🌟 المتميزات في القسمة – خامس',
      description: 'تكريم المتميزات في مهارة القسمة',
      url: 'الطالبات المميزات في القسمة الصف الخامس .pdf'
    },
    {
      title: '💚 تحفيز طالبات سادس',
      description: 'قسمة الكسور العشرية',
      url: 'تحفيز طالبات الصف السادس قسمة الكسور العشرية.HEIC'
    },
    {
      title: '✨ تحفيز في حصة القسمة',
      description: 'القسمة على عدد من رقمين',
      url: 'تحفيز في الحصة القسمة على عدد من رقمين .jpg'
    }
  ],

  /* نجمات التميز */

  stars: [
    {
      title: '⭐ نجمة اليوم',
      description: 'إعلان نجمة اليوم بمؤثرات احتفالية',
      url: 'نجمة اليوم.html'
    },
    {
      title: '🎭 نجمات الخميس',
      description: 'مسرح الحضور والتميز',
      url: 'hursday_stars.html'
    },
    {
      title: '⭐ نجمة الأسبوع',
      description: 'تكريم جنان بوخضر',
      url: 'نجمة الاسبوع جنان بوخضر .PNG'
    },
    {
      title: '🏆 بطلات القسمة',
      description: 'تكريم بطلات القسمة للصفين الخامس والسادس',
      url: 'division_heroes.html'
    }
  ],

  activities: [],
  practice: []

};

/* أسماء الأقسام */

const categories = {

  grade5: {
    title: '🎮 ألعاب الصف الخامس',
    icon: '🎯',
    description: 'ألعاب الرياضيات التفاعلية للصف الخامس'
  },

  grade6: {
    title: '🎮 ألعاب الصف السادس',
    icon: '🚂',
    description: 'ألعاب الرياضيات التفاعلية للصف السادس'
  },

  summaries5: {
    title: '📚 ملخص للدروس – خامس',
    icon: '📘',
    description: 'ملخصات وملفات الصف الخامس'
  },

  summaries6: {
    title: '📚 ملخص للدروس – سادس',
    icon: '📗',
    description: 'ملخصات وملفات الصف السادس'
  },

  challenges: {
    title: '⭐ التحدي الأسبوعي',
    icon: '⭐',
    description: 'تحديات رياضية متجددة'
  },

  certificates: {
    title: '🏅 الشهادات والتكريمات',
    icon: '🏅',
    description: 'شهادات الشكر والتقدير ونجمة الشهر'
  },

  motivation: {
    title: '💌 التحفيزات',
    icon: '💌',
    description: 'بريد السعادة وتحفيز الطالبات'
  },

  stars: {
    title: '🌟 نجمات التميز',
    icon: '🌟',
    description: 'نجمة اليوم ونجمات الخميس وبطلات القسمة'
  },

  activities: {
    title: '🎉 الأنشطة والمناسبات',
    icon: '🎉',
    description: 'إذاعات ومبادرات وفعاليات مدرسية'
  },

  practice: {
    title: '📝 التدريبات والاختبارات',
    icon: '✏️',
    description: 'أوراق عمل وتدريبات واختبارات'
  }

};

const app = document.getElementById('app');

function element(tag, cls, text) {
  const e = document.createElement(tag);

  if (cls) {
    e.className = cls;
  }

  if (text !== undefined) {
    e.textContent = text;
  }

  return e;
}

function link(label, url) {
  const a = element('a', 'btn', label);

  if (url.startsWith('#')) {
    a.href = url;
  } else if (/^https?:\/\//i.test(url)) {
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
  } else {
    a.href = encodeURI(url);
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
  }

  return a;
}

function card(icon, title, description, button, url) {
  const c = element('article', 'card');

  c.append(
    element('div', 'icon', icon),
    element('h3', '', title),
    element('p', '', description),
    link(button, url)
  );

  return c;
}

/* الصفحة الرئيسية */

function home() {
  app.replaceChildren();

  const grid = element('div', 'grid');

  grid.append(

    card(
      '🎯',
      'ألعاب الصف الخامس',
      'ألعاب وتحديات تفاعلية',
      'افتحي ألعاب خامس',
      '#grade5'
    ),

    card(
      '🚂',
      'ألعاب الصف السادس',
      'قطار التحدي وألعاب جديدة',
      'افتحي ألعاب سادس',
      '#grade6'
    ),

    card(
      '🏆',
      'عبقريات نافس',
      'تحديات نافس • نقاط • منافسة شهرية',
      'دخول عبقريات نافس',
      'nafes.html'
    ),

    card(
      '📘',
      'ملخصات الصف الخامس',
      'ملخصات الدروس والمهارات',
      'افتحي الملخصات',
      '#summaries5'
    ),

    card(
      '📗',
      'ملخصات الصف السادس',
      'ملخصات الدروس والمهارات',
      'افتحي الملخصات',
      '#summaries6'
    ),

    card(
      '⭐',
      'التحدي الأسبوعي',
      'تحديات رياضية ممتعة',
      'افتحي التحديات',
      '#challenges'
    ),

    card(
      '🎖️',
      'لوحة التميز والتكريمات',
      'الشهادات • التحفيزات • نجمات التميز',
      'افتحي لوحة التميز',
      '#excellence'
    ),

    card(
      '🎉',
      'الأنشطة والمناسبات',
      'إذاعات • مبادرات • مناسبات مدرسية',
      'افتحي الأنشطة',
      '#activities'
    ),

    card(
      '📝',
      'التدريبات والاختبارات',
      'تدريبات واختبارات وأوراق عمل',
      'افتحي التدريبات',
      '#practice'
    )

  );

  app.append(
    element('h2', '', 'أقسام بوابة الرياضيات'),
    grid
  );
}

/* لوحة التميز الرئيسية */

function excellenceHome() {
  app.replaceChildren();

  const grid = element('div', 'grid');

  grid.append(

    card(
      '🏅',
      'الشهادات والتكريمات',
      'شهادات الشكر والتقدير ونجمة الشهر',
      'افتحي الشهادات',
      '#certificates'
    ),

    card(
      '💌',
      'التحفيزات',
      'بريد السعادة وتحفيز الطالبات',
      'افتحي التحفيزات',
      '#motivation'
    ),

    card(
      '🌟',
      'نجمات التميز',
      'نجمة اليوم ونجمات الخميس وبطلات القسمة',
      'افتحي النجمات',
      '#stars'
    )

  );

  app.append(
    link('↩ العودة للبوابة', '#home'),
    element('h2', '', '🎖️ لوحة التميز والتكريمات'),
    element('p', 'muted', 'اختاري القسم الذي تريدين استعراضه'),
    grid
  );
}

/* عرض محتويات كل قسم */

function section(key) {
  const info = categories[key];

  if (!info) {
    home();
    return;
  }

  app.replaceChildren();

  const backUrl = ['certificates', 'motivation', 'stars'].includes(key)
    ? '#excellence'
    : '#home';

  app.append(
    link('↩ رجوع', backUrl),
    element('h2', '', info.title),
    element('p', 'muted', info.description)
  );

  const items = content[key] || [];

  if (items.length === 0) {
    const box = element('article', 'card');

    box.append(
      element('div', 'icon', info.icon),
      element('h3', '', 'لا يوجد محتوى منشور حاليًا'),
      element('p', 'muted', 'سيظهر المحتوى هنا عند إضافته.'),
      element('span', 'tag', 'قريبًا')
    );

    app.append(box);
    return;
  }

  const list = element('div', 'items');

  items.forEach(item => {
    const box = element('article', 'card item');
    const details = element('div');

    details.append(
      element('h3', '', item.title)
    );

    if (item.description) {
      details.append(
        element('small', '', item.description)
      );
    }

    box.append(
      details,
      link('فتح المحتوى ↗', item.url)
    );

    list.append(box);
  });

  app.append(list);
}

/* التنقل بين الأقسام */

function render() {
  const key = decodeURIComponent(location.hash.slice(1));

  if (!key || key === 'home') {
    home();
  } else if (key === 'excellence') {
    excellenceHome();
  } else {
    section(key);
  }

  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', render);

render();

</script>
</body>
</html>
