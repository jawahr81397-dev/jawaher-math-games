  --green:#174d3b;
  --gold:#caa74e;
  --bg:#f3f7f3;
  --ink:#193d30;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Tahoma,Arial,sans-serif;
  line-height:1.8;
}
header {
  text-align:center;
  background:linear-gradient(125deg,#123c30,#226c53);
  color:white;
  padding:42px 15px;
  border-bottom:5px solid var(--gold);
}
header h1 {font-size:34px;margin:5px 0}
header p {color:#f3dfa8}
main {
  max-width:1050px;
  margin:30px auto;
  padding:0 16px;
  min-height:55vh;
}
h2 {
  border-right:5px solid var(--gold);
  padding-right:12px;
  margin-top:25px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:18px;
}
.card {
  background:white;
  border:1px solid #dfe8df;
  border-radius:20px;
  padding:24px;
  box-shadow:0 5px 20px #153d2810;
}
.card h3 {margin:8px 0}
.card p,.muted {color:#64756a}
.icon {font-size:40px}
.btn {
  display:inline-block;
  background:#185b44;
  color:white;
  padding:11px 18px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
  text-align:center;
}
.btn:hover {background:#104332}
.items {display:grid;gap:16px}
.item {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:16px;
}
.item h3 {margin:0}
.item small {color:#66786d}
.tag {
  display:inline-block;
  padding:5px 15px;
  border-radius:25px;
  background:#fff8df;
  border:1px solid #ecd99c;
  color:#6c571e;
}
footer {
  text-align:center;
  padding:25px;
  color:#557262;
}
a {overflow-wrap:anywhere}
@media(max-width:540px){
  .item .btn {width:100%}
  header h1 {font-size:29px}
}
</style>

  }

const app = document.getElementById('app');

function element(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function link(label, url) {
  const a = element('a','btn',label);

  if (url.startsWith('#')) {
    a.href = url;
  } else {
    a.href = /^https?:\/\//i.test(url)
      ? url
      : encodeURI(url);
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
  }

  return a;
}

function card(icon,title,description,button,url) {
  const c = element('article','card');
  c.append(
    element('div','icon',icon),
    element('h3','',title),
    element('p','',description),
    link(button,url)
  );
  return c;
}

  app.replaceChildren();
  const grid = element('div','grid');

  grid.append(

      'ألعاب وتحديات تفاعلية',

    card('🚀','ألعاب الصف السادس',
      'قطار التحدي • سباق المجرة • مختبر جواهر السري الجديد',
      'افتحي ألعاب سادس','#grade6'),

    card('🏆','عبقريات نافس',
      'تحديات نافس والمنافسة الشهرية',
      'دخول عبقريات نافس','nafes.html'),

      'افتحي حقيبة خامس','#review5'),

      'حقيبة جواهر وأوراق العمل',
      'افتحي حقيبة سادس','#review6'),

function excellenceHome() {
  app.replaceChildren();
  const grid = element('div','grid');

  grid.append(
    card('🏅','الشهادات والتكريمات',
      'شهادات الشكر والتقدير',
      'افتحي الشهادات','#certificates'),

    card('💌','التحفيزات',

      'نجمة اليوم ونجمات الخميس وبطلات القسمة',
      'افتحي النجمات','#stars')
  );

  app.append(
    link('↩ العودة للبوابة','#home'),
    element('h2','','🎖️ لوحة التميز والتكريمات'),
    element('p','muted','اختاري القسم المطلوب'),
    grid
  );
}

function section(key) {
  const info = categories[key];

  if (!info) {
    home();
    return;
  }

  app.replaceChildren();

  const backUrl =
    ['certificates','motivation','stars'].includes(key)
    ? '#excellence' : '#home';

  app.append(
    link('↩ رجوع',backUrl),
    element('h2','',info.title),
    element('p','muted',info.description)
  );

  const items = content[key] || [];

  if (!items.length) {
    const box = element('article','card');

    box.append(
      element('div','icon',info.icon),
      element('h3','','لا يوجد محتوى منشور حاليًا'),
      element('p','muted','سيظهر المحتوى هنا عند إضافته.'),
      element('span','tag','قريبًا')
    );

    app.append(box);
    return;
  }

  const list = element('div','items');

  items.forEach(item => {
    const box = element('article','card item');
    const details = element('div');

    details.append(
      element('h3','',item.title)
    );

    if (item.description) {
      details.append(
        element('small','',item.description)
      );
    }

    box.append(
      details,
      link('فتح المحتوى ↗',item.url)
    );

    list.append(box);
  });

  app.append(list);
}

function render() {
  const key = decodeURIComponent(location.hash.slice(1));

  if (!key || key === 'home') {
    home();
  } else if (key === 'excellence') {
    excellenceHome();
  } else {
    section(key);
  }

  window.scrollTo(0,0);
}

window.addEventListener('hashchange',render);
render();
</script>
