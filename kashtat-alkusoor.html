<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كشتة الكسور | مغامرة الرفيقتين</title>
<style>
:root{--navy:#0a1330;--brown:#5a3a22;--sand:#d9b987;--copper:#c9783a;--gold:#ffd36b;--cream:#fff4dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);color:var(--cream);font-family:"Geeza Pro","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.hide{display:none!important}
#cam{position:fixed;inset:0;transform-origin:50% 80%;transition:transform 1.4s cubic-bezier(.5,0,.2,1)}
#cam.intro{animation:push 9s ease-out forwards}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.3)}}
#scene{width:100%;height:100%;display:block}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
.cl{animation:cl 60s linear infinite alternate}@keyframes cl{to{transform:translateX(120px)}}
.fl1,.fl2,.fl3{transform-box:fill-box;transform-origin:50% 100%;animation:fk .5s ease-in-out infinite alternate}
.fl2{animation-duration:.37s}.fl3{animation-duration:.29s}
@keyframes fk{from{transform:scaleY(.88) skewX(-4deg)}to{transform:scaleY(1.1) skewX(5deg)}}
.fg{animation:gl 1.2s ease-in-out infinite alternate}@keyframes gl{to{opacity:.6}}
.sp{animation:sp 2.4s linear infinite;opacity:0}@keyframes sp{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-2px)}}
.coat{transform-box:fill-box;transform-origin:50% 0;animation:sw 3.2s ease-in-out infinite}@keyframes sw{50%{transform:skewX(2deg)}}
.arm{transform-box:fill-box;transform-origin:50% 0}
.point .arm.r{transform:rotate(115deg)}
.cheering .arm.l{animation:chl .45s ease-in-out infinite alternate}
.cheering .arm.r{animation:chr .45s ease-in-out infinite alternate}
@keyframes chl{from{transform:rotate(-150deg)}to{transform:rotate(-110deg)}}
@keyframes chr{from{transform:rotate(150deg)}to{transform:rotate(110deg)}}
.cheering .bob{animation-duration:.5s}
.tent{cursor:pointer;pointer-events:all;touch-action:manipulation}
.fl{transition:transform .8s ease;transform-box:fill-box}.fl.l{transform-origin:0 100%}.fl.r{transform-origin:100% 100%}
.tent.open .fl{transform:scaleX(.15)}
.tent .ck{opacity:0}.tent.done .ck{opacity:1}.tent.done .in{fill:#ffe9a8}
.tent.next .bd{transform-box:fill-box;transform-origin:center;animation:pl 1.1s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.25)}}
.tent .wm{animation:gl 2.2s ease-in-out infinite alternate}
body.lit .tent{filter:brightness(1.25)}
#tent-nav{position:fixed;bottom:max(54px,env(safe-area-inset-bottom) + 48px);left:50%;transform:translateX(-50%);display:flex;gap:9px;z-index:4;direction:rtl;justify-content:center;width:min(96vw,600px)}
#tent-nav button{touch-action:manipulation;flex:1;min-width:0;border-radius:18px;padding:11px 4px;background:#2b1a0eea;border:2px solid #ffd36b;color:#fff4dc;font-weight:800;font-size:clamp(14px,2.6vw,20px);box-shadow:0 4px 18px #0008}
#tent-nav button.done{background:#305334;border-color:#8ad18a}
#tent-nav button:active{transform:scale(.96)}
#walker{transition:transform .9s ease,opacity .3s;opacity:0}
#host{transition:transform 1.2s ease}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px max(6vh,28px);text-align:center;gap:14px;transition:opacity .8s}
.bubble{background:#fff4dc;color:#4a2b14;border-radius:22px;padding:14px 22px;font-size:clamp(20px,3.2vw,34px);font-weight:700;max-width:min(92vw,820px);line-height:1.6;box-shadow:0 8px 30px #0008;opacity:0;animation:in .8s forwards}
.b2{background:#2b1a0e;color:var(--gold);border:2px solid var(--copper);animation-delay:3.6s}.b1{animation-delay:1s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.big{font-size:clamp(24px,4vw,40px);padding:16px 44px;border-radius:50px;background:linear-gradient(#ffd36b,#e0912f);color:#3b2008;font-weight:800;box-shadow:0 0 34px #ffb34799,0 6px 0 #8a5217;opacity:0;animation:in .8s 6s forwards,gb 1.6s 7s ease-in-out infinite alternate}
@keyframes gb{to{box-shadow:0 0 60px #ffd36bcc,0 6px 0 #8a5217}}
.big:active{transform:translateY(3px)}
#bar{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#bar>*{pointer-events:auto}
.pill{background:#1a0f08cc;border:2px solid var(--copper);border-radius:40px;padding:8px 18px;font-size:18px;font-weight:700}
#hint{pointer-events:none;position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:clamp(18px,2.6vw,26px);font-weight:700;text-shadow:0 2px 8px #000}
#card{position:fixed;inset:0;background:#02061099;display:flex;align-items:center;justify-content:center;padding:10px;z-index:5;animation:fi .5s}
@keyframes fi{from{opacity:0}}
.box{width:min(96vw,900px);max-height:96dvh;overflow:auto;background:linear-gradient(#6b4528,#4a2d18);border:6px solid #8a5a30;border-radius:26px;padding:16px 20px 18px;box-shadow:0 20px 60px #000c,inset 0 0 40px #2a160888;animation:pop .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:translateY(60px) rotate(-3deg) scale(.85);opacity:0}}
.paper{background:#f7ecd2;color:#3a2412;border-radius:14px;padding:14px 16px;box-shadow:inset 0 0 24px #c9a56a88}
#qt{margin:0 0 8px;font-size:clamp(24px,3.6vw,36px);color:var(--gold)}
#qs{margin:0;font-size:clamp(22px,3.2vw,32px);line-height:2;font-weight:600}
#cmp{direction:ltr;display:flex;align-items:center;justify-content:center;gap:18px;font-size:clamp(34px,6vw,60px);font-weight:800;margin:10px 0 2px;color:#3a2412}
#slot{min-width:1.3em;height:1.3em;border:3px dashed #b07a3a;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#b0512a}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;direction:ltr;unicode-bidi:isolate;margin:0 .12em;line-height:1.15}
.fr i{font-style:normal;padding:0 .18em}
.fr b{display:block;align-self:stretch;height:.11em;min-height:3px;background:#d4521d;margin:.06em 0;border-radius:3px}
.mx{display:inline-flex;align-items:center;direction:ltr;unicode-bidi:isolate;gap:.1em;margin:0 .12em}
.mx .w{font-style:normal}
#signs{direction:ltr;display:flex;justify-content:center;gap:14px;margin:10px 0}
.sgn{width:clamp(80px,22vw,150px);padding:8px 6px;border-radius:18px;background:#2b1a0e;border:3px solid var(--copper);font-size:clamp(14px,2.2vw,20px);font-weight:700}
.sgn span{display:block;font-size:clamp(34px,6vw,54px);color:var(--gold);line-height:1.1}
.sgn.on{background:var(--gold);color:#3b2008;border-color:#fff}.sgn.on span{color:#3b2008}
#tm{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0}
#tm svg{width:56px;height:80px}
#sec{font-size:36px;font-weight:800;min-width:2.2em;text-align:center;color:var(--gold)}
#sec.end{animation:pl 0.6s infinite;color:#ff8a5c}
.btn{border-radius:40px;padding:11px 24px;font-size:clamp(18px,2.6vw,24px);font-weight:800;background:#2b1a0e;border:3px solid var(--copper);color:var(--cream)}
.btn.gold{background:linear-gradient(#ffd36b,#e0912f);color:#3b2008;border-color:#fff2c0}
.btn:disabled{opacity:.4}
#sol{margin-top:10px}
#sol .ans{font-size:clamp(22px,3.4vw,34px);font-weight:800;color:#2f6b2a;text-align:center;margin-bottom:6px}
#sol .st{font-size:clamp(22px,3.2vw,32px);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:5px 0;opacity:0;animation:in .7s forwards;font-weight:600}
.row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.star{position:fixed;pointer-events:none;z-index:9;color:var(--gold);animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}
#fin{z-index:6;background:radial-gradient(#0000 30%,#020610cc)}
#fin h1{margin:0;font-size:clamp(28px,5vw,56px);color:var(--gold);text-shadow:0 0 24px #ffb347,0 3px 8px #000;opacity:0;animation:in 1s 1.2s forwards}
#fin h2{margin:0;font-size:clamp(24px,4vw,44px);opacity:0;animation:in 1s 3.4s forwards;text-shadow:0 3px 8px #000}
#fin h3{margin:0;font-size:clamp(20px,3vw,30px);color:var(--sand);opacity:0;animation:in 1s 5s forwards}
#fin .btn{opacity:0;animation:in 1s 6s forwards}
@media (prefers-reduced-motion:reduce){#cam.intro{animation:none}}
</style>
</head>
<body>
<div id="cam" class="intro"><svg id="scene" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice"></svg></div>

<div id="intro" class="ov">
  <div class="bubble b1">يا هلا بالرفيقات! برد الكشتة ما يدفّيه إلا حل الكسور!</div>
  <div class="bubble b2">أربع خيام… أربعة أسرار… ومغامرة رياضية تنتظركم!</div>
  <button class="big" id="go">يلا نكشت!</button>
</div>

<div id="bar" class="hide">
  <div class="pill" id="prog"></div>
  <button class="pill" id="mute" aria-label="الصوت">🔊 الصوت</button>
</div>
<div id="hint" class="hide">اضغطي على الخيمة أو اختاري رقمها من الأزرار 🏕️</div>
<div id="tent-nav" class="hide" aria-label="اختيار الخيمة"><button type="button" data-tent="0">⛺ الخيمة ١</button><button type="button" data-tent="1">⛺ الخيمة ٢</button><button type="button" data-tent="2">⛺ الخيمة ٣</button><button type="button" data-tent="3">⛺ الخيمة ٤</button></div>

<div id="card" class="hide"><div class="box">
  <div class="paper">
    <h2 id="qt"></h2><p id="qs"></p>
    <div id="cmp"><span id="fa"></span><div id="slot"></div><span id="fb"></span></div>
  </div>
  <div id="signs">
    <button class="sgn" data-s="&lt;"><span>&lt;</span>أصغر من</button>
    <button class="sgn" data-s="="><span>=</span>يساوي</button>
    <button class="sgn" data-s="&gt;"><span>&gt;</span>أكبر من</button>
  </div>
  <div id="tm">
    <svg viewBox="0 0 56 80"><defs><clipPath id="lc"><rect id="lr" x="10" y="20" width="36" height="42"/></clipPath></defs>
      <path d="M20 8Q28 0 36 8" stroke="#c9783a" stroke-width="3" fill="none"/><rect x="14" y="8" width="28" height="8" rx="3" fill="#c9783a"/>
      <rect x="10" y="20" width="36" height="42" rx="6" fill="#2a1a0e" stroke="#c9783a" stroke-width="3"/>
      <rect x="10" y="20" width="36" height="42" rx="6" fill="#ffc94d" clip-path="url(#lc)"/>
      <rect x="12" y="62" width="32" height="8" rx="3" fill="#c9783a"/></svg>
    <div id="sec">٦٠</div>
    <button class="btn" id="tgl">▶ ابدأ</button><button class="btn" id="rst">↺ إعادة</button>
  </div>
  <div class="row"><button class="btn gold" id="rev">اكشفي السر 🔓</button></div>
  <div id="sol" class="paper hide"></div>
  <div class="row"><button class="btn gold hide" id="nxt">الخيمة التالية ⏭</button><button class="btn" id="back">⛺ العودة إلى المخيم</button></div>
</div></div>

<div id="fin" class="ov hide">
  <h1>يا نجمات الكشتة… أبدعتن في كشف أسرار الكسور!</h1>
  <h2>انتهت مغامرتنا… وبدأت إجازتنا!</h2>
  <h3>المعلمة جواهر السبيعي</h3>
  <button class="btn gold" id="again">🔥 أعيدي المغامرة</button>
</div>

<script>
const $=s=>document.querySelector(s);
const A=s=>String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const F=s=>A(s.replace(/\{(?:(\d+)\+)?(\d+)\/(\d+)\}/g,(m,w,n,d)=>{
  const fr=`<span class="fr"><i>${n}</i><b></b><i>${d}</i></span>`;
  return w?`<span class="mx"><i class="w">${w}</i>${fr}</span>`:fr}));
const tk=([w,n,d])=>`{${w?w+'+':''}${n}/${d}}`;
const val=([w,n,d])=>w+n/d;
const cmp=(a,b)=>{const x=val(a),y=val(b);return Math.abs(x-y)<1e-9?'=':x>y?'>':'<'};

const Q=[
 {t:'🍕 صينية الكشتة',s:'أكلت مجموعة {2/3} من صينية بيتزا، وأكلت مجموعة أخرى {3/5} من صينية مماثلة. قارني بين الكسرين.',
  a:[0,2,3],b:[0,3,5],st:['{2/3} = {10/15}','{3/5} = {9/15}','إذن الكسر الأول أكبر: {2/3} أكبر من {3/5}']},
 {t:'🧃 عصائر المخيم',s:'شربت فاطمة {5/6} لتر من العصير، وشربت ملاك {7/9} لتر. قارني بين الكسرين.',
  a:[0,5,6],b:[0,7,9],st:['{5/6} = {15/18}','{7/9} = {14/18}','إذن الكسر الأول أكبر: {5/6} أكبر من {7/9}']},
 {t:'🥪 سندويتشات الكشتة',s:'استُخدم {1+2/3} متر من شريط تزيين إحدى الطاولات، واستُخدم {1+3/4} متر من شريط مماثل للطاولة الأخرى. قارني بين العددين الكسريين.',
  a:[1,2,3],b:[1,3,4],st:['الأجزاء الصحيحة متساوية: ١ = ١','{2/3} = {8/12}','{3/4} = {9/12}','إذن {1+2/3} أصغر من {1+3/4}']},
 {t:'🏮 زينة المخيم',s:'استُخدم {2+3/5} متر من شريط الزينة الأول، و{2+5/8} متر من الشريط الثاني. قارني بين العددين الكسريين.',
  a:[2,3,5],b:[2,5,8],st:['الأجزاء الصحيحة متساوية: ٢ = ٢','{3/5} = {24/40}','{5/8} = {25/40}','إذن {2+3/5} أصغر من {2+5/8}']}
];
Q.forEach(q=>{q.ans=cmp(q.a,q.b)});
console.assert(Q.map(q=>q.ans).join('')==='>><<','تحقق المقارنات');
const NAMES={'>':'أكبر من','<':'أصغر من','=':'يساوي'};
const TX=[110,290,510,690];

/* ---------- المشهد ---------- */
function girl(x,y,s,c,cls=''){
  const [coat,fur,hair,scarf]=c;
  return `<g transform="translate(${x},${y}) scale(${s})" class="${cls}"><g class="bob">
  <rect x="-13" y="-16" width="11" height="16" rx="4" fill="#4a2f1d"/><rect x="2" y="-16" width="11" height="16" rx="4" fill="#4a2f1d"/>
  <path d="M-17-80Q-22-60-13-56L-9-80Z M17-80Q22-60 13-56L9-80Z" fill="${hair}"/>
  <g class="arm l"><rect x="-27" y="-62" width="9" height="30" rx="4.5" fill="${coat}"/><circle cx="-22.5" cy="-31" r="5" fill="#e0b48a"/></g>
  <g class="arm r"><rect x="18" y="-62" width="9" height="30" rx="4.5" fill="${coat}"/><circle cx="22.5" cy="-31" r="5" fill="#e0b48a"/></g>
  <path class="coat" d="M-21-18L-15-62Q0-70 15-62L21-18Z" fill="${coat}"/>
  <path d="M0-60V-20" stroke="#0003" stroke-width="2"/>
  <ellipse cx="0" cy="-18" rx="24" ry="7" fill="${fur}"/><ellipse cx="-11" cy="-40" rx="3" ry="3" fill="${fur}"/>
  <rect x="-6" y="-72" width="12" height="10" fill="#e0b48a"/>
  <ellipse cx="0" cy="-63" rx="17" ry="7" fill="${scarf}"/><ellipse cx="0" cy="-60" rx="14" ry="5" fill="${fur}"/>
  <circle cx="0" cy="-84" r="15" fill="#efc9a0"/>
  <path d="M-16-84Q-17-103 0-103Q17-103 16-84Q10-95 0-95Q-10-95-16-84Z" fill="${hair}"/>
  <circle cx="-5" cy="-83" r="1.9" fill="#2a1a14"/><circle cx="5" cy="-83" r="1.9" fill="#2a1a14"/>
  <path d="M-4-77Q0-73 4-77" stroke="#a5442c" stroke-width="1.6" fill="none"/><circle cx="-9" cy="-78" r="2.5" fill="#f0a08a" opacity=".6"/><circle cx="9" cy="-78" r="2.5" fill="#f0a08a" opacity=".6"/>
  </g></g>`;
}
function tent(i,x){const y=362;return `<g class="tent" id="t${i}" data-i="${i}" transform="translate(${x},${y})">
 <ellipse cx="0" cy="4" rx="82" ry="10" fill="#000" opacity=".3"/>
 <polygon points="-68,0 0,-100 68,0" fill="url(#tg)" stroke="#2b1b10" stroke-width="2"/>
 <polygon points="-68,0 0,-100 -24,0" fill="#000" opacity=".12"/>
 <polygon class="wm" points="-68,0 0,-100 68,0" fill="url(#gw)"/>
 <polygon class="in" points="-26,0 0,-64 26,0" fill="#ffb347"/>
 <polygon class="fl l" points="-26,0 0,-64 0,0" fill="#6b3d1f"/><polygon class="fl r" points="26,0 0,-64 0,0" fill="#7d4a26"/>
 <path d="M-68 0L-92 8M68 0L92 8" stroke="#c9a15b" stroke-width="2"/>
 <g class="bd"><circle cx="0" cy="-116" r="16" fill="#e8b84b" stroke="#fff3c4" stroke-width="2"/>
 <text x="0" y="-109" text-anchor="middle" font-size="20" font-weight="800" fill="#3b2410">${A(i+1)}</text></g>
 <text class="ck" x="0" y="-40" text-anchor="middle" font-size="30" fill="#3d7a2c">✓</text></g>`}
function lantern(x,y){return `<g transform="translate(${x},${y})"><circle r="26" fill="url(#gw2)" class="fg"/><path d="M-5-14Q0-22 5-14" stroke="#c9783a" stroke-width="2" fill="none"/><rect x="-7" y="-14" width="14" height="4" fill="#c9783a"/><rect x="-6" y="-10" width="12" height="16" rx="3" fill="#ffc94d" stroke="#c9783a" stroke-width="2"/><rect x="-7" y="6" width="14" height="3" fill="#c9783a"/></g>`}
const C=[['#d9b48a','#f3e6cf','#2a1a14','#9c5a3c'],['#b98a5e','#f6ead4','#4b2e1c','#c79a62'],['#e8d3b0','#fff7e6','#2a1a14','#7a4b2e'],['#a97c50','#efe0c6','#3a2416','#d8b98a']];
let st='';for(let i=0;i<90;i++)st+=`<circle class="tw" cx="${Math.random()*800|0}" cy="${Math.random()*230|0}" r="${(Math.random()*1.3+.4).toFixed(1)}" fill="#fff" style="animation-delay:${(Math.random()*3).toFixed(1)}s"/>`;
$('#scene').innerHTML=`<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050b24"/><stop offset=".65" stop-color="#16264f"/><stop offset="1" stop-color="#4a3f5a"/></linearGradient>
<linearGradient id="sd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a7448"/><stop offset="1" stop-color="#4a3220"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecd0a0"/><stop offset="1" stop-color="#a8743e"/></linearGradient>
<radialGradient id="gw"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<radialGradient id="gw2"><stop offset="0" stop-color="#ffc94d" stop-opacity=".8"/><stop offset="1" stop-color="#ffc94d" stop-opacity="0"/></radialGradient>
<radialGradient id="fg"><stop offset="0" stop-color="#ff9a3c" stop-opacity=".75"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
</defs>
<rect width="800" height="500" fill="url(#sky)"/>${st}
<circle cx="640" cy="70" r="46" fill="#ffe9a8" opacity=".12"/><path d="M640 38A32 32 0 1 0 662 98A26 26 0 1 1 640 38Z" fill="#ffeab0"/>
<g class="cl" opacity=".25"><ellipse cx="150" cy="90" rx="70" ry="12" fill="#9fb0d8"/><ellipse cx="210" cy="82" rx="40" ry="10" fill="#9fb0d8"/><ellipse cx="450" cy="140" rx="80" ry="10" fill="#9fb0d8"/></g>
<path d="M0 330Q150 285 300 322T600 312T800 300V500H0Z" fill="#3c3148"/>
<path d="M0 372Q200 335 400 368T800 355V500H0Z" fill="url(#sd)"/>
${TX.map((x,i)=>tent(i,x)).join('')}
<circle cx="400" cy="420" r="230" fill="url(#fg)" class="fg"/>

<g id="walker">${girl(0,0,.85,C[3])}</g></g>`;

/* ---------- الصوت ---------- */
let AC,MG,NB,muted=false;
function ac(){
  if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=muted?0:1;MG.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;ambient();}
  if(AC.state==='suspended')AC.resume();
}
function tone(f,d,ty='sine',v=.15,t0=0){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.05)}
function nz(d,f,v,ty='bandpass',t0=0){if(!AC)return;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime+t0;s.buffer=NB;fl.type=ty;fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(MG);s.start(t,Math.random(),d+.05)}
function ambient(){
  const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;s.loop=true;fl.type='lowpass';fl.frequency.value=380;g.gain.value=.04;s.connect(fl);fl.connect(g);g.connect(MG);s.start();
  setInterval(()=>g.gain.linearRampToValueAtTime(.015+Math.random()*.05,AC.currentTime+2.5),2500);
  setInterval(()=>{if(Math.random()<.65)nz(.03+Math.random()*.04,2200+Math.random()*3500,.1*Math.random()+.02)},170);
}
const sfx={
  click:()=>tone(660,.09,'triangle',.1),
  open:()=>{nz(.6,700,.3);tone(220,.5,'triangle',.08);tone(330,.5,'triangle',.06,.1)},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.5,'triangle',.14,i*.12));for(let i=0;i<8;i++)nz(.08,1800,.15,'bandpass',.5+i*.09)},
  end:()=>{[880,880,880].forEach((f,i)=>tone(f,.45,'sine',.14,i*.5))}
};
$('#mute').onclick=()=>{ac();muted=!muted;MG.gain.value=muted?0:1;$('#mute').textContent=muted?'🔇 مكتوم':'🔊 الصوت'};

/* ---------- المنطق ---------- */
let cur=-1,done=new Set(),pick=null,t=60,run=false,last=0,iv,revealed=false;
const cam=$('#cam'),tentEl=i=>$('#t'+i);
function star(n=30){for(let i=0;i<n;i++){const e=document.createElement('div');e.className='star';e.textContent='✦';e.style.cssText=`left:${Math.random()*100}vw;font-size:${12+Math.random()*22}px;animation-duration:${2.5+Math.random()*3}s;animation-delay:${Math.random()*1.2}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),7500)}}
function cheer(ms=4500){$('#scene').classList.add('cheering');setTimeout(()=>$('#scene').classList.remove('cheering'),ms)}
function refresh(){
  const nx=[0,1,2,3].find(i=>!done.has(i));
  [0,1,2,3].forEach(i=>{const e=tentEl(i);e.classList.toggle('done',done.has(i));e.classList.toggle('next',i===nx);e.classList.remove('open')});
  $('#prog').textContent=`الخيام المكشوفة: ${A(done.size)} من ${A(4)}`;
   document.querySelectorAll('#tent-nav button').forEach((b,i)=>b.classList.toggle('done',done.has(i)));
}
function camp(){
  $('#card').classList.add('hide');stopT();
   $('#tent-nav').classList.remove('hide');
  cam.style.transformOrigin='50% 80%';cam.style.transform='scale(1)';
  $('#host').style.transform='translateX(0)';$('#walker').style.opacity=0;
  refresh();$('#bar').classList.remove('hide');$('#hint').classList.remove('hide');cur=-1;
}
$('#go').onclick=()=>{ac();sfx.click();
  const iv=$('#intro');iv.style.opacity=0;setTimeout(()=>iv.classList.add('hide'),800);
  cam.classList.remove('intro');cam.style.transform='scale(1.3)';
  requestAnimationFrame(()=>requestAnimationFrame(()=>cam.style.transform='scale(1)'));
  setTimeout(camp,900)};
$('#scene').addEventListener('click',e=>{const g=e.target.closest?.('.tent');if(g&&cur<0&&!$('#bar').classList.contains('hide'))openTent(+g.dataset.i)});
document.querySelectorAll('#tent-nav button').forEach(b=>b.addEventListener('click',()=>{if(cur<0)openTent(Number(b.dataset.tent))}));
function openTent(i){
  ac();cur=i;sfx.open();$('#hint').classList.add('hide');$('#tent-nav').classList.add('hide');
  const x=TX[i];tentEl(i).classList.add('open');
  cam.style.transformOrigin=`${x/8}% 70%`;cam.style.transform='scale(1.55)';
  $('#host').style.transform=`translateX(${Math.max(0,x-90)}px)`;
  const w=$('#walker');w.style.transition='none';w.style.transform=`translate(${x}px,362px)`;w.style.opacity=1;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{w.style.transition='transform .9s ease,opacity .3s';w.style.transform=`translate(${x+(x<400?70:-70)}px,470px)`}));
  setTimeout(()=>showQ(i),1100);
}
function showQ(i){
  const q=Q[i];pick=null;revealed=false;
  $('#qt').textContent=q.t;$('#qs').innerHTML=F(q.s);
  $('#fa').innerHTML=F(tk(q.a));$('#fb').innerHTML=F(tk(q.b));
  $('#slot').textContent='؟';
  document.querySelectorAll('.sgn').forEach(b=>{b.classList.remove('on');b.disabled=false});
  $('#sol').classList.add('hide');$('#sol').innerHTML='';
  $('#rev').classList.remove('hide');$('#nxt').classList.add('hide');
  resetT();$('#card').classList.remove('hide');$('#bar').classList.add('hide');
}
document.querySelectorAll('.sgn').forEach(b=>b.onclick=()=>{ac();sfx.click();if(revealed)return;
  pick=b.dataset.s;document.querySelectorAll('.sgn').forEach(x=>x.classList.toggle('on',x===b));$('#slot').textContent=pick});
$('#rev').onclick=()=>{ac();const q=Q[cur];revealed=true;stopT();sfx.win();star(28);cheer();document.body.classList.add('lit');
  $('#rev').classList.add('hide');
  const sol=$('#sol');sol.classList.remove('hide');
  sol.innerHTML=`<div class="ans">الإجابة الصحيحة: ${F(tk(q.a))} ${NAMES[q.ans]} ${F(tk(q.b))}</div>`+q.st.map((s,k)=>`<div class="st" style="animation-delay:${.5+k*1.1}s">${F(s)}</div>`).join('');
  $('#slot').textContent=q.ans;document.querySelectorAll('.sgn').forEach(x=>{x.classList.toggle('on',x.dataset.s===q.ans);x.disabled=true});
  done.add(cur);tentEl(cur).classList.add('done');
  const last=done.size===4;$('#nxt').textContent=last?'المشهد الختامي 🎆':'الخيمة التالية ⏭';
  setTimeout(()=>$('#nxt').classList.remove('hide'),500+q.st.length*1100);
  setTimeout(()=>document.body.classList.remove('lit'),5000);
};
$('#nxt').onclick=()=>{ac();sfx.click();
  const n=[0,1,2,3].find(i=>!done.has(i));
  if(n===undefined){finale();return}
  $('#card').classList.add('hide');tentEl(cur).classList.remove('open');
  cam.style.transform='scale(1)';setTimeout(()=>openTent(n),1000)};
$('#back').onclick=()=>{ac();sfx.click();camp()};
/* المؤقت */
function paint(){$('#sec').textContent=A(Math.ceil(t));$('#sec').classList.toggle('end',t<=0);
  const h=42*Math.max(0,t)/60;$('#lr').setAttribute('y',20+42-h);$('#lr').setAttribute('height',h)}
function stopT(){run=false;clearInterval(iv);$('#tgl').textContent='▶ ابدأ'}
function resetT(){stopT();t=60;paint()}
$('#tgl').onclick=()=>{ac();sfx.click();if(run){stopT();return}
  if(t<=0)t=60;run=true;last=performance.now();$('#tgl').textContent='⏸ إيقاف';
  iv=setInterval(()=>{const n=performance.now();t-=(n-last)/1000;last=n;
    if(t<=0){t=0;stopT();sfx.end()}paint()},100)};
$('#rst').onclick=()=>{ac();sfx.click();resetT()};
/* الختام */
function finale(){
  $('#card').classList.add('hide');tentEl(cur).classList.remove('open');
  cam.style.transformOrigin='50% 80%';cam.style.transform='scale(1.25)';
  document.body.classList.add('lit');$('#walker').style.opacity=0;
  const f=$('#fin');f.classList.remove('hide');f.style.opacity=0;requestAnimationFrame(()=>f.style.opacity=1);
  [0,1,2,3].forEach(i=>tentEl(i).classList.add('done'));
  cheer(30000);sfx.win();star(40);setTimeout(()=>{sfx.win();star(40)},3500);setTimeout(()=>{sfx.win();star(40)},7000);
}
$('#again').onclick=()=>{ac();sfx.click();$('#fin').classList.add('hide');document.body.classList.remove('lit');
  $('#scene').classList.remove('cheering');done.clear();camp()};
paint();
</script>
