@import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap');:root{--ink:#292345;--purple:#6f4db4;--light:#f8f4ff;--gold:#e9ae48}*{box-sizing:border-box}body{margin:0;font-family:Alexandria,Tahoma,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 5%,#e6d6ff,transparent 40%),radial-gradient(circle at 95% 40%,#d5f6f2,transparent 35%),#f9f7ff;min-height:100vh}header{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;background:#ffffffa8;backdrop-filter:blur(14px);border-bottom:1px solid #e7dff5}.brand{font-weight:800;color:#5e3f9c}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:15px;padding:12px 16px;background:#704bb2;color:white;font-weight:700}button:disabled{opacity:.5;cursor:not-allowed}.ghost{background:#fff;color:#62459c;border:1px solid #d8c9ef}.shell{max-width:1100px;margin:auto;padding:25px 16px 65px}.hero{text-align:center;padding:28px 15px}.hero h1{font-size:clamp(26px,5vw,45px);margin:8px}.hero p{line-height:2}.gem{font-size:65px;filter:drop-shadow(0 7px 12px #8a63b555)}.card{background:#fffffff0;border:1px solid #e8e0f6;border-radius:24px;padding:22px;box-shadow:0 14px 40px #58448714;margin:15px 0}.hidden{display:none!important}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}.muted{color:#746e85;line-height:1.9}.step{display:inline-block;background:#f0e7ff;border-radius:99px;padding:7px 13px;color:#65449d;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.palace{border-radius:20px;padding:22px;background:linear-gradient(135deg,#f4e9ff,#fff);text-align:center;border:2px solid #e5d7f8}.palace:nth-child(2){background:linear-gradient(135deg,#e3fff3,#fff)}.palace:nth-child(3){background:linear-gradient(135deg,#e2f4ff,#fff)}.palace:nth-child(4){background:linear-gradient(135deg,#fff3d9,#fff)}.palace .art{font-size:53px}.placegrid{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:8px;overflow-x:auto}.group{border-radius:15px;padding:12px;text-align:center;background:#f3eaff}.group:nth-child(2){background:#e5f3ff}.group:nth-child(3){background:#e4f8ef}.group:nth-child(4){background:#fff0d9}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}.slot{background:#fff;border-radius:10px;padding:12px 5px;min-height:78px;border:1px solid #ffffff}.slot b{font-size:19px;display:block;margin-top:7px}.slot small{font-size:10px;line-height:1.5;display:block}.num{font-size:clamp(26px,6vw,48px);font-weight:800;color:#5c3c9a;text-align:center;direction:ltr}.choices{display:grid;gap:10px;margin-top:16px}.choice{text-align:right;background:#f6f2ff;color:#32254e;border:2px solid #e8ddfb;line-height:1.8}.choice:hover,.choice:focus{border-color:#7754b9;background:#efe5ff}.feedback{padding:15px;border-radius:15px;background:#e8f9ef;line-height:2;margin-top:12px}.bad{background:#fff0ed}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.stat{background:#f2ebff;border-radius:13px;padding:12px}.progress{height:12px;background:#eee7f6;border-radius:99px;overflow:hidden;margin:14px 0}.progress div{height:100%;background:linear-gradient(90deg,#6c4db3,#d6a34d);transition:width .3s}.input{width:100%;padding:13px;border:1px solid #d9cde8;border-radius:12px;margin:6px 0 14px;background:white}.certificate{text-align:center;background:linear-gradient(140deg,#fff9e7,#fff,#f0e9ff);border:7px double #d9b25f;padding:32px 12px;border-radius:16px}.certificate h2{color:#6946a3}footer{text-align:center;color:#827890;font-size:12px;padding:20px}@media(max-width:700px){.placegrid{grid-template-columns:repeat(4,190px);padding-bottom:8px}.card{padding:15px}.shell{padding:12px}header{font-size:12px}}

</style></head><body><header><span class="brand">💎 جوهرة ماث | مملكة الأعداد</span><button class="ghost no-print" id="sound" onclick="toggleSound()">🔊 الصوت</button></header><main class="shell"><section id="welcome" class="hero"><div class="gem">💎🏰</div><h1>مملكة الأعداد وأسرار الجوهرة</h1><p>لكل رقم مكان، ولكل منزلة قيمة، ولكل جوهرة سر ينتظر اكتشافك!</p><div class="card" style="max-width:540px;margin:auto;text-align:right"><label>اسم البطلة</label><input class="input" id="student" maxlength="65" placeholder="اكتبي اسمك هنا"><label>الصف والفصل</label><select class="input" id="class"><option value="خامس أ">خامس أ</option><option value="خامس ب">خامس ب</option><option value="سادس أ">سادس أ</option></select><p class="muted">تبدأ رحلتك باختبار قبلي، ثم تتعلمين المنازل الـ١٢ وتكتشفين أسرار القراءة والقيمة المنزلية قبل اختبار الإتقان.</p><div class="actions"><button onclick="start()">ابدئي المغامرة ✨</button></div></div></section><section id="game" class="hidden"><div class="stats"><span class="stat" id="stageLabel"></span><span class="stat" id="scoreLabel"></span></div><div class="progress"><div id="bar" style="width:0"></div></div><div id="content"></div></section></main><footer>المعلمة/ جواهر السبيعي • جوهرة ماث 💜</footer><script>
const $=id=>document.getElementById(id),D='٠١٢٣٤٥٦٧٨٩',fmt=n=>String(n).replace(/\d/g,d=>D[+d]),comm=n=>fmt(Number(n).toLocaleString('en-US')),groups=['الآحاد','الآلاف','الملايين','المليارات'],units=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'],fem=['','إحدى','اثنتا','ثلاث','أربع','خمس','ست','سبع','ثماني','تسع'],tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'],hundreds=['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'],placeNames=['الآحاد','العشرات','المئات','آحاد الألوف','عشرات الألوف','مئات الألوف','آحاد الملايين','عشرات الملايين','مئات الملايين','آحاد المليارات','عشرات المليارات','مئات المليارات'];let state={name:'',cl:'',phase:'pre',index:0,score:0,pre:0,post:0,questions:[],palace:0,lesson:0,sound:true,attempt:0,missed:[],completed:[],practiceCount:0};
function speak(){if(!state.sound)return;try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(600,c.currentTime);o.frequency.exponentialRampToValueAtTime(900,c.currentTime+.13);g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.2)}catch(e){}}function toggleSound(){state.sound=!state.sound;$('sound').textContent=state.sound?'🔊 الصوت':'🔇 صامت'}function pick(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function nword(n){n=Number(n);if(!n)return '';if(n<10)return units[n];if(n===10)return 'عشرة';if(n===11)return 'أحد عشر';if(n===12)return 'اثنا عشر';if(n<20)return fem[n-10]+' عشر';if(n<100)return (n%10?units[n%10]+' و':'')+tens[Math.floor(n/10)];return (hundreds[Math.floor(n/100)]+(n%100?' و'+nword(n%100):''))}function chunkWord(n,k){if(!n)return '';if(k===0)return nword(n);let forms=[[],['ألف','ألفان','آلاف','ألفًا'],['مليون','مليونان','ملايين','مليونًا'],['مليار','ملياران','مليارات','مليارًا']][k];if(n===1)return forms[0];if(n===2)return forms[1];if(n>=3&&n<=10)return nword(n)+' '+forms[2];if(n>=11&&n<=99)return nword(n)+' '+forms[3];return nword(n)+' '+forms[0]}function words(n){n=Number(n);if(n===0)return 'صفر';let a=[];for(let i=3;i>=0;i--){let c=Math.floor(n/1000**i)%1000;if(c)a.push(chunkWord(c,i))}return a.join(' و')}function expanded(n){let a=String(n).split('').reverse().map((d,i)=>Number(d)*10**i).filter(Boolean).reverse();return a.map(comm).join(' + ')}function markDigit(n,pos){let a=comm(n).split(''),idx=a.length-1-pos-Math.floor(pos/3);if(idx>=0&&idx<a.length)a[idx]='【'+a[idx]+'】';return a.join('')}function qGen(level,skill){let max=[999,999999,999999999,999999999999][level],min=[1,1000,1000000,1000000000][level];let n=Math.floor(min+Math.random()*(max-min+1));if(skill==='place'){let pos=Math.floor(Math.random()*(level*3+3)),d;for(let tries=0;tries<1000;tries++){n=Math.floor(min+Math.random()*(max-min+1));d=Math.floor(n/10**pos)%10;if(d!==0&&String(n).split(String(d)).length===2)break;}if(!d||String(n).split(String(d)).length!==2){n=10**pos*7;d=7;}return{question:`ما منزلة الرقم المحاط بالقوسين 【 】 في العدد ${markDigit(n,pos)}؟`,answer:placeNames[pos],wrong:shuffle(placeNames.filter(x=>x!==placeNames[pos])).slice(0,2),explain:`الرقم المحدد ${fmt(d)} يقع في منزلة ${placeNames[pos]}، وقيمته ${comm(d*10**pos)}.`}}if(skill==='value'){let pos=Math.floor(Math.random()*(level*3+3)),d;for(let tries=0;tries<1000;tries++){n=Math.floor(min+Math.random()*(max-min+1));d=Math.floor(n/10**pos)%10;if(d!==0&&String(n).split(String(d)).length===2)break;}if(!d||String(n).split(String(d)).length!==2){n=10**pos*7;d=7;}let val=d*10**pos;return{question:`ما قيمة الرقم المحاط بالقوسين 【 】 في العدد ${markDigit(n,pos)}؟`,answer:comm(val),wrong:shuffle([comm(d),comm(d*10**Math.min(11,pos+1)),comm(d*10**Math.max(0,pos-1)),comm(val+10**pos)].filter(x=>x!==comm(val))).slice(0,2),explain:`الرقم المحدد ${fmt(d)} يقع في منزلة ${placeNames[pos]}، ولذلك قيمته ${comm(val)}.`}}if(skill==='expanded'){let a=expanded(n);return{question:`ما الصيغة التحليلية للعدد ${comm(n)}؟`,answer:a,wrong:[expanded(n+10**Math.min(3,level*3)),expanded(n+100),expanded(n+1)].filter(x=>x!==a).slice(0,2),explain:`نفكك كل رقم غير صفري بحسب قيمته المنزلية: ${a}.`}}if(skill==='standard'){return{question:`اختاري الصيغة القياسية للعدد: ${words(n)}`,answer:comm(n),wrong:shuffle([comm(n+10**Math.min(level*3,9)),comm(n+100),comm(n+1)].filter(x=>x!==comm(n))).slice(0,2),explain:`نكتب كل مجموعة في موضعها، مع المحافظة على الأصفار: ${comm(n)}.`}}return{question:`كيف نقرأ العدد ${comm(n)}؟`,answer:words(n),wrong:shuffle([words(n+1000**Math.max(0,level-1)),words(n+10**Math.min(11,level*3+1)),words(n+100)] .filter(x=>x!==words(n))).slice(0,2),explain:`نقسم العدد إلى مجموعات من ثلاث خانات ونقرأ من المجموعة الأكبر إلى الأصغر: ${words(n)}.`}}
function makeQuestions(count,level=null){let skills=['read','place','value','expanded','standard'];return Array.from({length:count},(_,i)=>{let q;for(let attempt=0;attempt<100;attempt++){q=qGen(level===null?Math.floor(i%4):level,skills[i%5]);if(new Set([q.answer,...q.wrong]).size===3&&q.wrong.length===2)break;}return q})}function start(){let name=$('student').value.trim();if(!name){alert('اكتبي اسمك أولًا يا بطلة');return}state.name=name;state.cl=$('class').value;$('welcome').classList.add('hidden');$('game').classList.remove('hidden');beginTest('pre')}function stage(t,s,p){$('stageLabel').textContent=t;$('scoreLabel').textContent=s;$('bar').style.width=p+'%'}function show(html){$('content').innerHTML=html;window.scrollTo({top:0,behavior:'smooth'})}function beginTest(which){state.phase=which;state.index=0;state.score=0;state.questions=makeQuestions(which==='pre'?10:20);state.missed=[];renderQuestion()}function renderQuestion(){let q=state.questions[state.index],total=state.questions.length;stage(state.phase==='pre'?'📝 الاختبار القبلي':'🏆 اختبار الإتقان',`السؤال ${fmt(state.index+1)} من ${fmt(total)} | الصحيح ${fmt(state.score)}`,100*state.index/total);let choices=shuffle([q.answer,...q.wrong]);show(`<div class="card"><span class="step">اختاري إجابة واحدة • تُحسب المحاولة الأولى</span><h2 style="line-height:2">${q.question}</h2><div class="choices">${choices.map((c,i)=>`<button class="choice" onclick="answerTest(${i})">${fmt(i+1)}. ${c}</button>`).join('')}</div><div id="feedback"></div></div>`);state.currentChoices=choices}function answerTest(i){let q=state.questions[state.index],ok=state.currentChoices[i]===q.answer;if(ok){state.score++;speak()}else state.missed.push(q);document.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}">${ok?'🌟 إجابة صحيحة!':'💡 فرصة للتعلم!'}<div>${q.explain}</div></div><div class="actions"><button onclick="nextTest()">${state.index===state.questions.length-1?'عرض النتيجة':'السؤال التالي ←'}</button></div>`}function nextTest(){state.index++;if(state.index<state.questions.length)return renderQuestion();if(state.phase==='pre'){state.pre=state.score;show(`<div class="card" style="text-align:center"><div class="gem">🌟</div><h2>أحسنتِ يا ${state.name}!</h2><p>نتيجتك القبلية: ${fmt(state.pre)} من ١٠</p><p class="muted">هذه بداية الرحلة وليست حكمًا على مستواك. الآن سنكتشف أسرار المنازل معًا.</p><button onclick="startPalaces()">ادخلي المملكة 🏰</button></div>`)}else{state.post=state.score;showResult()}}function startPalaces(){state.phase='learn';state.palace=0;state.lesson=0;palaceHome()}function palaceHome(){stage('🏰 رحلة القصور',`القصر ${fmt(state.palace+1)} من ٤`,25*state.palace);show(`<div class="card" style="text-align:center"><div class="gem">${['🏠','🌿','💠','👑'][state.palace]}</div><h2>${['قصر الآحاد الذهبي','قصر الآلاف الزمردي','قصر الملايين الياقوتي','قصر المليارات الملكي'][state.palace]}</h2><p class="muted">ستكتشفين المنازل الثلاث، ثم تتدربين على القراءة والقيمة المنزلية والصيغ المختلفة.</p><div class="grid">${[0,1,2].map(i=>`<div class="palace">💎<h3>${placeNames[state.palace*3+i]}</h3><p>قيمتها الأساسية: ${comm(10**(state.palace*3+i))}</p></div>`).join('')}</div><div class="actions"><button onclick="renderLesson()">اكتشفي الأسرار ✨</button></div></div>`)}function table(n){let digits=String(n).padStart(12,'0').split('');return `<div class="placegrid">${[3,2,1,0].map(g=>`<div class="group"><strong>${groups[g]}</strong><div class="slots">${[2,1,0].map(j=>`<div class="slot"><small>${placeNames[g*3+j]}</small><b>${fmt(digits[11-(g*3+j)])}</b></div>`).join('')}</div></div>`).join('')}</div>`}function renderLesson(){let g=state.palace,ex=[305,24050,60205007,406020500090][g],names=placeNames.slice(g*3,g*3+3),vals=[0,1,2].map(i=>comm(7*10**(g*3+i)));stage('📚 اكتشفي وتعلمي',`${groups[g]} • شرح تفاعلي`,25*g+5);show(`<div class="card"><span class="step">السر الأول: كل مجموعة تضم ثلاث منازل</span><h2>جدول المنازل العددية</h2><p class="muted">شاهدي الرقم في مكانه. نقرأ العدد من المجموعة الأكبر إلى الأصغر، لكن نحدد المنازل بدءًا من اليمين.</p>${table(ex)}<h3>مثال: ${comm(ex)}</h3><p class="muted">قراءته: <strong>${words(ex)}</strong></p><div class="card"><h3>🛗 مصعد الرقم ٧</h3><p>لاحظي كيف تتغير قيمة الرقم نفسه:</p><div class="grid">${names.map((name,i)=>`<div class="palace"><strong>${name}</strong><div class="num">${vals[i]}</div></div>`).join('')}</div><p class="muted">كل خطوة إلى اليسار تضرب القيمة في ١٠. والرقم نفسه لا يتغير!</p></div><div class="card"><h3>🔍 سر الأصفار</h3><p class="muted">الصفر يحفظ مكان المنزلة. قد لا ننطق مجموعة كلها أصفار، لكن لا نحذفها عند كتابة العدد. انظري إلى الخانات الملونة في الجدول.</p></div><div class="card"><h3>🧩 الصيغة التحليلية</h3><p class="muted">${comm(ex)} = ${expanded(ex)}</p><p class="muted">كل جزء يمثل القيمة المنزلية لرقم غير صفري.</p></div><div class="actions"><button onclick="beginPractice()">تدرّبي على أسرار القصر 🎮</button></div></div>`)}function beginPractice(){state.phase='practice';state.index=0;state.score=0;state.attempt=0;state.questions=makeQuestions(12,state.palace);renderPractice()}function renderPractice(){let q=state.questions[state.index];stage('🎮 تدريب القصر',`${fmt(state.index+1)} من ١٢ • بلا درجات عقابية`,25*state.palace+20*(state.index/12));let choices=shuffle([q.answer,...q.wrong]);state.currentChoices=choices;show(`<div class="card"><span class="step">جرّبي بحرية • عند الخطأ يظهر الشرح ثم يمكنك المحاولة من جديد</span><h2 style="line-height:2">${q.question}</h2><div class="choices">${choices.map((c,i)=>`<button class="choice" onclick="answerPractice(${i})">${fmt(i+1)}. ${c}</button>`).join('')}</div><div id="feedback"></div><div class="actions"><button class="ghost" onclick="renderLesson()">📚 أعيدي الشرح</button></div></div>`)}function answerPractice(i){let q=state.questions[state.index],ok=state.currentChoices[i]===q.answer;if(ok){speak();document.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('feedback').innerHTML=`<div class="feedback">🌟 ممتاز! ${q.explain}</div><div class="actions"><button onclick="nextPractice()">التالي ←</button></div>`}else{$('feedback').innerHTML=`<div class="feedback bad">💡 ${q.explain}<p>الآن اختاري الإجابة الصحيحة بنفسك.</p></div>`}}function nextPractice(){state.index++;if(state.index<state.questions.length)return renderPractice();state.completed.push(state.palace);show(`<div class="card" style="text-align:center"><div class="gem">💎</div><h2>استعدتِ جواهر ${groups[state.palace]}!</h2><p class="muted">أكملتِ ١٢ تدريبًا. تابعي إلى القصر التالي لتكتشفي المزيد.</p><button onclick="advancePalace()">${state.palace===3?'الانتقال لاختبار الإتقان 🏆':'القصر التالي ←'}</button></div>`)}function advancePalace(){if(state.palace<3){state.palace++;palaceHome()}else beginTest('post')}function showResult(){let ok=state.post>=18;stage('🏆 نتيجة رحلة الإتقان',`${fmt(state.post)} من ٢٠`,100);show(`<div class="card" style="text-align:center"><div class="gem">${ok?'👑💎':'🌷📚'}</div><h2>${ok?'أنتِ خبيرة الأعداد!':'أنتِ تتقدمين يا بطلة!'}</h2><p>الاختبار القبلي: <b>${fmt(state.pre)} / ١٠</b> • الاختبار البعدي: <b>${fmt(state.post)} / ٢٠</b></p><p class="muted">النسبة القبلية ${fmt(state.pre*10)}٪، والنسبة البعدية ${fmt(state.post*5)}٪.</p>${ok?`<button onclick="certificate()">افتحي شهادة الإتقان 🎓</button>`:`<p class="muted">راجعي المنازل والتدريبات ثم أعيدي اختبار الإتقان بأسئلة جديدة. معيار الإتقان ٩٠٪.</p><div class="actions"><button onclick="startPalaces()">أعيدي التدريب 📚</button><button class="ghost" onclick="beginTest('post')">أعيدي الاختبار</button></div>`}</div>`)}function certificate(){stage('🎓 شهادة الإتقان','مبروك!',100);show(`<div class="card"><div class="certificate"><div class="gem">👑💎</div><h2>شهادة خبيرة قراءة الأعداد</h2><p>تُمنح هذه الشهادة للطالبة</p><h2>${escapeHtml(state.name)}</h2><p>${escapeHtml(state.cl)}</p><p>لإتقانها قراءة الأعداد والقيمة المنزلية والصيغ العددية حتى مئات المليارات</p><h3>الاختبار البعدي: ${fmt(state.post)} من ٢٠</h3><p>المعلمة/ جواهر السبيعي</p><p>بوابة جوهرة ماث</p></div><div class="actions no-print"><button onclick="window.print()">🖨️ احفظي الشهادة أو اطبعيها</button><button class="ghost" onclick="startPalaces()">إعادة الاستكشاف</button></div><p class="muted no-print" style="text-align:center">يمكنك تصوير الشهادة وإرسالها للمعلمة. لا تُرسل بياناتك تلقائيًا إلى أي لوحة.</p></div>`)}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
