<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اعتماد نتائج ما وراء الفاصلة</title><style>body{margin:0;background:#0b1b2c;color:#fff;font:16px system-ui}main{max-width:850px;margin:auto;padding:18px}article{background:#17364c;padding:16px;margin:12px 0;border-radius:15px}button{border:0;border-radius:9px;padding:12px;margin:5px;background:#e9c982;color:#182b37;font-weight:bold}button:disabled{opacity:.5}h1{color:#e9c982}small{color:#b9d5e4}a{color:#e9c982}</style><main><h1>💎 نتائج ما وراء الفاصلة الواردة</h1><p>النتائج تصل تلقائيًا هنا. راجعي اسم الطالبة والفصل ثم اعتمدي النتيجة لتظهر في قياس الأثر. الاسم وحده لا يثبت هوية الطالبة.</p><p><a href="jm-impact.html?v=3">📊 قياس الأثر</a> | <a href="jm-manage.html">لوحة المعلمة</a></p><div id="state">جارٍ التحقق...</div><div id="list"></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const db=createClient('https://ylsnogtohohmzlxpihks.supabase.co','sb_publishable_FZfSp2WWqILRcKPDo-mgxQ_zlDe6l_q');const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const labels={a:'جمع الكسور العشرية',s:'طرح الكسور العشرية',m:'ضرب الكسور العشرية',d:'قسمة الكسور العشرية'};let user,students=[],classes=[],program;async function load(){try{const auth=await db.auth.getUser();user=auth.data.user;if(!user)throw Error('سجّلي الدخول من صفحة المعلمة أولًا');const role=await db.from('jm_teacher_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!role.data||role.error)throw Error('غير مصرح لكِ');const a=await Promise.all([db.from('jm_students').select('id,full_name,class_id'),db.from('jm_classes').select('id,name'),db.from('jm_programs').select('id,title,url').ilike('url','%ma-waraa-al-fasila.html%').limit(1)]);for(const x of a)if(x.error)throw x.error;students=a[0].data;classes=a[1].data;program=a[2].data[0];if(!program)throw Error('البرنامج غير مسجل');await refresh()}catch(e){$('state').textContent=e.message;const a=document.createElement('a');a.href='jm-auth-check.html';a.textContent=' تسجيل الدخول';$('state').append(a)}}async function refresh(){const{data,error}=await db.from('jm_decimal_submissions').select('*').eq('status','pending').order('created_at',{ascending:false}).limit(100);if(error)throw error;$('state').textContent='النتائج بانتظار مراجعتكِ: '+data.length;$('list').innerHTML='';for(const x of data){const cls=classes.find(c=>c.name===x.class_name),matches=students.filter(s=>s.class_id===cls?.id&&s.full_name.trim()===x.student_name.trim());const valid=matches.length===1;const box=document.createElement('article');box.innerHTML='<h3>'+esc(x.student_name)+' — '+esc(x.class_name)+'</h3><small>وقت الإرسال: '+esc(new Date(x.created_at).toLocaleString('ar-SA'))+'</small><p>القبلي: '+Object.values(x.pre).reduce((a,b)=>a+b,0)+'/١٢ | البعدي: '+Object.values(x.post).reduce((a,b)=>a+b,0)+'/١٢</p><p>'+Object.keys(labels).map(t=>labels[t]+': '+x.pre[t]+'/٣ ← '+x.post[t]+'/٣').join(' | ')+'</p><p>'+ (valid?'الاسم مطابق لسجل الفصل. راجعي صحة النتيجة قبل الاعتماد.':'⚠️ الاسم غير مطابق أو مكرر في الفصل؛ لا يمكن اعتماده')+'</p>';const approve=document.createElement('button');approve.textContent='اعتماد النتيجة';approve.disabled=!valid;approve.onclick=()=>act(x,'approved',matches[0]?.id,box);const reject=document.createElement('button');reject.textContent='استبعاد';reject.onclick=()=>act(x,'rejected',null,box);box.append(approve,reject);$('list').append(box)}}async function act(x,status,studentId,box){if(!confirm(status==='approved'?'هل راجعتِ اسم الطالبة ودرجاتها وتريدين اعتمادها؟':'استبعاد هذه النتيجة؟'))return;const buttons=box.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{if(status==='approved'){const rows=Object.keys(labels).flatMap(t=>[{student_id:studentId,program_id:program.id,skill:'اختبار قبلي '+labels[t],score:x.pre[t],max_score:3,completed_at:x.created_at},{student_id:studentId,program_id:program.id,skill:'اختبار بعدي '+labels[t],score:x.post[t],max_score:3,completed_at:x.created_at}]);const result=await db.from('jm_activity_results').insert(rows);if(result.error)throw result.error}const result=await db.from('jm_decimal_submissions').update({status,reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq('id',x.id).eq('status','pending');if(result.error)throw result.error;await refresh()}catch(e){alert('تعذر الاعتماد: '+e.message);buttons.forEach(b=>b.disabled=false)}}load();</script></html>
