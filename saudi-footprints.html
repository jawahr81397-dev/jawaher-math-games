<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#075239">
<title>متاهة بصمة الوطن | جوهرة ماث</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#075239;--deep:#06432f;--gold:#c99a35;--ink:#25372f;--paper:#fffefa;--soft:#f8f5e9}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f4f1e6;color:var(--ink);font-family:Cairo,Arial,sans-serif}
button,input{font:inherit}
.page{max-width:1050px;margin:auto;background:var(--paper);border:5px double var(--gold);outline:1px solid #e9d7a5;outline-offset:-11px;padding:clamp(15px,3vw,28px);box-shadow:0 15px 45px #1d382018}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.flag{font-size:42px;line-height:1}
.brand{font-weight:800;color:var(--green);font-size:14px;text-decoration:none}
.brand:hover{text-decoration:underline}
.title{margin:0 auto;text-align:center;background:var(--green);color:#fff9df;border:3px double var(--gold);border-radius:13px;padding:10px 25px;font:800 clamp(22px,5vw,38px) Alexandria,Cairo,sans-serif;box-shadow:0 4px 0 #ddc27e}
.title-wrap{text-align:center;margin:10px 0 16px}
.subtitle{margin:0;color:var(--green);font-weight:800;font-size:clamp(15px,3vw,21px)}
.instruction{margin:6px 0 16px;color:#445b49;font-weight:700}
.frame{border:3px solid var(--green);padding:7px;border-radius:8px;background:#fdfcf6}
.maze-scroll{overflow-x:auto;padding:3px}
.maze{display:grid;direction:ltr;margin:auto;width:max-content;background:#fff;touch-action:manipulation}
.cell{width:clamp(29px,5.3vw,48px);height:clamp(29px,5.3vw,48px);display:grid;place-items:center;position:relative;background:white;border-color:var(--green);border-style:solid;border-width:0;font-size:clamp(9px,1.8vw,13px);font-weight:800;color:var(--green);line-height:1.1;text-align:center}
.cell[data-n="1"]{border-top-width:5px}.cell[data-e="1"]{border-right-width:5px}.cell[data-s="1"]{border-bottom-width:5px}.cell[data-w="1"]{border-left-width:5px}
.cell.token{background:#fff8dd;color:#845e10}
.token-label{max-width:100%;padding:1px 2px}
.player{position:absolute;width:21px;height:21px;border-radius:50%;background:var(--gold);border:3px solid white;box-shadow:0 1px 5px #0007;z-index:3;transition:all .12s}
.end-dot{font-size:17px;color:var(--green)}
.legend{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 2px;color:#536957;font-size:13px}
.collected{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;min-height:34px;margin:14px 0}
.chip{padding:5px 12px;border-radius:30px;background:#f2e8c8;border:1px solid #d8bc72;color:#5b4a20;font-weight:800}
.chip.done{background:#e7f1e5;border-color:#afc7a7;color:var(--green)}
.controls{display:grid;grid-template-columns:repeat(3,50px);justify-content:center;gap:6px;margin:12px auto}
.controls button{height:46px;border:1px solid #b79a4e;border-radius:12px;background:#fff9e8;color:var(--green);font-weight:900;font-size:20px;touch-action:manipulation}
.controls button:active{background:#e6d396}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:14px 0}
button.action{border:0;border-radius:11px;padding:10px 17px;background:var(--green);color:white;font-weight:800;cursor:pointer}
button.action.alt{background:#f5edda;color:var(--green);border:1px solid #d4bd7a}
.answerbox{border:2px solid var(--gold);border-radius:10px;padding:14px;background:#fffdf7;margin-top:12px}
.answerbox label{display:block;color:var(--green);font-weight:800;margin-bottom:7px}
.answerrow{display:flex;gap:8px}
.answerrow input{flex:1;min-width:0;border:1px solid #cfc7ae;border-radius:9px;padding:10px 12px}
.status{text-align:center;min-height:25px;margin:8px 0 0;color:var(--green);font-weight:800}
footer{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid #dbc98f;margin-top:15px;padding-top:10px;color:#596a5c;font-size:12px}
footer strong{color:var(--green)}
@media(max-width:480px){body{padding:6px}.page{padding:15px 10px;border-width:4px}.flag{font-size:32px}.answerrow{flex-direction:column}.answerrow button{align-self:center}footer{font-size:10px}}
@media print{body{padding:0;background:white}.page{box-shadow:none;max-width:none}.controls,.actions,.answerrow button,.brand{display:none!important}.maze-scroll{overflow:visible}.cell{width:38px;height:38px}.answerrow input{border:0;border-bottom:1px dotted #555;border-radius:0}}
</style>
</head>
<body>
<main class="page">
<header><a class="brand" href="index.html#schoolActivities">← الأنشطة المدرسية</a><div class="flag" aria-label="علم المملكة">🇸🇦</div></header>
<section class="title-wrap"><h1 class="title">متاهة بصمة الوطن</h1></section>
<p class="subtitle">اتبعي المسار الصحيح، واجمعي الكلمات بالترتيب، ثم اكتبي العبارة!</p>
<p class="instruction">ابدئي من نقطة البداية 🟡، وحرّكي القطعة بالأسهم حتى تصلي إلى الدرع 🛡️.</p>
<section class="frame"><div class="maze-scroll"><div id="maze" class="maze" aria-label="متاهة تفاعلية"></div></div></section>
<div class="legend"><span>🟡 البداية</span><span>اجمعي الكلمات الذهبية بالترتيب</span><span>🛡️ النهاية</span></div>
<div class="collected" id="collected" aria-live="polite"></div>
<div class="controls" aria-label="أزرار الحركة">
<span></span><button type="button" data-move="N" aria-label="تحركي للأعلى">↑</button><span></span>
<button type="button" data-move="W" aria-label="تحركي لليسار">←</button><button type="button" data-move="S" aria-label="تحركي للأسفل">↓</button><button type="button" data-move="E" aria-label="تحركي لليمين">→</button>
</div>
<div class="actions"><button class="action alt" id="restart" type="button">إعادة المتاهة</button><button class="action alt" id="print" type="button">طباعة النشاط</button></div>
<section class="answerbox"><label for="answer">العبارة التي اكتشفتها:</label><div class="answerrow"><input id="answer" placeholder="اكتبي العبارة بعد جمع الكلمات" autocomplete="off"><button class="action" id="check" type="button">تحققي من الإجابة</button></div><p class="status" id="status" aria-live="polite"></p></section>
<footer><span>نشاط وطني تفاعلي</span><strong>المعلمة/ جواهر السبيعي • جوهرة ماث</strong></footer>
</main>
<script>
const cols=13,rows=7,words=['بالعلم','والعمل','نبني','مستقبل','وطننا'];
const dirs={N:[0,-1,'S'],E:[1,0,'W'],S:[0,1,'N'],W:[-1,0,'E']};
let cells=[],solution=[],pos=0,got=new Set();
function generate(){
 cells=Array.from({length:rows},()=>Array.from({length:cols},()=>({N:1,E:1,S:1,W:1,seen:false})));
 const stack=[[0,0]];cells[0][0].seen=true;
 while(stack.length){const [x,y]=stack[stack.length-1],choices=[];
  for(const d of Object.keys(dirs)){const[nx,ny]=[x+dirs[d][0],y+dirs[d][1]];if(nx>=0&&ny>=0&&nx<cols&&ny<rows&&!cells[ny][nx].seen)choices.push([d,nx,ny])}
  if(!choices.length){stack.pop();continue}
  const[d,nx,ny]=choices[Math.floor(Math.random()*choices.length)];cells[y][x][d]=0;cells[ny][nx][dirs[d][2]]=0;cells[ny][nx].seen=true;stack.push([nx,ny]);
 }
 solution=[[0,0]];const path=[[0,0]],visited=new Set(['0,0']);
 function dfs(x,y){if(x===cols-1&&y===rows-1)return true;for(const d of ['E','S','N','W']){const[nx,ny]=[x+dirs[d][0],y+dirs[d][1]];if(nx<0||ny<0||nx>=cols||ny>=rows||cells[y][x][d]||visited.has(nx+','+ny))continue;visited.add(nx+','+ny);path.push([nx,ny]);if(dfs(nx,ny))return true;path.pop()}return false}
 dfs(0,0);solution=path.slice();pos=0;got=new Set();draw();
}
function tokenMap(){const map=new Map();for(let i=0;i<words.length;i++){const idx=Math.max(1,Math.min(solution.length-2,Math.round((i+1)*solution.length/(words.length+1))));map.set(solution[idx].join(','),i)}return map}
function draw(){
 const maze=document.getElementById('maze'),tokens=tokenMap();maze.style.gridTemplateColumns='repeat('+cols+',auto)';maze.replaceChildren();
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const c=cells[y][x],el=document.createElement('div');el.className='cell';el.dataset.n=c.N;el.dataset.e=c.E;el.dataset.s=c.S;el.dataset.w=c.W;
 const ti=tokens.get(x+','+y);if(ti!==undefined&&!got.has(ti)){el.classList.add('token');el.innerHTML='<span class="token-label">'+words[ti]+'</span>'}
 if(x===cols-1&&y===rows-1)el.innerHTML='<span class="end-dot">🛡️</span>';
 maze.append(el)}
 const player=document.createElement('span');player.className='player';player.setAttribute('aria-label','قطعة اللعب');maze.children[solution[pos][1]*cols+solution[pos][0]].append(player);
 const collected=document.getElementById('collected');collected.replaceChildren();words.forEach((w,i)=>{const chip=document.createElement('span');chip.className='chip'+(got.has(i)?' done':'');chip.textContent=got.has(i)?w:'؟';collected.append(chip)});
}
function move(d){const[x,y]=solution[pos],nx=x+dirs[d][0],ny=y+dirs[d][1];if(nx<0||ny<0||nx>=cols||ny>=rows||cells[y][x][d])return;let idx=solution.findIndex(([a,b])=>a===nx&&b===ny);if(idx<0){ // allow any legal corridor, then return to the path
 document.getElementById('status').textContent='تابعي البحث عن الممر الصحيح 🌿';return
 }pos=idx;const tokens=tokenMap(),ti=tokens.get(nx+','+ny);if(ti!==undefined){if(ti===got.size)got.add(ti);else if(!got.has(ti))document.getElementById('status').textContent='اجمعي الكلمات بالترتيب ✨'}draw();if(got.size===words.length&&pos===solution.length-1){document.getElementById('status').textContent='أحسنتِ! وصلتِ إلى نهاية المتاهة وجمعتِ الكلمات كلها 🎉';document.getElementById('answer').focus()}}
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>move(b.dataset.move)));
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();move(({ArrowUp:'N',ArrowRight:'E',ArrowDown:'S',ArrowLeft:'W'})[e.key])}});
document.getElementById('restart').addEventListener('click',()=>{document.getElementById('status').textContent='';document.getElementById('answer').value='';generate()});
document.getElementById('print').addEventListener('click',()=>window.print());
document.getElementById('check').addEventListener('click',()=>{const normalized=s=>s.replace(/[،,.!؟]/g,'').replace(/\s+/g,' ').trim();if(got.size<words.length){document.getElementById('status').textContent='أكملي المتاهة واجمعي الكلمات أولًا 🌟';return}if(normalized(document.getElementById('answer').value)===normalized(words.join(' '))){document.getElementById('status').textContent='إجابة صحيحة! بالعلم والعمل نبني مستقبل وطننا 🇸🇦'}else{document.getElementById('status').textContent='راجعي الكلمات التي جمعتِها وحاولي مرة أخرى 💚'}});
generate();
</script>
</body>
</html>
