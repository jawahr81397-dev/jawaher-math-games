<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول المعلمة | جوهرة ماث</title><style>body{background:#061521;color:#fff;font:18px system-ui;max-width:480px;margin:40px auto;padding:20px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:12px;font:inherit}button{background:#edc87d;color:#061521;border:0}input{background:#123747;color:white;border:1px solid #487789}p{line-height:1.8}</style><h1>💎 دخول معلمة جوهرة ماث</h1><div id="login"><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="signin">دخول</button><button id="signup">إنشاء حساب جديد</button></div><p id="status"></p><div id="approval" hidden><p>لإكمال اعتماد حساب المعلمة، انسخي معرّف الحساب فقط (ليس كلمة المرور).</p><button id="copyid">نسخ معرّف الحساب</button></div><button id="signout" hidden>تسجيل خروج</button><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const db=createClient('https://ylsnogtohohmzlxpihks.supabase.co','sb_publishable_FZfSp2WWqILRcKPDo-mgxQ_zlDe6l_q');const el=id=>document.getElementById(id);async function check(){const{data:{user}}=await db.auth.getUser();el('login').hidden=!!user;el('signout').hidden=!user;if(!user){el('approval').hidden=true;return}el('approval').hidden=false;el('copyid').onclick=()=>navigator.clipboard.writeText(user.id).then(()=>{el('status').textContent='تم نسخ معرّف الحساب، أرسليه في المحادثة لإكمال الاعتماد.'}).catch(()=>{el('status').textContent='معرّف الحساب: '+user.id});const{data,error}=await db.from('jm_teacher_admins').select('user_id').eq('user_id',user.id).maybeSingle();el('status').textContent=error?'تعذر فحص الصلاحية':data?'تم تسجيل الدخول بصلاحية المعلمة':'تم الدخول. صلاحية المعلمة بانتظار الاعتماد.'}async function submit(signup){const email=el('email').value.trim(),password=el('password').value;if(!email||!password){el('status').textContent='أدخلي البريد وكلمة المرور';return}const{error}=signup?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});el('status').textContent=error?error.message:signup?'تحققي من بريدك لتأكيد الحساب، ثم سجلي الدخول':'';if(!error)await check()}el('signin').onclick=()=>submit(false);el('signup').onclick=()=>submit(true);el('signout').onclick=async()=>{await db.auth.signOut();el('status').textContent='تم تسجيل الخروج';await check()};await check();</script></html>
