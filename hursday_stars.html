<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نجمات الخميس | الرياضيات</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#fff1d0,#f8d4e5 60%,#e9c1e8);min-height:100vh;color:#66304c;text-align:center}.wrap{max-width:760px;margin:auto;padding:22px 14px}h1{font-size:clamp(30px,7vw,48px);color:#a22969;margin:12px 0 4px}.sub{font-size:19px;margin:8px}.teacher{font-size:15px;margin:10px;color:#79475f}.stage{position:relative;margin:24px auto 12px;max-width:670px;height:380px;overflow:hidden;border:10px solid #d8a849;border-radius:95px 95px 20px 20px;background:radial-gradient(ellipse at center,#fff5d7 0%,#f9d5ad 40%,#8b2d64 100%);box-shadow:0 18px 36px #8c3c6755,inset 0 0 25px #8a3454}.stage:before{content:'✦ ✧ ✦ ✧ ✦';position:absolute;top:16px;left:0;right:0;color:#b88627;font-size:22px;letter-spacing:10px}.curtain{position:absolute;top:0;bottom:0;width:51%;z-index:3;background:repeating-linear-gradient(90deg,#a91d55 0,#ca376c 22px,#8d164b 43px,#db467a 58px);transition:transform 1.3s ease;box-shadow:inset 0 0 35px #6e133d}.left{left:0;border-radius:0 0 50% 0}.right{right:0;border-radius:0 0 0 50%}.opened .left{transform:translateX(-101%)}.opened .right{transform:translateX(101%)}.star{font-size:100px;filter:drop-shadow(0 0 17px #ffda61);animation:float 2.3s ease-in-out infinite alternate;margin-top:35px}@keyframes float{to{transform:translateY(-12px) rotate(5deg)}}.reveal{opacity:0;transform:scale(.8);transition:opacity .8s 1s,transform .8s 1s;padding:0 20px}.opened .reveal{opacity:1;transform:scale(1)}.name{font-size:clamp(22px,5vw,33px);font-weight:bold;color:#98275b;margin:4px}.message{font-size:clamp(15px,3.3vw,20px);line-height:1.8;max-width:500px;margin:8px auto;color:#623b4d}.controls{background:#ffffffb9;border:1px solid #fff;padding:20px;border-radius:20px;box-shadow:0 8px 25px #ad6b9633}select,button{font-family:inherit;font-size:18px;padding:12px 18px;border-radius:13px;border:2px solid #d7a74b;max-width:100%}select{background:white;width: min(100%,390px);display:block;margin:10px auto 14px}button{cursor:pointer;color:white;background:linear-gradient(100deg,#ae2866,#d3598c);font-weight:bold;border:0;box-shadow:0 5px 0 #8d2155}button:active{transform:translateY(3px);box-shadow:0 2px 0 #8d2155}.note{font-size:13px;color:#80586b;margin:13px}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;top:-20px;animation:fall 3s linear forwards;font-size:21px}@keyframes fall{to{transform:translateY(430px) rotate(500deg);opacity:0}}@media(max-width:480px){.stage{height:350px;border-width:7px}.star{font-size:80px;margin-top:48px}.wrap{padding:12px}.controls{padding:15px}}</style></head><body><main class="wrap"><div style="font-size:28px">🌟 🎭 🌟</div><h1>نجمات الخميس</h1><p class="sub">مسرح الحضور والتميز</p><p class="sub">📚 مادة الرياضيات – الصف السادس</p><div class="stage" id="stage"><div class="reveal"><div class="star">⭐</div><div class="name" id="studentName"></div><div class="message" id="message"></div><div style="font-weight:bold;color:#a16a20">تستحقين التصفيق 👏✨</div></div><div class="confetti" id="confetti"></div><div class="curtain left"></div><div class="curtain right"></div></div><section class="controls"><label for="student">اختاري اسمك يا نجمة الخميس 💗</label><select id="student"><option value="">— اختاري اسم الطالبة —</option></select><button id="open">🌟 أضيئي المسرح</button><p class="note">هذا الاحتفاء خاص بنجمات الحضور يوم الخميس</p></section><p class="teacher">معلمة مادة الرياضيات / <b>جواهر السبيعي</b> 💕</p></main><script>const names=['ريما البعداني','فاطمة عبدة','صفا العولقي','سنا محمد','لطيفة فيصل','لطيفة احمد','دانية غاندي','جوري بديع','أماني يوسف','ملاك العواضي','زينب السالم','رنا جعفر','لينا لشكر','نورين الصفار','كفاح خالد'];const messages=['حضورك يوم الخميس أضاف لفصلنا نورًا وحماسًا. استمري يا نجمة!','التزامك بالحضور دليل على حرصك وتميزك. نفخر بك!','أنتِ من النجمات اللاتي يصنعن يومًا دراسيًا أجمل بحضورهن.','نجمتنا المضيئة، حضورك اليوم خطوة جميلة نحو النجاح!','شكرًا لحرصك على التعلم حتى آخر يوم في الأسبوع.','بالتزامك وحضورك تثبتين أن التميز يبدأ بخطوات صغيرة.','يا نجمة الرياضيات، حضورك الخميس يستحق أجمل تصفيق!','وجودك معنا اليوم أسعدنا. حافظي على هذا التألق!','نجمة الحضور اليوم أنتِ، فشكرًا لاجتهادك واهتمامك.','كل يوم تحضرين فيه فرصة جديدة للمعرفة والإنجاز.','حضورك المنتظم عادة جميلة تقودك إلى التفوق.','أبدعتِ بالتزامك اليوم، وأضأتِ مسرح نجمات الخميس.','نفخر بحضورك وحرصك، ونتطلع إلى مزيد من نجاحاتك.','النجوم لا تغيب عن سماء التميز، وأنتِ نجمتنا اليوم.','شكرًا لأنك اخترتِ الحضور والتعلم. لكِ كل التقدير!'];const sel=document.getElementById('student'),stage=document.getElementById('stage');names.forEach((n,i)=>{let o=document.createElement('option');o.value=i;o.textContent=n;sel.appendChild(o)});document.getElementById('open').onclick=()=>{if(sel.value===''){alert('اختاري اسمك أولًا يا نجمة 🌟');return}stage.classList.remove('opened');document.getElementById('studentName').textContent=names[+sel.value];document.getElementById('message').textContent=messages[+sel.value];document.getElementById('confetti').innerHTML='';void stage.offsetWidth;stage.classList.add('opened');setTimeout(()=>{for(let i=0;i<36;i++){const s=document.createElement('span');s.className='spark';s.textContent=['✨','⭐','💛','🌟','💗'][i%5];s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*1.3+'s';document.getElementById('confetti').appendChild(s)}},1050)};sel.onchange=()=>stage.classList.remove('opened');</script></body></html>
