const DATA=JSON.parse(document.getElementById('lessonData').textContent);const el=document.getElementById('screen');let student='',grade='',unit='الكل',selected=null,index=0,answers=[],locked=false,muted=false,ctx=null;const AR=n=>String(n).replace(/\d/g,c=>'٠١٢٣٤٥٦٧٨٩'[+c]);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const saved=()=>{try{return JSON.parse(localStorage.getItem('jawharaReviewV1')||'{}')}catch{return {}}};function save(){let d=saved();d[selected.id]={date:new Date().toISOString(),score:answers.filter(x=>x===true).length,completed:answers.length===5};try{localStorage.setItem('jawharaReviewV1',JSON.stringify(d))}catch{}}
function chime(type='tap'){if(muted)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const notes=type==='win'?[523,659,784,1046]:type==='good'?[660,880]:type==='bad'?[310,260]:[510];notes.forEach((freq,i)=>{let osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.value=freq;g.gain.setValueAtTime(.0001,ctx.currentTime+i*.115);g.gain.exponentialRampToValueAtTime(.07,ctx.currentTime+i*.115+.025);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.115+.21);osc.connect(g);g.connect(ctx.destination);osc.start(ctx.currentTime+i*.115);osc.stop(ctx.currentTime+i*.115+.23)})}catch{}}
document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇 الصوت مغلق':'🔊 الصوت';if(!muted)chime('good')};function render(html){el.innerHTML='<div class="screen">'+html+'</div>';window.scrollTo({top:0,behavior:'smooth'})}function goHome(){selected=null;grade='';render(`<section class="hero"><div class="eyebrow">✦ مملكة الإنجاز الرياضي ✦</div><h1>كل درس… جوهرة جديدة</h1><p>اختاري صفك، تدربي على خمس مسائل، واكتسبي شهادة الجوهرة المتقنة حين تحصدين الدرجة الكاملة.</p><div class="badge">💫 تعلمي • حاولي • أتقني • احتفلي</div><div style="margin:30px auto 15px"><input id="name" class="input" maxlength="65" autocomplete="name" placeholder="اكتبي اسمكِ الجميل هنا" value="${escapeHTML(student)}" aria-label="اسم الطالبة"></div><button class="btn gold" onclick="openGrades()">ابدئي رحلتكِ ✨ ←</button><div class="notice" style="max-width:580px;margin:26px auto">خصوصيتك مهمة: الاسم ونتائج المراجعة تُحفظ على هذا الجهاز فقط، ولا تُرسل إلى خادم أو إلى المعلمة تلقائيًا.</div></section>`)}function openGrades(){let n=document.getElementById('name');if(n)student=n.value.trim();if(!student){n?.focus();alert('اكتبي اسمكِ أولًا يا بطلة 💗');return}chime('good');render(`<h2 class="section-title">مرحبًا ${escapeHTML(student)} 🌟</h2><p class="caption">أي عالم رياضي ستكتشفين اليوم؟</p><div class="grades"><button class="grade five glass" onclick="openLessons('5')"><span>🌷</span><h3>الصف الخامس</h3><p>أرقام وعمليات وتحديات جميلة</p><div class="badge">ادخلي عالم الخامس ←</div></button><button class="grade six glass" onclick="openLessons('6')"><span>🪐</span><h3>الصف السادس</h3><p>كسور وإحصاء وقياس واكتشاف</p><div class="badge">ادخلي عالم السادس ←</div></button></div><div class="controls"><button class="btn ghost" onclick="goHome()">تعديل الاسم</button></div>`)}
function openLessons(g){grade=g;unit='الكل';chime();drawLessons()}function drawLessons(){let all=DATA.filter(x=>x.grade===grade),units=['الكل',...new Set(all.map(x=>x.unit))];render(`<button class="btn ghost" onclick="openGrades()">→ عودة لاختيار الصف</button><h2 class="section-title">${grade==='5'?'🌷 مراجعة الصف الخامس':'🪐 مراجعة الصف السادس'}</h2><p class="caption">اختاري المجال والدرس، ثم اجمعي خمس إجابات صحيحة. تحتوي هذه النسخة على ${AR(all.length)} دروس تجريبية.</p><div class="controls"><input class="input search" id="search" placeholder="🔎 ابحثي عن درس..." oninput="filterLessons()"></div><div class="units">${units.map(u=>`<button class="pill ${u===unit?'selected':''}" data-unit="${escapeHTML(u)}" onclick="pickUnit(this)">${escapeHTML(u)}</button>`).join('')}</div><div class="lessons" id="lessons"></div>`);filterLessons()}function pickUnit(button){unit=button.dataset.unit;document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('selected',x===button));filterLessons()}function filterLessons(){let str=(document.getElementById('search')?.value||'').trim(),list=DATA.filter(x=>x.grade===grade&&(unit==='الكل'||x.unit===unit)&&x.title.includes(str)),s=saved();document.getElementById('lessons').innerHTML=list.length?list.map(x=>`<button class="lesson glass" onclick="startLesson('${x.id}')"><div class="badge">${s[x.id]?.score===5?'🏆 متقنة':s[x.id]?.completed?'🔄 أعيدي المحاولة':'✦ خمس أسئلة'}</div><h3>${escapeHTML(x.title)}</h3><p>${escapeHTML(x.unit)}</p><div class="lesson-footer"><span class="chip">${s[x.id]?.completed?AR(s[x.id].score)+'/٥':'لم تبدئي بعد'}</span><strong style="color:var(--gold)">ابدئي ←</strong></div></button>`).join(''):'<p class="caption">لا توجد دروس مطابقة للبحث.</p>'}function startLesson(id){selected=DATA.find(x=>x.id===id);if(!selected)return;index=0;answers=[];locked=false;chime('tap');drawQuestion()}function drawQuestion(){locked=false;let q=selected.questions[index];render(`<button class="btn ghost" onclick="openLessons('${grade}')">→ الدروس</button><div class="question-card glass"><div class="qtop"><span class="qnumber">السؤال ${AR(index+1)} من ٥</span><span class="badge">💎 ${escapeHTML(selected.title)}</span></div><div class="progress"><div style="width:${index*20}%"></div></div><div class="small">اقرئي جيدًا واختاري إجابة واحدة</div><h2 class="qtitle">${escapeHTML(q.q)}</h2><div class="choices">${q.o.map((o,i)=>`<button class="choice" onclick="choose(${i})" id="choice${i}"><span style="color:var(--gold);margin-left:10px">${'أبجد'[i]}.</span> ${escapeHTML(o)}</button>`).join('')}</div><div id="feedback"></div><div class="bottomrow"><span class="small">🌟 كل سؤال فرصة للتعلم</span><span class="small">${AR(answers.filter(x=>x===true).length)} إجابة صحيحة حتى الآن</span></div></div>`)}function choose(i){if(locked)return;locked=true;const q=selected.questions[index],correct=i===q.a;answers.push(correct);chime(correct?'good':'bad');document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="feedback ${correct?'good':'bad'}"><strong>${correct?'✨ أحسنتِ! إجابة صحيحة':'💗 محاولة جميلة، وتعلمنا شيئًا جديدًا!'}</strong><br>${escapeHTML(q.why)}</div><button class="btn gold" style="margin-top:15px" onclick="advance()">${index===4?'شاهدي نتيجتكِ 🏆':'السؤال التالي ←'}</button>`}function advance(){chime();index++;if(index<5)drawQuestion();else finish()}function finish(){save();let score=answers.filter(Boolean).length;if(score===5){chime('win');confetti();showCertificate();return}render(`<div class="result glass"><div style="font-size:70px">💗</div><h2>أنتِ أقرب إلى الإتقان!</h2><div class="score">${AR(score)} / ٥</div><p class="caption">يا ${escapeHTML(student)}، راجعي الشرح وحاولي من جديد. شهادة الجوهرة المتقنة بانتظارك عند الحصول على ٥ من ٥.</p><div class="controls" style="justify-content:center"><button class="btn gold" onclick="startLesson('${selected.id}')">🔄 أعيدي المحاولة</button><button class="btn ghost" onclick="openLessons('${grade}')">العودة للدروس</button></div></div>`)}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<65;i++){let d=document.createElement('span');d.className='spark';d.textContent=['✨','💎','⭐','✦'][Math.floor(Math.random()*4)];d.style.left=Math.random()*100+'vw';d.style.fontSize=(12+Math.random()*17)+'px';d.style.animationDelay=Math.random()*.85+'s';d.style.animationDuration=(2.5+Math.random()*2)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5300)}}
function certCanvas(){const c=document.getElementById('certificate');if(!c)return;const W=1200,H=850;c.width=W;c.height=H;const x=c.getContext('2d');let bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#fffaf2');bg.addColorStop(1,'#e7f5f3');x.fillStyle=bg;x.fillRect(0,0,W,H);x.strokeStyle='#bd9849';x.lineWidth=16;x.strokeRect(38,38,W-76,H-76);x.strokeStyle='#28475e';x.lineWidth=3;x.strokeRect(57,57,W-114,H-114);x.textAlign='center';x.fillStyle='#a8803a';x.font='bold 108px Tajawal, sans-serif';x.fillText('✦',W/2,180);x.fillStyle='#1d3a50';x.font='bold 58px Tajawal, sans-serif';x.fillText('شهادة الجوهرة المتقنة',W/2,275);x.font='30px Tajawal, sans-serif';x.fillStyle='#496174';x.fillText('تُمنح بكل فخر للطالبة',W/2,351);x.font='bold 58px Tajawal, sans-serif';x.fillStyle='#8e5a83';let name=student;if(x.measureText(name).width>950){x.font='bold 42px Tajawal, sans-serif'}x.fillText(name,W/2,432);x.fillStyle='#405b6f';x.font='29px Tajawal, sans-serif';x.fillText('تقديرًا لإتقانها مهارات درس',W/2,498);x.font='bold 37px Tajawal, sans-serif';x.fillText(selected.title,W/2,553);x.font='bold 30px Tajawal, sans-serif';x.fillText(`الصف ${selected.grade==='5'?'الخامس':'السادس'}  •  النتيجة ٥ / ٥`,W/2,618);x.strokeStyle='#d2b16e';x.beginPath();x.moveTo(310,660);x.lineTo(890,660);x.stroke();x.font='bold 26px Tajawal, sans-serif';x.fillStyle='#223e51';x.fillText('المعلمة/ جواهر السبيعي',W/2,722);x.font='21px Tajawal, sans-serif';x.fillText('جوهرة ماث 💎',W/2,767)}
function showCertificate(){render(`<div class="result glass" style="padding-bottom:25px"><div style="font-size:65px">🏆💎</div><h2>مبارك يا ${escapeHTML(student)}!</h2><p class="caption">أجبتِ عن الأسئلة الخمسة إجابة صحيحة، واستحققتِ شهادة الجوهرة المتقنة.</p><div class="score">٥ / ٥</div></div><div class="certwrap"><canvas id="certificate" role="img" aria-label="شهادة الجوهرة المتقنة باسم الطالبة"></canvas><div class="controls" style="justify-content:center"><button class="btn gold" onclick="downloadCertificate()">📸 حفظ الشهادة كصورة</button><button class="btn ghost" onclick="openLessons('${grade}')">📚 اختيار درس آخر</button></div><p class="hint">على الآيفون، إذا عُرضت الصورة في تبويب جديد، اضغطي عليها مطولًا واختاري «حفظ في الصور». ويمكنك إرسالها للمعلمة بنفسك.</p></div>`);document.fonts.ready.then(certCanvas)}function downloadCertificate(){let c=document.getElementById('certificate');if(!c)return;const fn='jawhara-certificate-'+selected.id+'.png';c.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)},'image/png')}
goHome();
</script></body></html>
