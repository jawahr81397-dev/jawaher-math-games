<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استيراد قياس الأثر</title><style>body{font:16px system-ui;background:#071827;color:#eff9ff;margin:0}main{max-width:750px;margin:auto;padding:20px}section{background:#123449;border:1px solid #47677a;border-radius:16px;padding:18px;margin:15px 0}h1,h2{color:#f4d58f}textarea{width:100%;min-height:180px;background:#081f2d;color:white;border:1px solid #7394a0;border-radius:10px;padding:12px;box-sizing:border-box;font-size:14px}button{padding:13px;background:#efcd8a;border:0;border-radius:9px;font-weight:bold}a{color:#efcd8a}#status{white-space:pre-wrap}</style><main><h1>💎 استيراد نتائج ما وراء الفاصلة</h1><p>تستقبل هذه الصفحة رمز النتيجة الذي ترسله الطالبة، وتحفظ درجات الاختبارين في لوحة قياس الأثر. لا تغيّر نتائج نافس.</p><section id="gate">جارٍ التحقق من صلاحية المعلمة...</section><section id="form" hidden><label>الصقي رمز النتيجة الذي أرسلته الطالبة<textarea id="receipt" placeholder='{"type":"jawhara-impact-v1",...}'></textarea></label><p><button id="check">فحص النتيجة</button></p><div id="preview"></div><button id="save" hidden>حفظ الاختبار القبلي والبعدي</button></section><p id="status"></p><p><a href="jm-impact.html">📊 عرض قياس الأثر</a></p></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const db=createClient('https://ylsnogtohohmzlxpihks.supabase.co','sb_publishable_FZfSp2WWqILRcKPDo-mgxQ_zlDe6l_q'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;',"'":'&#39;'}[c]));let students=[],classes=[],program=null,ready=null;const skillNames={a:'جمع الكسور العشرية',s:'طرح الكسور العشرية',m:'ضرب الكسور العشرية',d:'قسمة الكسور العشرية'};function normalize(s){return String(s||'').replace(/\s+/g,' ').trim()}function error(s){$('status').textContent=s;$('save').hidden=true;ready=null}async function init(){try{const{data:{user}}=await db.auth.getUser();if(!user)throw Error('يلزم تسجيل الدخول أولًا');const role=await db.from('jm_teacher_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(role.error||!role.data)throw Error('حسابك لا يملك صلاحية المعلمة');const a=await Promise.all([db.from('jm_students').select('id,full_name,class_id'),db.from('jm_classes').select('id,name'),db.from('jm_programs').select('id,title,url').ilike('url','%ma-waraa-al-fasila.html%').limit(1)]);for(const x of a)if(x.error)throw x.error;students=a[0].data;classes=a[1].data;program=a[2].data?.[0];if(!program)throw Error('برنامج ما وراء الفاصلة غير مسجل في اللوحة');$('gate').textContent='تم التحقق من صلاحية المعلمة';$('form').hidden=false}catch(e){error(e.message);$('gate').innerHTML='<a href="jm-auth-check.html">فتح تسجيل الدخول</a>'}}$('check').onclick=()=>{try{const x=JSON.parse($('receipt').value.trim());if(x.type!=='jawhara-impact-v1'||x.program!=='ma-waraa-al-fasila')throw Error('هذا الرمز ليس من النسخة المعتمدة');const classRow=classes.find(c=>c.name===x.klass);if(!classRow)throw Error('الفصل غير مسجل في لوحة المعلمة');const matches=students.filter(s=>s.class_id===classRow.id&&normalize(s.full_name)===normalize(x.student));if(matches.length!==1)throw Error('اسم الطالبة غير مطابق أو مكرر في الفصل؛ راجعي الاسم قبل الحفظ');for(const t of Object.keys(skillNames)){if(!Number.isInteger(x.pre?.[t])||!Number.isInteger(x.post?.[t])||x.pre[t]<0||x.pre[t]>3||x.post[t]<0||x.post[t]>3)throw Error('درجات غير صحيحة في المهارة: '+skillNames[t])}const date=new Date(x.completed_at);if(!Number.isFinite(date.getTime()))throw Error('تاريخ النتيجة غير صحيح');ready={student:matches[0],payload:x};$('preview').textContent='الطالبة: '+matches[0].full_name+' | الفصل: '+classRow.name+' | مجموع القبلي: '+Object.values(x.pre).reduce((a,b)=>a+b,0)+'/١٢ | البعدي: '+Object.values(x.post).reduce((a,b)=>a+b,0)+'/١٢';$('status').textContent='راجعي اسم الطالبة والدرجات، ثم اضغطي حفظ.';$('save').hidden=false}catch(e){error(e.message)}};$('save').onclick=async()=>{if(!ready)return;const {student,payload:x}=ready;$('save').disabled=true;try{const rows=Object.keys(skillNames).flatMap(t=>[{student_id:student.id,program_id:program.id,skill:'اختبار قبلي '+skillNames[t],score:x.pre[t],max_score:3,completed_at:x.completed_at},{student_id:student.id,program_id:program.id,skill:'اختبار بعدي '+skillNames[t],score:x.post[t],max_score:3,completed_at:x.completed_at}]);const{error:err}=await db.from('jm_activity_results').insert(rows);if(err)throw err;error('تم حفظ ٨ نتائج للمهارات الأربع بنجاح. يمكنكِ فتح قياس الأثر لرؤية التحسن.');$('receipt').value='';$('preview').textContent=''}catch(e){error('تعذر الحفظ: '+e.message)}finally{$('save').disabled=false}};init();</script></html>
