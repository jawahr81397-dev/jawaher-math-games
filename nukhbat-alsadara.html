<style>

</style></head><body>

<svg width="0" height="0" style="position:absolute"><symbol id="crown" viewBox="0 0 80 50"><path d="M5 42 L10 12 L27 29 L40 5 L53 29 L70 12 L75 42 Z M7 44 H73 V49 H7 Z"/></symbol></svg>

<div id="set"><b>ضبط الموسيقى (المدة ٦٠ث)</b><br>بداية التكرار <input type="number" id="lf" value="22"><button data-t="lf">معاينة</button><br>نهاية التكرار <input type="number" id="lt" value="58"><button data-t="lt">معاينة</button><br>نقطة الذروة <input type="number" id="lc" value="44"><button data-t="lc">معاينة</button><br><label><input type="checkbox" id="lite"> وضع الأداء الخفيف</label></div>
<div id="start"><svg class="cr" viewBox="0 0 80 50"><use href="#crown"/></svg><h1>نُخبة الصدارة</h1><p>حين يتحدث الإبداع… تتصدر العقول!</p><button id="sb">بدء الحفل</button></div></div>

<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const N=["فاطمة عبدة","ملاك العواضي","كفاح خالد","زينب السالم"],LAB=["","فتح الظرف الثاني","فتح الظرف الثالث","فتح الظرف الأخير"],AR=["٣","٢","١"];
const st=$("#stage"),cam=$("#cam"),cap=$("#cap"),act=$("#act"),au=$("#au"),cd=$("#cd"),ttl=$("#ttl");
let lite=/iPhone|iPad|Android/i.test(navigator.userAgent)||innerWidth<900,duck=.22,lvl=0,muted=false,ac,gn,an,tw,env,ended=false,loopSeek=false;
$("#lite").checked=lite;$("#lite").onchange=e=>{lite=e.target.checked;size()};
// ---------- sound ----------
function vol(v,s=1){lvl=v;const e=muted?0:v;if(gn){gn.gain.cancelScheduledValues(ac.currentTime);gn.gain.setTargetAtTime(e,ac.currentTime,s/3)}else{clearInterval(tw);const a=au.volume,t0=performance.now();tw=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/(s*1000));au.volume=Math.max(0,Math.min(1,a+(e-a)*k));if(k==1)clearInterval(tw)},50)}}
function beep(f,d=.18,g=.25){if(!ac||muted)return;const o=ac.createOscillator(),k=ac.createGain();o.frequency.value=f;k.gain.setValueAtTime(g,ac.currentTime);k.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(k);k.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function nz(d,f0,f1,g,type="bandpass"){if(!ac||muted)return;const b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type=type;const t=ac.currentTime;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);const k=ac.createGain();k.gain.setValueAtTime(0,t);k.gain.linearRampToValueAtTime(g,t+d*.4);k.gain.linearRampToValueAtTime(0,t+d);s.connect(f);f.connect(k);k.connect(ac.destination);s.start();s.stop(t+d)}
const whoosh=()=>nz(1.4,300,3500,.35),boom=()=>{nz(.6,200,40,.9,"lowpass");beep(110,.5,.4)};
function applause(d=4){if(!ac||muted)return;const b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type="bandpass";f.frequency.value=1800;f.Q.value=.5;const g=ac.createGain(),t=ac.currentTime,n=d*16;s.connect(f);f.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0,t);for(let x=0;x<n;x++)g.gain.setValueAtTime(Math.min(1,x/6)*Math.min(1,(n-x)/20)*(.08+Math.random()*.3),t+x/16);g.gain.setValueAtTime(0,t+d);s.start(t);s.stop(t+d+.1)}
function seek(t){const k=lvl;vol(0,.5);setTimeout(()=>{au.currentTime=t;vol(k,.8)},600)}
setInterval(()=>{const lt=+$("#lt").value;if(!au.paused&&!ended&&!loopSeek&&au.currentTime>=lt){loopSeek=true;const k=lvl;vol(0,.5);setTimeout(()=>{au.currentTime=+$("#lf").value;vol(k,.8);loopSeek=false},650)}},200);
au.onended=()=>{ended=true};
// ---------- particles ----------
const cv=$("#fx"),cx=cv.getContext("2d");let P=[];
function size(){const r=st.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,lite?1.2:2);cv.width=r.width*d;cv.height=r.height*d}
addEventListener("resize",size);size();
const R=Math.random,GC=["#fff3b8","#f0c552","#d9a93b","#ffe08a"];
function burst(x,y,n){n=lite?n*.5:n;for(let i=0;i<n;i++){const a=R()*6.283,v=.15+R()*.55;P.push({k:0,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.2,l:0,m:70+R()*70,s:.25+R()*.4})}}
function ribbons(n){n=lite?n*.5:n;for(let i=0;i<n;i++)P.push({k:1,x:R()*100,y:-3-R()*20,vx:(R()-.5)*.1,vy:.1+R()*.17,r:R()*6,vr:(R()-.5)*.2,c:GC[i%4],l:0,m:900})}
function loop(t){const u=cv.width/100;cx.clearRect(0,0,cv.width,cv.height);if(P.filter(p=>p.k==2).length<(lite?22:50)&&R()<.3)P.push({k:2,x:R()*100,y:57,vx:(R()-.5)*.03,vy:-.03-R()*.06,l:0,m:400,s:.15+R()*.2});
for(const p of P){p.l++;p.x+=p.vx;p.y+=p.vy;if(p.k==0)p.vy+=.006;if(p.k==1)p.r+=p.vr;const a=p.k==1?1:Math.max(0,1-p.l/p.m)*(p.k==2?.6:1);cx.globalAlpha=a;if(p.k==1){cx.save();cx.translate(p.x*u,p.y*u);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-.6*u,-.25*u,1.2*u,.5*u);cx.restore()}else{cx.fillStyle=p.k?"#ffe9a1":"#ffd66e";cx.beginPath();cx.arc(p.x*u,p.y*u,p.s*u,0,6.283);cx.fill()}}
P=P.filter(p=>p.l<p.m&&p.y<62);cx.globalAlpha=1;
let g=.3+.1*Math.sin(t/600);if(an){const d=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(d);let s=0;for(let i=0;i<12;i++)s+=d[i];g=.15+s/12/255*.8}$("#glow").style.opacity=g;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
// ---------- helpers ----------
async function say(t,ms=3000,low=false,keep=false){cap.classList.toggle("low",low);cap.innerHTML=t;await sleep(60);cap.classList.add("on");await sleep(ms);if(!keep){cap.classList.remove("on");await sleep(900)}}

function mk(name,mark){const e=document.createElement("div");e.className="env"+(mark?" mark":"");e.innerHTML='<div class="eb"></div><div class="card"><b></b><i>تكريم الصدارة</i></div><div class="ef"></div><div class="fl"></div><div class="seal"><svg viewBox="0 0 80 50"><use href="#crown"/></svg></div>';e.querySelector("b").textContent=name;cam.appendChild(e);return e}
const T0=()=>{const t=performance.now();return s=>sleep(Math.max(0,s*1000-(performance.now()-t)))};
// ---------- scenes ----------
async function intro(){const at=T0();$("#black").style.transition="opacity 3s";cam.style.transition="none";cam.style.transform="scale(1.4)";
$("#beam").classList.add("on");await at(4);$("#black").style.opacity=.8;cam.style.transition="transform 12s linear";cam.style.transform="scale(1.1)";
await say("هناك إنجازات لا تمرّ مرور الكرام…",3600);await at(9.5);await say("وهناك عقول تستحق أن تتصدر المشهد!",3600);
