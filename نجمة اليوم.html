<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نجمة اليوم | جواهر السبيعي</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 5%,#24345e 0%,#10152f 55%,#080c1e 100%);color:#fff4d2;font-family:Tahoma,Arial,sans-serif;overflow-x:hidden}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.panel{width:min(780px,100%);text-align:center;border:1px solid #bca06175;border-radius:30px;padding:clamp(25px,5vw,55px);background:#141d3cbd;box-shadow:0 20px 80px #0006;position:relative;z-index:2}h1{font-size:clamp(36px,6vw,66px);color:#f5d47f;margin:8px 0}h2{font-size:clamp(22px,4vw,34px);margin:10px 0 28px}.sub{color:#d6caa9;font-size:18px}.star{font-size:72px;filter:drop-shadow(0 0 20px #e5ad49)}select,button{font-family:inherit;font-size:clamp(18px,2.5vw,23px);border-radius:15px;padding:17px;width:100%;margin-top:14px}select{background:#202b50;color:white;border:2px solid #d5b46b;outline:0}option{color:#10152f;background:white}button{border:0;background:linear-gradient(120deg,#f7dd93,#b98b38);color:#17213d;font-weight:bold;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.ghost{background:#222f54;color:#fff0cc;border:1px solid #a98e5b}.footer{margin-top:35px;color:#e5d3a0;font-size:16px}.hidden{display:none}.winner{font-size:clamp(40px,8vw,78px);line-height:1.35;color:#ffe49d;text-shadow:0 0 30px #edc75c7a;overflow-wrap:anywhere}.winnerstar{font-size:110px;animation:pulse 1.3s infinite alternate}@keyframes pulse{to{transform:scale(1.15);filter:drop-shadow(0 0 35px #f8ce68)}}.conf{position:fixed;top:-30px;width:10px;height:17px;z-index:10;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(950deg)}}.hint{font-size:14px;color:#bcbfd1}</style></head><body><main class="page"><section class="panel" id="pick"><div class="star">⭐</div><p class="sub">تكريم الأدب والتميز</p><h1>نجمة اليوم</h1><h2>من ستتألق اليوم بين النجوم؟ ✨</h2><select id="names"><option value="">اختاري اسم الطالبة</option></select><button id="reveal" disabled>✨ إعلان نجمة اليوم</button><p class="hint">اختاري الفصل ثم اسم الطالبة من القائمة</p><p class="footer">معلمة المادة / جواهر السبيعي</p></section><section class="panel hidden" id="celebrate"><div class="winnerstar">🌟</div><p class="sub">نجمة اليوم المتميزة</p><h1 id="winner" class="winner"></h1><h2>تألقتِ بأدبكِ وتميزكِ… فاستحققتِ لقب نجمة اليوم!</h2><p class="sub" id="classlabel"></p><button class="ghost" id="repeat">🔊 إعادة الاحتفال</button><button id="back">↩ اختيار طالبة أخرى</button><p class="footer">معلمة المادة / جواهر السبيعي</p></section></main><script>
const classes={"خامس (أ)": ["أسيل صلاح", "تالية محمد", "جنات حسن", "جود محمد", "حسناء محمد", "ديما عادل", "رودينا سلطان", "زينب حسين", "سارة علي", "علا محمد", "غلا معيض", "فاطمة عبدالله", "قمر عوض", "لطيفة عبدالله", "مريم علاء", "مها علي", "نورة نايف", "هاجر عبدالعزيز", "وتين علي", "ياسمين صالح"], "خامس (ب)": ["بسمة هاني", "بتين باسم", "جنان عدنان", "جنى ماهر", "جود عبدالله", "جوري حمود", "حنان يوسف", "ريم يحيى", "زهراء جميل", "زهراء علي", "فاطمة مهدي", "فدية ماجد", "في حمود", "لمار آدم", "ليان محمد", "مريم خليفة", "ميرا نضال", "نجاة طارق", "نضرة عبدالله", "نورة زياد"], "سادس (أ)": ["أماني يوسف", "آلاء سرالله", "جوري بديع", "دانية غاندي", "رنا جعفر", "ريم عمر", "ريما ماجد", "زينب أحمد", "سنا محمد", "صفا محمد", "فاطمة عبده", "فاطمة صلاح", "كفاح خالد", "لطيفة أحمد", "لطيفة فيصل", "لينا محمد", "مريم باسم", "ملاك أحمد", "ملكة فؤاد", "نورين حسين", "نوف عادل", "شهد المطيري", "شهد الغامدي", "ميار الحريجي"]};
const sel=document.getElementById('names'),go=document.getElementById('reveal');
for(const [group,students] of Object.entries(classes)){const o=document.createElement('optgroup');o.label='━━ '+group+' ━━';for(const name of students){const opt=document.createElement('option');opt.value=group+'|'+name;opt.textContent=name;o.appendChild(opt)}sel.appendChild(o)}
sel.onchange=()=>go.disabled=!sel.value;
let ctx;function note(f,d=.2,type='triangle',vol=.14){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(vol,ctx.currentTime+.018);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d+.03)}
function music(){[392,494,587,784,988,1175].forEach((f,i)=>setTimeout(()=>note(f,i===5?.9:.34,'triangle',.15),i*180))}
function confetti(){for(let i=0;i<155;i++){let e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=['#eac267','#fff1b9','#e5a7dd','#87d3e4'][i%4];e.style.animationDuration=(2+Math.random()*3)+'s';e.style.animationDelay=Math.random()*.8+'s';e.style.setProperty('--dx',(Math.random()*350-175)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),6500)}}
async function show(){if(!sel.value)return;ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();const [cl,name]=sel.value.split('|');document.getElementById('winner').textContent=name;document.getElementById('classlabel').textContent=cl;document.getElementById('pick').classList.add('hidden');document.getElementById('celebrate').classList.remove('hidden');music();confetti()}
go.onclick=show;document.getElementById('repeat').onclick=async()=>{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();music();confetti()};document.getElementById('back').onclick=()=>{document.getElementById('celebrate').classList.add('hidden');document.getElementById('pick').classList.remove('hidden')};
</script></body></html>
