<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحدي الثنائيات - خامس أ</title><style>body{font-family:system-ui;background:linear-gradient(130deg,#081b38,#244e72);color:white;text-align:center;padding:25px}button{padding:14px;margin:7px;border:0;border-radius:15px;background:#f6d78d;color:#142744;font-size:19px;font-weight:bold}.card{background:#ffffff16;border:1px solid #ffffff55;border-radius:22px;padding:20px;margin:15px auto;max-width:650px}#options button{display:block;margin:10px auto;width:85%}</style><h1>🏆 تحدي الثنائيات</h1><h2>الصف الخامس (أ)</h2><button onclick="music()">🎵 تشغيل الموسيقى</button><div class="card" id="screen"></div><script>const names=['جود ولطيفة','رودينا وهاجر','مها ومريم','غلا وياسمين','ديما ونورة','قمر وزينب','علا ووتين','أسيل وتاليا','جنات وفاطمة'];let scores=Array(9).fill(0),idx=-1,q=0,ac;const qs=[['ما ناتج ٧ × ٨؟',['٥٦','٥٤','٦٤'],0],['ما ناتج ٩ × ٦؟',['٤٨','٥٤','٦٣'],1],['ما ناتج ٨١ ÷ ٩؟',['٨','٧','٩'],2],['ما قيمة س في س + ١٧ = ٤٠؟',['٢٣','٢٧','٣٣'],0],['ما ناتج ١٢ × ٤؟',['٤٦','٤٨','٥٢'],1],['ما ناتج ٧٢ ÷ ٨؟',['٨','٩','٧'],1],['ما قيمة س في ٦ × س = ٤٢؟',['٦','٨','٧'],2],['ما ناتج ٣٥ + ٤٧؟',['٨٢','٧٢','٩٢'],0],['ما ناتج ١٠٠ - ٣٨؟',['٧٢','٦٢','٥٨'],1]];function home(){document.getElementById('screen').innerHTML='<h2>اختاري الثنائي</h2>'+names.map((n,i)=>'<button onclick="start('+i+')">'+n+' — '+scores[i]+' نقطة</button>').join('')+'<p><button onclick="rank()">🏅 لوحة النتائج</button></p>'}function start(i){idx=i;q=0;ask()}function ask(){let x=qs[q];document.getElementById('screen').innerHTML='<h2>'+names[idx]+'</h2><p>السؤال '+(q+1)+' من ٩</p><h2>'+x[0]+'</h2><div id="options">'+x[1].map((a,i)=>'<button onclick="answer('+i+')">'+a+'</button>').join('')+'</div>'}function answer(i){let good=i===qs[q][2];if(good)scores[idx]++;let msg=good?'🌟 إجابة صحيحة!':'حاولي في السؤال القادم';document.getElementById('screen').innerHTML='<h2>'+msg+'</h2><button onclick="next()">التالي</button>'}function next(){if(++q<qs.length)ask();else{document.getElementById('screen').innerHTML='<h2>أحسنتما '+names[idx]+'!</h2><h2>النتيجة: '+scores[idx]+' من ٩</h2><button onclick="home()">العودة للثنائيات</button>'}}function rank(){document.getElementById('screen').innerHTML='<h2>🏆 ترتيب الثنائيات</h2>'+names.map((n,i)=>({n,s:scores[i]})).sort((a,b)=>b.s-a.s).map((x,i)=>'<p>'+(i+1)+'. '+x.n+' — '+x.s+'</p>').join('')+'<button onclick="home()">رجوع</button>'}function music(){if(ac){ac.close();ac=null;return}ac=new(window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;[523,659,784,1046,784,659,523].forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.24);g.gain.exponentialRampToValueAtTime(.08,t+i*.24+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.24+.2);o.connect(g).connect(ac.destination);o.start(t+i*.24);o.stop(t+i*.24+.22)})}home()</script></html>
