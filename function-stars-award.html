<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نجمات جدول الدوال</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Tahoma,Arial;background:radial-gradient(circle at top,#fff4fa,#f4e7ff 65%,#e8ddff);color:#57316b;text-align:center}main{max-width:560px;width:88%;background:#ffffffd9;border:2px solid #fff;border-radius:30px;padding:30px 15px;box-shadow:0 18px 50px #9c77ba33}h1{font-size:clamp(25px,6vw,39px)}p{line-height:2}select,button{font:inherit;border-radius:16px;padding:13px 20px;margin:8px;border:1px solid #dcbbe9}button{background:#a74b9d;color:white;cursor:pointer}select{width:85%;background:white}.machine{font-size:85px;animation:bob 2s infinite alternate}@keyframes bob{to{transform:translateY(-12px)}}#award{display:none;border:3px solid #e7c775;border-radius:24px;margin:16px 0;padding:18px;background:linear-gradient(145deg,#fffdf3,#fff1fa)}#award h2{color:#a16b20;font-size:30px}.star{position:fixed;top:-50px;animation:fall 3s linear forwards;pointer-events:none}@keyframes fall{to{top:110vh;transform:rotate(420deg)}}.small{font-size:13px}</style><main><div class="machine">⚙️💎</div><h1>آلة الإبداع | نجمات الدوال</h1><p>لكل مدخلة مبدعة… مخرجة من التألق والتميز ✨</p><label for="student">اختاري اسمكِ يا نجمة الدوال</label><select id="student"><option value="">اختاري اسم الطالبة</option><option>وتين</option><option>قمر</option><option>جود</option><option>غلا</option><option>علا</option><option>لطيفة</option><option>فاطمة</option><option>هاجر</option><option>جنات</option><option>زينب</option><option>نورة</option><option>مريم</option><option>رودينا</option><option>ديما</option></select><div><button onclick="celebrate()">اكتشفي تميزكِ 🌟</button></div><section id="award"><div style="font-size:58px">🏅</div><h2>وسام نجمة الدوال</h2><h2 id="studentName"></h2><p>شكرًا لمشاركتكِ الرائعة وتفاعلكِ المميز في درس <b>جدول الدوال</b> للصف الخامس.<br>بفهمكِ واجتهادكِ أضأتِ درسنا إبداعًا!</p><strong>معلمتكن/ جواهر السبيعي</strong></section><p class="small">اضغطي على زر التكريم لعرض الوسام الخاص بكِ</p></main><script>function celebrate(){let n=document.getElementById('student').value;if(!n){alert('اختاري اسمكِ أولًا');return}document.getElementById('studentName').textContent=n;document.getElementById('award').style.display='block';for(let i=0;i<35;i++){let e=document.createElement('span');e.className='star';e.textContent=['⭐','💗','✨','💎'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*1.8+'s';e.style.fontSize=16+Math.random()*22+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}document.getElementById('award').scrollIntoView({behavior:'smooth',block:'center'})}</script></html>
