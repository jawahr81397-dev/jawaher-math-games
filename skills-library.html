عداد أولية فقط."]],"تبسيط الكسور":[["ما أبسط صورة للكسر ٦/٨؟","٣/٤","٢/٤","٦/٤","نقسم البسط والمقام على القاسم المشترك الأكبر ٢."],["ما أبسط صورة للكسر ٩/١٢؟","٣/٤","٩/٦","١/٤","نقسم البسط والمقام على ٣."]],"مقارنة الكسور الاعتيادية":[["أي الكسرين أكبر: ٣/٤ أم ١/٢؟","٣/٤","١/٢","متساويان","١/٢ يساوي ٢/٤، إذن ٣/٤ أكبر."],["أي الكسرين أصغر: ٢/٣ أم ١/٣؟","١/٣","٢/٣","متساويان","عند تساوي المقام نقارن البسطين."]],"تحويل الكسور":[["حوّلي ٧/٣ إلى عدد كسري.","٢ و١/٣","١ و٢/٣","٣ و١/٢","٧ ÷ ٣ = ٢ والباقي ١."],["حوّلي ١ و٢/٥ إلى كسر غير فعلي.","٧/٥","٣/٥","٥/٧","نضرب العدد الصحيح في المقام ثم نضيف البسط."]],"جمع الكسور":[["١/٤ + ٢/٤ = ؟","٣/٤","٣/٨","٢/٨","نجمع البسطين لأن المقامين متساويان."],["١/٢ + ١/٤ = ؟","٣/٤","٢/٦","١/٦","نحول ١/٢ إلى ٢/٤ ثم نجمع."]],"طرح الكسور":[["٣/٤ - ١/٤ = ؟","١/٢","٢/٨","١/٤","٣/٤ - ١/٤ = ٢/٤ = ١/٢."],["٥/٦ - ١/٣ = ؟","١/٢","٤/٣","٢/٦","نحول ١/٣ إلى ٢/٦ ثم نطرح ٣/٦ = ١/٢."]],"جمع الكسور العشرية":[["٢٫٣ + ١٫٤ = ؟","٣٫٧","٣٫١٢","٢٫٧","نحاذي الفواصل ثم نجمع الأعشار."],["٠٫٢٥ + ٠٫٥٠ = ؟","٠٫٧٥","٠٫٣٠","٠٫٢٥٥٠","نجمع الأجزاء من مئة."]],"طرح الكسور العشرية":[["٥٫٨ - ٢٫٣ = ؟","٣٫٥","٣٫١١","٧٫٥","نحاذي الفواصل ثم نطرح."],["٣٫٠٠ - ١٫٢٥ = ؟","١٫٧٥","٢٫٢٥","١٫٢٥","نطرح أجزاء المئة مع الاستلاف."]],"ضرب الكسور العشرية":[["١٫٢ × ٣ = ؟","٣٫٦","٣٦","٤٫٢","١٢ × ٣ = ٣٦، ثم نضع منزلة عشرية واحدة."],["٠٫٥ × ٠٫٤ = ؟","٠٫٢","٢","٠٫٩","٥ × ٤ = ٢٠ ومعنا منزلتان عشريتان: ٠٫٢٠."]],"قسمة الكسور العشرية":[["٤٫٨ ÷ ٢ = ؟","٢٫٤","٢٤","٤٫٦","٤٨ عُشرًا ÷ ٢ = ٢٤ عُشرًا."],["١٫٢ ÷ ٠٫٣ = ؟","٤","٠٫٤","٤٠","نضرب العددين في ١٠ فتصبح ١٢ ÷ ٣ = ٤."]],"المدى":[["ما مدى البيانات ٣، ٧، ١٠، ٤؟","٧","١٠","٤","المدى = أكبر قيمة - أصغر قيمة = ١٠ - ٣."],["ما مدى ١٢، ١٤، ١٨، ٢٠؟","٨","٦","٢٠","٢٠ - ١٢ = ٨."]],"التمثيل بالأعمدة":[["إذا كان ارتفاع عمود التفاح ٨ والبرتقال ٥، فما الفرق؟","٣","١٣","٤٠","نطرح ٥ من ٨."],["إذا كان عدد الكتب يوم الأحد ٤ والاثنين ٦، فما المجموع؟","١٠","٢","٢٤","نجمع ارتفاع العمودين."]]};
const aliases={"القيمة المنزلية":"القيمة المنزلية ضمن البلايين","المساحة":"مساحة المستطيل والمربع","المحيط":"محيط المضلع"};
function generate(t){const k=aliases[t]||t;if(lessonBank[k])return lessonBank[k].map(x=>q(x[0],x[1],[x[2],x[3]],x[4]));let qs=[];const add=(txt,a,w,exp)=>qs.push(q(txt,String(a),w.map(String),exp));
if(t==='المقارنة بين الأعداد'||t==='مقارنة الأعداد'||t==='مقارنة الكسور العشرية'){let dec=t.includes('العشرية');for(let i=0;i<5;i++){let a=dec?+(2+i*.17).toFixed(2):2345+i*307,b=dec?+(2+i*.17+(i%2?-.04:.06)).toFixed(2):2345+i*307+(i%2?-45:70);let ans=a>b?'>':'<';add('اختاري الرمز: '+ar(a)+' ... '+ar(b),ans,['>','<','='].filter(x=>x!==ans),'نقارن المنازل من اليسار إلى اليمين.')}return qs}
if(t==='ترتيب الأعداد والكسور العشرية'){for(let i=0;i<5;i++){let a=i+1,b=i+2,c=i+3;add('أي ترتيب تصاعدي صحيح؟',ar(a)+'، '+ar(b)+'، '+ar(c),[ar(c)+'، '+ar(b)+'، '+ar(a),ar(b)+'، '+ar(a)+'، '+ar(c)],'الترتيب التصاعدي يبدأ بالأصغر.')}return qs}
if(t==='القواسم والمضاعفات'||t==='القواسم المشتركة'||t==='القاسم المشترك الأكبر'){const gcd=(x,y)=>y?gcd(y,x%y):x;for(const [a,b] of [[12,18],[8,20],[15,25],[16,24],[9,27]]){let g=gcd(a,b);add('ما القاسم المشترك الأكبر للعددين '+ar(a)+' و'+ar(b)+'؟',g,[g+1,g+2],'نكتب القواسم ونختار أكبر قاسم مشترك.')}return qs}
if(t==='المضاعفات المشتركة'||t==='المضاعف المشترك الأصغر'){const gcd=(x,y)=>y?gcd(y,x%y):x;for(const [a,b] of [[2,3],[3,4],[4,6],[5,10],[6,8]]){let l=a*b/gcd(a,b);add('ما المضاعف المشترك الأصغر للعددين '+ar(a)+' و'+ar(b)+'؟',l,[l+a,l+b],'نبحث عن أصغر مضاعف مشترك.')}return qs}
if(t==='الأعداد الأولية والأعداد غير الأولية'){for(const n of [2,9,11,15,17]){let prime=[2,11,17].includes(n);add('هل العدد '+ar(n)+' أولي؟',prime?'أولي':'غير أولي',[prime?'غير أولي':'أولي'],'العدد الأولي له عاملان فقط.')}return qs}
if(t==='ترتيب العمليات'){for(const [expr,ans,ex] of [['٦ + ٣ × ٤',18,'نضرب قبل الجمع.'],['(٦ + ٣) × ٤',36,'نحسب القوس أولًا.'],['٢٠ - ١٢ ÷ ٣',16,'نقسم قبل الطرح.'],['٥ × (٨ - ٣)',25,'نحسب القوس ثم نضرب.'],['١٨ ÷ ٣ + ٧',13,'نقسم قبل الجمع.']])add('احسبي: '+expr,ans,[ans+3,ans+6],ex);return qs}
if(t==='محيط المضلع'){for(let i=1;i<=5;i++){let a=i+3,b=i+2;add('محيط مستطيل طوله '+ar(a)+' وعرضه '+ar(b)+'؟',2*(a+b),[a*b,a+b],'المحيط ضعف مجموع الطول والعرض.')}return qs}
if(t==='مساحة المستطيل والمربع'){for(let i=1;i<=5;i++){let a=i+3,b=i+2;add('مساحة مستطيل طوله '+ar(a)+' وعرضه '+ar(b)+'؟',a*b,[2*(a+b),a+b],'المساحة = الطول × العرض.')}return qs}
if(t==='وحدات الزمن'||t==='قياس الزمن المنقضي'){for(let i=1;i<=5;i++){let h=i+1;add('كم دقيقة في '+ar(h)+' ساعات؟',h*60,[h*30,h*100],'الساعة ٦٠ دقيقة.')}return qs}
if(t==='معادلات الضرب'){for(let i=2;i<=6;i++)add('إذا كان '+ar(i)+' × س = '+ar(i*4)+'، فما س؟',4,[i,i+4],'نقسم الطرفين على '+ar(i)+'.');return qs}
if(t==='معادلات الجمع والطرح'){for(let i=1;i<=5;i++)add('س + '+ar(i+3)+' = '+ar(i+10)+'، فما س؟',7,[i+3,i+10],'نطرح '+ar(i+3)+' من الطرفين.');return qs}
if(t==='الكسور المتكافئة'){for(let i=1;i<=5;i++){let n=i+1,d=i+3;add('ما الكسر المكافئ لـ '+ar(n)+'/'+ar(d)+' عند ضرب البسط والمقام في ٢؟',ar(n*2)+'/'+ar(d*2),[ar(n)+'/'+ar(d*2),ar(n*2)+'/'+ar(d)],'نضرب البسط والمقام في العدد نفسه.')}return qs}
return []}
function start(t){lesson=t;questions=generate(t);if(!questions.length){alert('هذه المهارة قيد إعداد أسئلة خاصة بها. لن نعرض أسئلة لا تتوافق مع الدرس.');return}idx=score=0;$('browse').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');render()}
function render(){locked=false;let x=questions[idx];$('heading').textContent=lesson;$('counter').textContent='السؤال '+ar(idx+1)+' من '+ar(questions.length);$('question').textContent=x.text;$('feedback').classList.add('hidden');$('next').classList.add('hidden');let options=[...x.choices].sort((a,b)=>a.localeCompare(b,'ar'));$('options').replaceChildren();options.forEach(v=>{let b=document.createElement('button');b.className='btn opt';b.textContent=v;b.onclick=()=>answer(v,b);$('options').append(b)})}
function answer(v,b){if(locked)return;locked=true;let x=questions[idx],correct=v===x.answer;if(correct)score++;b.classList.add(correct?'good':'bad');$('options').querySelectorAll('button').forEach(el=>{el.disabled=true;if(el.textContent===x.answer)el.classList.add('good')});$('feedback').textContent=(correct?'🌟 إجابة صحيحة! ':'💡 الإجابة الصحيحة: '+x.answer+'. ')+x.explain;$('feedback').classList.remove('hidden');$('next').classList.remove('hidden');$('next').textContent=idx===questions.length-1?'عرض النتيجة ←':'السؤال التالي ←'}
function advance(){idx++;if(idx<questions.length){render();return}finish()}
function finish(){$('game').classList.add('hidden');$('end').classList.remove('hidden');$('summary').textContent='أكملتِ مراجعة '+lesson+' وأجبتِ إجابة صحيحة عن '+ar(score)+' من '+ar(questions.length)+' أسئلة. يمكنك إعادة التدريب متى شئتِ.'}
function back(){$('game').classList.add('hidden');$('end').classList.add('hidden');$('browse').classList.remove('hidden')}
function restart(){start(lesson)}
</script></body></html>
