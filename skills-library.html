<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة المهارات الرياضية | جوهرة ماث</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#061521,#133c55);color:#f3fbff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}main{max-width:970px;margin:auto;padding:20px 15px 70px}h1{color:#edc87d;font-size:clamp(25px,5vw,38px)}h2{color:#95e9ee}p{line-height:1.8}.card{background:#102e43;border:1px solid #45677d;border-radius:18px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.btn{background:#195c70;color:white;border:1px solid #7dc8d8;border-radius:12px;padding:13px;cursor:pointer;font:inherit;min-height:46px;text-align:right}.btn:hover{background:#247c8d}.gold{background:#765820;border-color:#eecb82}.opt{width:100%;display:block;margin:10px 0}.good{background:#17644b;border-color:#8bf4c1}.bad{background:#70383d;border-color:#ffadad}.hidden{display:none}.row{display:flex;flex-wrap:wrap;gap:10px}.muted{color:#bed1dc}input,select{background:#092638;color:white;border:1px solid #83b2c8;border-radius:11px;padding:12px;width:100%;font:inherit;margin:6px 0 13px}.note{padding:13px;background:#24506a;border-radius:12px;margin:12px 0}a{color:#9ce7f0}@media print{body{background:white;color:black}.btn,.noprint{display:none}.card{background:white;color:black;border:1px solid #aaa}}</style></head><body><main><a class="noprint" href="index.html">← بوابة جوهرة ماث</a><h1>💎 مكتبة المهارات الرياضية</h1><p>اختاري الصف ثم الوحدة والمهارة. مراجعة ذاتية تفاعلية مع تصحيح فوري وشرح الإجابة، دون تسجيل أسماء أو حفظ درجات.</p><section class="card" id="browse"><h2>اختاري الصف</h2><div class="row"><button class="btn" onclick="grade='خامس';draw()">🌟 الخامس</button><button class="btn" onclick="grade='سادس';draw()">💎 السادس</button></div><div id="catalog"></div></section><section id="game" class="card hidden"><button class="btn noprint" onclick="back()">← عودة للمكتبة</button><h2 id="heading"></h2><p id="counter"></p><h2 id="question"></h2><div id="options"></div><p id="feedback" class="note hidden"></p><button id="next" class="btn gold hidden" onclick="advance()">السؤال التالي ←</button></section><section id="end" class="card hidden"><h2>🌟 انتهت المراجعة</h2><p id="summary"></p><p class="muted">هذه مراجعة للتعلم الذاتي فقط؛ لا تُرسل النتائج ولا تُحفظ بيانات الطالبات.</p><div class="row"><button class="btn gold" onclick="restart()">إعادة التدريب</button><button class="btn" onclick="back()">مكتبة المهارات</button></div></section><p class="muted">إعداد المعلمة/ جواهر السبيعي</p></main><script>
const units={"خامس":[["القيمة المنزلية",["القيمة المنزلية ضمن البلايين","الصيغة التحليلية والقياسية","الصيغة اللفظية","المقارنة بين الأعداد","تمثيل الكسور العشرية","القيمة المنزلية ضمن أجزاء الألف","مقارنة الكسور العشرية","ترتيب الأعداد والكسور العشرية"]],["العبارات الجبرية والمعادلات",["عبارات الجمع والطرح الجبرية","عبارات الضرب والقسمة الجبرية","جداول الدوال","ترتيب العمليات","معادلات الجمع والطرح","معادلات الضرب"]],["القواسم والمضاعفات والكسور",["القواسم والمضاعفات","القواسم المشتركة","الأعداد الأولية والأعداد غير الأولية","الكسور المتكافئة","تبسيط الكسور","المضاعفات المشتركة","مقارنة الكسور الاعتيادية"]],["الهندسة",["مفردات هندسية","الأشكال الرباعية","الأزواج المرتبة","تمثيل الدوال","الانسحاب","الانعكاس","الدوران"]],["المحيط والمساحة والحجم",["محيط المضلع","المساحة","مساحة المستطيل والمربع","الأشكال ثلاثية الأبعاد","حجم المنشور"]],["وحدات القياس",["وحدات الطول","وحدات الكتلة","وحدات السعة","وحدات الزمن","قياس الزمن المنقضي"]],["الإحصاء والاحتمال",["المتوسط الحسابي والوسيط والمنوال","التمثيل بالأعمدة المزدوجة","تحليل التمثيل بالأعمدة المزدوجة","الاحتمال","الاحتمال والكسور","تحديد النواتج الممكنة"]]],"سادس":[["الأعداد والعمليات",["القيمة المنزلية","مقارنة الأعداد","ترتيب العمليات","العوامل الأولية","القاسم المشترك الأكبر","المضاعف المشترك الأصغر"]],["الكسور الاعتيادية",["الكسور المتكافئة","تبسيط الكسور","مقارنة الكسور الاعتيادية","تحويل الكسور","جمع الكسور","طرح الكسور"]],["الكسور العشرية",["مقارنة الكسور العشرية","جمع الكسور العشرية","طرح الكسور العشرية","ضرب الكسور العشرية","قسمة الكسور العشرية"]],["القياس والهندسة",["وحدات الطول","وحدات الكتلة","المحيط","المساحة","حجم المنشور"]],["الإحصاء والاحتمال",["المتوسط الحسابي والوسيط والمنوال","المدى","التمثيل بالأعمدة","الاحتمال"]]]};
let grade='',lesson='',questions=[],idx=0,score=0,locked=false;
const $=id=>document.getElementById(id),ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function draw(){let groups=units[grade]||[];$('catalog').innerHTML='<h2>'+grade+'</h2>'+groups.map(([u,ls],i)=>'<div class="card"><h3>'+u+'</h3><div class="grid">'+ls.map((t,j)=>'<button class="btn" data-i="'+i+'" data-j="'+j+'">💠 '+t+'</button>').join('')+'</div></div>').join('');$('catalog').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>start(groups[+b.dataset.i][1][+b.dataset.j]));}
function q(text,answer,wrong,explain){return {text,answer:String(answer),choices:[String(answer),...wrong.map(String)].filter((x,i,a)=>a.indexOf(x)===i).slice(0,4),explain};}
function generate(t){
const qs=[];const add=(text,answer,wrong,explain)=>qs.push(q(text,answer,wrong,explain));
if(t==='المقارنة بين الأعداد'||t==='مقارنة الأعداد'||t==='مقارنة الكسور العشرية'){const dec=t.includes('العشرية');for(let i=0;i<5;i++){let a=dec?+(2+i*.17).toFixed(2):2345+i*307,b=dec?+(2+i*.17+(i%2?-.04:.06)).toFixed(2):2345+i*307+(i%2?-45:70);add('اختاري الرمز: '+ar(a)+' ... '+ar(b),a>b?'>':'<',['>','<','='].filter(x=>x!==(a>b?'>':'<')),'نقارن المنازل من اليسار إلى اليمين، ونستخدم > للأكبر و < للأصغر.')}return qs}
if(t==='ترتيب الأعداد والكسور العشرية'){for(let i=0;i<5;i++){let a=i+1,b=i+2,c=i+3;add('أي ترتيب تصاعدي صحيح؟',ar(a)+'، '+ar(b)+'، '+ar(c),[ar(c)+'، '+ar(b)+'، '+ar(a),ar(b)+'، '+ar(a)+'، '+ar(c)],'الترتيب التصاعدي يبدأ بالأصغر ثم الأكبر.')}return qs}
if(t==='القواسم والمضاعفات'||t==='القواسم المشتركة'||t==='القاسم المشترك الأكبر'){for(const [a,b] of [[12,18],[8,20],[15,25],[16,24],[9,27]]){const gcd=(x,y)=>y?gcd(y,x%y):x;let g=gcd(a,b);add('ما القاسم المشترك الأكبر للعددين '+ar(a)+' و'+ar(b)+'؟',g,[g+1,g+2,a+b],'نكتب قواسم العددين، ثم نختار أكبر قاسم مشترك بينهما.')}return qs}
if(t==='المضاعفات المشتركة'||t==='المضاعف المشترك الأصغر'){for(const [a,b] of [[2,3],[3,4],[4,6],[5,10],[6,8]]){const gcd=(x,y)=>y?gcd(y,x%y):x;let l=a*b/gcd(a,b);add('ما المضاعف المشترك الأصغر للعددين '+ar(a)+' و'+ar(b)+'؟',l,[l+a,l+b,a+b],'نكتب مضاعفات العددين حتى نجد أصغر مضاعف مشترك.')}return qs}
if(t==='الأعداد الأولية والأعداد غير الأولية'||t==='العوامل الأولية'){for(const n of [2,9,11,15,17]){const prime=[2,11,17].includes(n);add('هل العدد '+ar(n)+' أولي؟',prime?'أولي':'غير أولي',[prime?'غير أولي':'أولي'],'الأولي له عاملان فقط: ١ والعدد نفسه.')}return qs}
if(t==='ترتيب العمليات'){for(const [expr,ans,ex] of [['٦ + ٣ × ٤',18,'نضرب قبل الجمع.'],['(٦ + ٣) × ٤',36,'نحسب القوس أولًا.'],['٢٠ - ١٢ ÷ ٣',16,'نقسم قبل الطرح.'],['٥ × (٨ - ٣)',25,'نحسب القوس ثم نضرب.'],['١٨ ÷ ٣ + ٧',13,'نقسم قبل الجمع.']])add('احسبي: '+expr,ans,[ans+3,ans+6,ans-2],ex);return qs}
if(t==='محيط المضلع'||t==='المحيط'){for(let i=1;i<=5;i++){let a=i+3,b=i+2;add('محيط مستطيل طوله '+ar(a)+' وعرضه '+ar(b)+'؟',2*(a+b),[a*b,a+b,2*a+b],'محيط المستطيل يساوي ضعف مجموع الطول والعرض.')}return qs}
if(t==='المساحة'||t==='مساحة المستطيل والمربع'){for(let i=1;i<=5;i++){let a=i+3,b=i+2;add('مساحة مستطيل طوله '+ar(a)+' وعرضه '+ar(b)+'؟',a*b,[2*(a+b),a+b,a*b+2],'المساحة = الطول × العرض.')}return qs}
if(t==='وحدات الزمن'||t==='قياس الزمن المنقضي'){for(let i=1;i<=5;i++){let h=i+1;add('كم دقيقة في '+ar(h)+' ساعات؟',h*60,[h*30,h*100,h+60],'الساعة ٦٠ دقيقة؛ نضرب في ٦٠.')}return qs}
if(t==='معادلات الضرب'){for(let i=2;i<=6;i++)add('إذا كان '+ar(i)+' × س = '+ar(i*4)+'، فما س؟',4,[i,i+4,i*4],'نقسم طرفي المعادلة على '+ar(i)+'.');return qs}
if(t==='معادلات الجمع والطرح'){for(let i=1;i<=5;i++)add('س + '+ar(i+3)+' = '+ar(i+10)+'، فما س؟',7,[i+3,i+10,10],'نطرح '+ar(i+3)+' من طرفي المعادلة.');return qs}
if(t==='الكسور المتكافئة'){for(let i=1;i<=5;i++){let n=i+1,d=i+3;add('ما الكسر المكافئ لـ '+ar(n)+'/'+ar(d)+' عند ضرب البسط والمقام في ٢؟',ar(n*2)+'/'+ar(d*2),[ar(n)+'/'+ar(d*2),ar(n*2)+'/'+ar(d),ar(n+1)+'/'+ar(d+1)],'نضرب البسط والمقام في العدد نفسه.')}return qs}
return [];
}
function start(t){lesson=t;questions=generate(t);if(!questions.length){alert('هذه المهارة قيد إعداد أسئلة خاصة بها. لن نعرض أسئلة لا تتوافق مع الدرس.');return}idx=score=0;$('browse').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');render()}
function render(){locked=false;let x=questions[idx];$('heading').textContent=lesson;$('counter').textContent='السؤال '+ar(idx+1)+' من '+ar(questions.length);$('question').textContent=x.text;$('feedback').classList.add('hidden');$('next').classList.add('hidden');let options=[...x.choices].sort((a,b)=>a.localeCompare(b,'ar'));$('options').replaceChildren();options.forEach(v=>{let b=document.createElement('button');b.className='btn opt';b.textContent=v;b.onclick=()=>answer(v,b);$('options').append(b)})}
function answer(v,b){if(locked)return;locked=true;let x=questions[idx],correct=v===x.answer;if(correct)score++;b.classList.add(correct?'good':'bad');$('options').querySelectorAll('button').forEach(el=>{el.disabled=true;if(el.textContent===x.answer)el.classList.add('good')});$('feedback').textContent=(correct?'🌟 إجابة صحيحة! ':'💡 الإجابة الصحيحة: '+x.answer+'. ')+x.explain;$('feedback').classList.remove('hidden');$('next').classList.remove('hidden');$('next').textContent=idx===questions.length-1?'عرض النتيجة ←':'السؤال التالي ←'}
function advance(){idx++;if(idx<questions.length){render();return}finish()}
function finish(){$('game').classList.add('hidden');$('end').classList.remove('hidden');$('summary').textContent='أكملتِ مراجعة '+lesson+' وأجبتِ إجابة صحيحة عن '+ar(score)+' من '+ar(questions.length)+' أسئلة. يمكنك إعادة التدريب متى شئتِ.'}
function back(){$('game').classList.add('hidden');$('end').classList.add('hidden');$('browse').classList.remove('hidden')}
function restart(){start(lesson)}
</script></body></html>
