const setup=document.getElementById('setup'),stage=document.getElementById('stage'),nameEl=document.getElementById('name'),finalEl=document.getElementById('final'),audio=document.getElementById('audio'),again=document.getElementById('again'),fallLayer=document.getElementById('fallLayer');
function celebrate(big=false){const icons=['✨','⭐','🎉','💫','🏆'];const count=big?52:26;for(let j=0;j<count;j++){const el=document.createElement('span');el.className='fall-item';el.textContent=icons[Math.floor(Math.random()*icons.length)];el.style.left=(Math.random()*96)+'%';el.style.fontSize=(18+Math.random()*(big?24:18))+'px';el.style.animationDuration=(2.2+Math.random()*2.2)+'s';el.style.animationDelay=(Math.random()*.8)+'s';el.style.setProperty('--drift',(-70+Math.random()*140)+'px');el.style.setProperty('--spin',(-360+Math.random()*720)+'deg');fallLayer.appendChild(el);setTimeout(()=>el.remove(),5200);}}
document.getElementById('start').addEventListener('click',async()=>{const names=document.getElementById('names').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!names.length){alert('اكتبي اسم طالبة واحدة على الأقل 💚');return;}setup.style.display='none';stage.style.display='block';try{audio.currentTime=0;await audio.play();}catch(e){}let i=0;const show=()=>{if(i<names.length){nameEl.textContent=names[i];nameEl.style.animation='none';void nameEl.offsetWidth;nameEl.style.animation='pop .65s ease';celebrate(false);i++;setTimeout(show,3000);}else{nameEl.textContent='بطلات القسمة 🏆';document.getElementById('msg').textContent='إتقانكن اليوم… بداية لإنجازات أكبر ✨';finalEl.innerHTML=names.map(n=>'⭐ '+n).join('<br>');again.style.display='inline-block';celebrate(true);}};show();});
again.addEventListener('click',()=>{audio.pause();fallLayer.innerHTML='';stage.style.display='none';setup.style.display='block';finalEl.innerHTML='';again.style.display='none';});
